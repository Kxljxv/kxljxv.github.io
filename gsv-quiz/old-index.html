        // State variables - NO localStorage usage
        let currentQuestion = 0;
        let correctAnswers = 0;
        let selectedAnswer = null;

        // Initialize quiz
        function initQuiz() {
            currentQuestion = 0;
            correctAnswers = 0;
            selectedAnswer = null;
            showQuestion();
            updateProgressBar();
        }

        // Display current question
        function showQuestion() {
            const question = quizData[currentQuestion];
            const quizContent = document.getElementById('quizContent');
            
            let html = `
                <div class="question-section">
                    <div class="question-number">Frage ${currentQuestion + 1} von ${quizData.length}</div>
                    <div class="question-text">${question.question}</div>
                    
                    <div class="answers">
            `;
            
            question.answers.forEach((answer, index) => {
                html += `
                    <div class="answer-option" id="option-${index}">
                        <label class="answer-label">
                            <input type="radio" name="answer" value="${index}" onchange="selectAnswer(${index})">
                            ${answer}
                        </label>
                        <div class="explanation" id="explanation-${index}">
                            ${question.explanations[index]}
                        </div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                    
                    <div class="navigation">
                        <button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'style="visibility: hidden;"' : ''}>
                            ← Zurück
                        </button>
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>
                            ${currentQuestion === quizData.length - 1 ? 'Ergebnis anzeigen' : 'Nächste Frage →'}
                        </button>
                    </div>
                </div>
            `;
            
            quizContent.innerHTML = html;
        }

        // Handle answer selection
        function selectAnswer(index) {
            if (selectedAnswer !== null) return; // Prevent multiple selections
            
            selectedAnswer = index;
            const question = quizData[currentQuestion];
            const isCorrect = index === question.correct;
            
            // Update score
            if (isCorrect) {
                correctAnswers++;
            }
            
            // Show feedback for selected answer
            const selectedOption = document.getElementById(`option-${index}`);
            const selectedExplanation = document.getElementById(`explanation-${index}`);
            
            if (isCorrect) {
                selectedOption.classList.add('selected-correct');
                selectedExplanation.classList.add('active', 'correct');
            } else {
                selectedOption.classList.add('selected-wrong');
                selectedExplanation.classList.add('active', 'wrong');
                
                // Also show the correct answer
                const correctOption = document.getElementById(`option-${question.correct}`);
                const correctExplanation = document.getElementById(`explanation-${question.correct}`);
                correctOption.classList.add('show-correct');
                correctExplanation.classList.add('active', 'correct');
            }
            
            // Disable all radio buttons
            const radioButtons = document.querySelectorAll('input[type="radio"]');
            radioButtons.forEach(btn => btn.disabled = true);
            
            // Enable next button
            document.getElementById('nextBtn').disabled = false;
        }

        // Next question
        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                selectedAnswer = null;
                showQuestion();
                updateProgressBar();
            } else {
                showResults();
            }
        }

        // Previous question
        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                selectedAnswer = null;
                showQuestion();
                updateProgressBar();
            }
        }

        // Update progress bar
        function updateProgressBar() {
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Show final results
        function showResults() {
            document.getElementById('quizContent').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');
            
            const percentage = Math.round((correctAnswers / quizData.length) * 100);
            document.getElementById('scoreCircle').textContent = `${correctAnswers}/${quizData.length}`;
            
            let evaluation = '';
            if (correctAnswers >= 30) {
                evaluation = `🌟 Ausgezeichnet! Mit ${correctAnswers} von ${quizData.length} richtigen Antworten (${percentage}%) kennst du dich hervorragend mit den Rechten und Pflichten der Schülervertretung in Berlin aus. Du bist bestens vorbereitet, um in der SV aktiv mitzuwirken!`;
            } else if (correctAnswers >= 25) {
                evaluation = `👏 Sehr gut! Du hast ${correctAnswers} von ${quizData.length} Fragen richtig beantwortet (${percentage}%). Du hast ein solides Verständnis der Berliner SV-Strukturen und kannst damit gut in der Schülervertretung arbeiten.`;
            } else if (correctAnswers >= 20) {
                evaluation = `👍 Gut! Mit ${correctAnswers} von ${quizData.length} richtigen Antworten (${percentage}%) kennst du die wichtigsten Grundlagen. Es gibt noch einige Details, die du vertiefen könntest, aber du hast eine gute Basis.`;
            } else if (correctAnswers >= 15) {
                evaluation = `📚 Befriedigend. Du hast ${correctAnswers} von ${quizData.length} Fragen richtig beantwortet (${percentage}%). Es gibt noch einige Bereiche, in denen du dich weiter einlesen solltest, um sicher in der SV-Arbeit zu werden.`;
            } else {
                evaluation = `📖 Hier besteht noch Nachholbedarf. Mit ${correctAnswers} von ${quizData.length} richtigen Antworten (${percentage}%) solltest du dir das Berliner Schulgesetz (§§ 83-87, 75-78, 110) noch einmal genau durchlesen!`;
            }
            
            document.getElementById('resultsText').innerHTML = evaluation;
        }

        // Restart quiz
        function restartQuiz() {
            document.getElementById('results').classList.add('hidden');
            document.getElementById('quizContent').classList.remove('hidden');
            initQuiz();
        }

        // Start quiz on page load
        window.onload = initQuiz;
    </script>
