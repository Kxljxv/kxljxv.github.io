<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>3D GeoJSON Visualization with MapLibre</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #menu {
            position: absolute;
            background: #fff;
            padding: 10px;
            font-family: 'Arial', sans-serif;
            z-index: 1;
        }
    </style>
</head>
<body>
<div id="menu">
    <label for="colorField">Color by: </label>
    <select id="colorField"></select>
</div>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [13.405, 52.52], // Centered on Berlin
        zoom: 10,
        pitch: 45,
        bearing: -17.6,
        antialias: true
    });

    map.addControl(new maplibregl.NavigationControl());

    const geojsonUrl = 'https://kxljxv.github.io/wahlergebnisse/pankow2025erg3d.json';

    fetch(geojsonUrl)
        .then(response => response.json())
        .then(data => {
            const properties = data.features[0].properties;
            const excludedFields = ['UWB', 'hoehe', 'funktion_t'];
            const numericalFields = Object.keys(properties).filter(key => 
                !excludedFields.includes(key) && typeof properties[key] === 'number' && properties[key] >= 0 && properties[key] <= 1
            );

            const select = document.getElementById('colorField');
            numericalFields.forEach(field => {
                const option = document.createElement('option');
                option.value = field;
                option.textContent = field;
                select.appendChild(option);
            });

            map.on('load', () => {
                map.addSource('geojson-data', {
                    type: 'geojson',
                    data: data
                });

                map.addLayer({
                    id: '3d-extrusion',
                    type: 'fill-extrusion',
                    source: 'geojson-data',
                    paint: {
                        'fill-extrusion-height': ['get', 'hoehe'],
                        'fill-extrusion-color': [
                            'interpolate',
                            ['linear'],
                            ['get', numericalFields[0]],
                            0, 'green',
                            1, 'red'
                        ],
                        'fill-extrusion-opacity': 0.8
                    }
                });

                select.addEventListener('change', (event) => {
                    const selectedField = event.target.value;
                    map.setPaintProperty('3d-extrusion', 'fill-extrusion-color', [
                        'interpolate',
                        ['linear'],
                        ['get', selectedField],
                        0, 'green',
                        1, 'red'
                    ]);
                });
            });
        })
        .catch(error => console.error('Error loading GeoJSON data:', error));
</script>
</body>
</html>
