<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchulG Berlin - Gesetzesviewer</title>
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./progressive_blur_top.css">
    <link rel="stylesheet" href="./progressive_blur_bottom.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 24px;
            background: #1e1f22; /* dunkler Grauton */
            color: #e6e6e6;
            line-height: 1.65;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: transparent; /* keine Box mehr */
            border-radius: 16px;
            box-shadow: none;
            overflow: visible;
        }
        
        .liquid-glass {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: saturate(140%) blur(8px);
            -webkit-backdrop-filter: saturate(140%) blur(8px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 16px;
            position: sticky;
            top: 24px;
            z-index: 50;
        }
        .header-left h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #f1f3f5;
        }
        .current-info {
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            color: #f8fafc;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .current-info .law-name {
            opacity: 0.9;
            font-weight: 600;
        }
        .current-info .sep {
            opacity: 0.35;
        }
        
        .law-nav {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .law-nav a {
            text-decoration: none;
            color: #e6e6e6;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(6px) saturate(130%);
            -webkit-backdrop-filter: blur(6px) saturate(130%);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .law-nav a:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        .law-nav a.active-law {
            background: rgba(80, 180, 255, 0.18);
            border-color: rgba(80, 180, 255, 0.35);
        }
        
        .content {
            position: relative;
            margin-top: 18px;
            padding: 16px 0; /* keine Box-Polsterung, nur für Blur-Freiraum */
        }
        .section-title {
            font-size: 1.6em;
            font-weight: 700;
            color: #cfe2ff;
            margin: 28px 0 12px 0;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .paragraph-content p {
            margin: 0 0 18px 0;
            font-size: 1.08em;
            color: #f0f0f0;
        }
        .paragraph-content p.highlighted {
            background: rgba(231, 76, 60, 0.12);
            border-left: 4px solid #e74c3c;
            padding-left: 10px;
            border-radius: 6px;
        }
        .paragraph-content h3, .paragraph-content h4, .paragraph-content h5, .paragraph-content h6 {
            color: #a0c4ff;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 10px;
        }
        
        .law-link {
            color: #80bfff;
            text-decoration: none;
            border-bottom: 1px dashed rgba(128,191,255,0.5);
        }
        .law-link:hover {
            color: #a6d1ff;
            border-bottom-color: rgba(166,209,255,0.8);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #b5b5b5;
            font-size: 1.05em;
        }
        
        .jump-links { display: none; }
        /* Layout-Fixes */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { width: 100%; overflow-x: hidden; }
        .container { margin-top: 120px; overflow-x: hidden; }
        .content { overflow-x: hidden; }
        .progressive-blur-top, .progressive-blur-bottom { max-width: 100%; overflow: hidden; }

        /* Header fixiert zentriert oben */
        .header {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 1100px;
            top: 24px;
            z-index: 100;
        }

        /* Popover Styles für Gesetzeslinks */
        .law-popover {
            position: fixed;
            z-index: 200;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.30);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            padding: 12px 14px;
            max-width: 520px;
            min-width: 280px;
            color: #f0f0f0;
            pointer-events: none;
            display: none;
        }
        .law-popover-title {
            font-weight: 700;
            font-size: 15px;
            color: #eaf2ff;
            text-align: center;
            margin: 0 0 8px 0;
        }
        .law-popover-content {
            max-height: none;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 12;
            text-overflow: ellipsis;
            font-size: 14px;
            line-height: 1.55;
        }
        .law-popover-content p { margin: 0 0 10px 0; }
        /* Scroll container for law tables */
        .law-table-scroll {
            overflow-x: auto;
            overflow-y: visible;
            border-radius: 12px;
        }
        .law-table-inner {
             min-width: 100%;
         }
         .law-table {
             width: 100%; /* Tabelle spannt volle verfügbare Breite */
             table-layout: fixed; /* gleichmäßige Spaltenbreite, bessere Umbrüche */
             border-collapse: collapse;
         }
         .law-table td, .law-table th {
             white-space: normal;
             overflow-wrap: anywhere; /* bricht auch lange zusammenhängende Wörter/URLs */
             word-break: break-word;  /* Fallback für ältere Browser */
             hyphens: auto;           /* automatische Silbentrennung, wo möglich */
         }
         .law-cell-wrap {
             /* max-width entfernt, damit Zellen die volle Breite nutzen können */
             width: 100%;
             display: block;
             white-space: normal;
             overflow-wrap: anywhere;
             word-break: break-word;
             hyphens: auto;
         }
       </style>
</head>
<body>
    <div class="container">
        <div class="header liquid-glass">
            <div class="header-left">
                <h1>Rechtsviewer</h1>
            </div>
            <div class="header-right">
                <div id="currentInfo" class="current-info liquid-glass"></div>
            </div>
        </div>
        <div class="law-nav liquid-glass" id="lawNav"></div>
        <div class="content" id="content">
            <!-- Progressive Blur Top -->
            <div class="progressive-blur-top">
                <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
            </div>
            <!-- Progressive Blur Bottom -->
            <div class="progressive-blur-bottom">
                <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
            </div>
            <div class="loading">Lade Gesetzestext...</div>
        </div>
    </div>
    
    <div class="jump-links" id="jumpLinks" style="display: none;">
        <h4>Schnellnavigation</h4>
        <div id="jumpLinksContent"></div>
    </div>

    <script>
        let xmlData = null;
        let paragraphPositions = {};
        let currentParagraph = null;
        let currentLawFile = null;
        let lawFiles = [];
         let lawXMLCache = {};
        // Dynamisch alle XML-Dateien im Verzeichnis finden
        async function fetchLawFiles() {
            try {
                const resp = await fetch('laws/laws.txt');
                const text = await resp.text();
                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
                lawFiles = lines.map(l => {
                    const [file, name] = l.split('|');
                    return { file: `laws/${file.trim()}`, name: (name || file).trim() };
                });
            } catch (e) {
                // Fallback falls Datei fehlt
                lawFiles = [
                    {file: 'laws/SchulG_BE.xml', name: 'Schulgesetz'},
                    {file: 'laws/LernMV_BE_2010.xml', name: 'LernmittelVO'},
                    {file: 'laws/SchulGWahlO_BE.xml', name: 'Schulwahlordnung'}
                ];
            }
        }

        // Hilfsfunktion: Alias eines Rechtstextes in Datei auflösen
         function resolveLawFile(alias) {
             if (!alias) return null;
             const a = alias.toLowerCase();
             // Schulgesetz Varianten: Schulgesetz, Schulgesetzes, SchulG
             if (/schulgesetz/.test(a) || /schulg\b/.test(a)) {
                 return lawFiles.find(l => /schulg_be\.xml$/i.test(l.file))?.file || 'laws/SchulG_BE.xml';
             }
             // LernmittelVO Varianten: LernmittelVO, Lernmittelverordnung
             if (/lernmittelvo/.test(a) || /lernmittelverordnung/.test(a)) {
                 return lawFiles.find(l => /lernmv_be_2010\.xml$/i.test(l.file))?.file || 'laws/LernMV_BE_2010.xml';
             }
             // Schulwahlordnung Varianten: Schulwahlordnung, SchulwahlO
             if (/schulwahlordnung/.test(a) || /schulwahlo/.test(a)) {
                 return lawFiles.find(l => /schulgwahlo_be\.xml$/i.test(l.file))?.file || 'laws/SchulGWahlO_BE.xml';
             }
             // Fallback: keinen Treffer
             return null;
         }
 
         // --- Popover Hilfsfunktionen ---
         async function fetchLawXMLCached(lawFile) {
             try {
                 if (lawXMLCache[lawFile]) return lawXMLCache[lawFile];
                 const response = await fetch(lawFile);
                 const xmlText = await response.text();
                 const parser = new DOMParser();
                 const xml = parser.parseFromString(xmlText, 'text/xml');
                 lawXMLCache[lawFile] = xml;
                 return xml;
             } catch (e) {
                 console.error('Fehler beim Laden (Popover):', e);
                 return null;
             }
         }
 
         function findNormByPara(xml, pa) {
             if (!xml || !pa) return null;
             const norms = xml.getElementsByTagName('norm');
             for (let norm of norms) {
                 const metadaten = norm.getElementsByTagName('metadaten')[0];
                 const enbez = metadaten?.getElementsByTagName('enbez')[0]?.textContent || '';
                 const match = enbez.match(/§\s*(\d+[a-z]?)/i);
                 if (match && match[1] === pa) {
                     const textdaten = norm.getElementsByTagName('textdaten')[0];
                     return { norm, textdaten, metadaten };
                 }
             }
             return null;
         }
 
         function extractHeadingFromTextdaten(textdaten) {
             if (!textdaten) return null;
             const heading = textdaten.querySelector('h3, h4, h5, h6');
             return heading ? heading.textContent.trim() : null;
         }
 
         function fallbackTitle(metadaten) {
             if (!metadaten) return '';
             const titel = metadaten.getElementsByTagName('titel')[0]?.textContent?.trim();
             if (titel) return titel;
             const enbez = metadaten.getElementsByTagName('enbez')[0]?.textContent || '';
             return enbez.replace(/§\s*\d+[a-z]?/i, '').trim();
         }
 
         async function getParagraphExtract(lawFile, pa, abs) {
             const xml = await fetchLawXMLCached(lawFile);
             const found = findNormByPara(xml, pa);
             if (!found) return null;
             const { textdaten, metadaten } = found;
             let title = extractHeadingFromTextdaten(textdaten) || fallbackTitle(metadaten) || '';
             let contentHTML = '';
             if (abs) {
                 let absCounter = 1;
                 const paragraphs = textdaten.getElementsByTagName('p');
                 for (let i = 0; i < paragraphs.length; i++) {
                     const p = paragraphs[i];
                     const absMatch = p.textContent.match(/^\((\d+)\)/);
                     let currentAbs = absMatch ? absMatch[1] : String(absCounter);
                     if (absMatch) absCounter = parseInt(currentAbs) + 1; else absCounter++;
                     if (currentAbs === String(abs)) { contentHTML = `<p>${p.innerHTML}</p>`; break; }
                 }
             } else {
                 const paragraphs = textdaten.getElementsByTagName('p');
                 contentHTML = Array.from(paragraphs).map(p => `<p>${p.innerHTML}</p>`).join('');
             }
             if (!contentHTML) contentHTML = textdaten?.textContent || '';
             return { title, contentHTML };
         }
 
         function showLawPopover(anchor, title, contentHTML) {
             let pop = document.getElementById('lawPopover');
             if (!pop) {
                 pop = document.createElement('div');
                 pop.id = 'lawPopover';
                 pop.className = 'law-popover';
                 pop.innerHTML = `<div class="law-popover-title"></div><div class="law-popover-content"></div>`;
                 document.body.appendChild(pop);
             }
             pop.querySelector('.law-popover-title').textContent = title || '';
             pop.querySelector('.law-popover-content').innerHTML = contentHTML || '';
             const rect = anchor.getBoundingClientRect();
             let x = rect.left;
             let y = rect.bottom + 8;
             pop.style.left = `${Math.max(8, x)}px`;
             pop.style.top = `${Math.max(8, y)}px`;
             pop.style.display = 'block';
             const popRect = pop.getBoundingClientRect();
             const maxX = window.innerWidth - popRect.width - 8;
             const maxY = window.innerHeight - popRect.height - 8;
             if (x > maxX) pop.style.left = `${maxX}px`;
             if (y > maxY) {
                 const aboveY = rect.top - popRect.height - 8;
                 pop.style.top = `${aboveY < 8 ? 8 : aboveY}px`;
             }
         }
 
         function hideLawPopover() {
             const pop = document.getElementById('lawPopover');
             if (pop) pop.style.display = 'none';
         }
 
         let popoverTimer = null;
         async function handlePopoverMouseOver(e) {
             const a = e.target.closest('a.law-link');
             if (!a) return;
             if (popoverTimer) { clearTimeout(popoverTimer); popoverTimer = null; }
             try {
                 const url = new URL(a.getAttribute('href'), window.location.href);
                 const sp = url.searchParams;
                 let lawParam = sp.get('law') || currentLawFile;
                 lawParam = lawParam.startsWith('laws/') ? lawParam : `laws/${lawParam}`;
                 const pa = sp.get('pa');
                 const abs = sp.get('abs');
                 if (!pa) return;
                 const extract = await getParagraphExtract(lawParam, pa, abs);
                 if (!extract) return;
                 showLawPopover(a, extract.title || `§ ${pa}`, extract.contentHTML);
             } catch (err) { /* schlucken */ }
         }
 
         function handlePopoverMouseOut(e) {
             const a = e.target.closest('a.law-link');
             if (!a) return;
             popoverTimer = setTimeout(() => hideLawPopover(), 120);
         }
 
         // Navigation links anzeigen
        function renderSideNav() {
            const nav = document.getElementById('lawNav');
            nav.innerHTML = '';
            lawFiles.forEach(law => {
                const active = law.file === currentLawFile ? 'active-law' : '';
                nav.innerHTML += `<a href="?law=${encodeURIComponent(law.file)}" class="law-nav-link ${active}">${law.name}</a>`;
            });
        }

        function renderCurrentInfo() {
            const infoEl = document.getElementById('currentInfo');
            if (!infoEl) return;
            const params = parseURLParams();
            const lawName = lawFiles.find(l => l.file === currentLawFile)?.name || currentLawFile;
            const parts = [];
            parts.push(`<span class="law-name">${lawName}</span>`);
            if (params.pa) parts.push(`<span class="sep">•</span><span>§ ${params.pa}</span>`);
            if (params.abs) parts.push(`<span class="sep">•</span><span>Abs. ${params.abs}</span>`);
            infoEl.innerHTML = parts.join(' ');
        }

        // URL-Parameter parsen
        function parseURLParams() {
            const params = new URLSearchParams(window.location.search);
            const defaultLaw = lawFiles[0]?.file || 'laws/SchulG_BE.xml';
            const paramLaw = params.get('law');
            const normalizedLaw = paramLaw ? (paramLaw.startsWith('laws/') ? paramLaw : `laws/${paramLaw}`) : defaultLaw;
            return {
                law: normalizedLaw,
                pa: params.get('pa') || null,
                abs: params.get('abs') || null,
                satz: params.get('satz') || null,
                nr: params.get('nr') || null
            };
        }

        // URL aktualisieren
        function updateURL(params) {
            const url = new URL(window.location);
            Object.keys(params).forEach(key => {
                if (params[key] !== null && params[key] !== undefined) {
                    url.searchParams.set(key, params[key]);
                } else {
                    url.searchParams.delete(key);
                }
            });
            window.history.replaceState({}, '', url);
        }

        // XML-Daten laden
        async function loadXMLData(lawFile) {
            try {
                const response = await fetch(lawFile);
                const xmlText = await response.text();
                const parser = new DOMParser();
                xmlData = parser.parseFromString(xmlText, 'text/xml');
                return xmlData;
            } catch (error) {
                console.error('Fehler beim Laden der XML-Daten:', error);
                throw error;
            }
        }

        // Inhalt anzeigen
        function displayContent() {
            if (!xmlData) return;
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';
            paragraphPositions = {};

            // Alle Normen durchgehen
            const norms = xmlData.getElementsByTagName('norm');
            let paraIndex = 0;
            for (let norm of norms) {
                const metadaten = norm.getElementsByTagName('metadaten')[0];
                const textdaten = norm.getElementsByTagName('textdaten')[0];
                if (!metadaten || !textdaten) continue;
                const enbez = metadaten.getElementsByTagName('enbez')[0]?.textContent || '';
                const match = enbez.match(/§\s*(\d+[a-z]?)/);
                let paraId = null;
                if (match) {
                    paraId = match[1];
                }
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'law-section';
                if (paraId) {
                    sectionDiv.id = `para-${paraId}`;
                    paragraphPositions[paraId] = sectionDiv;
                }
                // Titel nur oben anzeigen
                if (enbez) {
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'section-title';
                    titleDiv.textContent = enbez.split('\n')[2];
                    sectionDiv.appendChild(titleDiv);
                }
                // Inhalt
                if (textdaten) {
                    const content = extractTextContent(textdaten, paraId);
                    if (content) {
                        const contentDivInner = document.createElement('div');
                        contentDivInner.className = 'paragraph-content';
                        contentDivInner.innerHTML = content;
                        sectionDiv.appendChild(contentDivInner);
                    }
                }
                contentDiv.appendChild(sectionDiv);
                paraIndex++;
            }
            scrollToParagraphFromURL();
        }

        // Textinhalt extrahieren und Absätze gruppieren
        function extractTextContent(textdaten, paraId) {
            let html = '';
            const params = parseURLParams();
            let absCounter = 1;

            // Hilfsfunktionen für Link-Erkennung
            function lawContainsParagraphInCurrent(pa) {
                if (!xmlData || !pa) return false;
                const norms = xmlData.getElementsByTagName('norm');
                for (let norm of norms) {
                    const metadaten = norm.getElementsByTagName('metadaten')[0];
                    const enbez = metadaten?.getElementsByTagName('enbez')[0]?.textContent || '';
                    const m = enbez.match(/§\s*(\d+[a-z]?)/i);
                    if (m && m[1] === String(pa)) return true;
                }
                return false;
            }
            function resolveTargetLawForParagraph(pNum, lawAlias) {
                const explicit = resolveLawFile(lawAlias);
                if (explicit) return explicit;
                if (lawContainsParagraphInCurrent(pNum)) return params.law;
                // Fallback auf Schulgesetz, falls vorhanden
                const sg = lawFiles.find(l => /schulg_be\.xml$/i.test(l.file))?.file || 'laws/SchulG_BE.xml';
                return sg || params.law;
            }
            function buildUrl(lawFile, pa, abs, satz, nr) {
                let url = `?law=${encodeURIComponent(lawFile)}&pa=${pa}`;
                if (abs) url += `&abs=${abs}`;
                if (satz) url += `&satz=${satz}`;
                if (nr) url += `&nr=${nr}`;
                return url;
            }
            function linkifyParagraphText(text) {
                // §§-Bereiche: "§§ 2 bis 5 [alias]"
                text = text.replace(/§§\s*(\d+)\s*(?:bis|-)\s*(\d+)(?:\s+(des|der|das|dem|zum|zur|im|in|vom)\s+)?(Schulgesetz(?:es)?|SchulG|LernmittelVO|Lernmittelverordnung|Schulwahlordnung|SchulwahlO)?/gi,
                    function(match, startStr, endStr, prep, lawAlias) {
                        const start = parseInt(startStr, 10);
                        const end = parseInt(endStr, 10);
                        if (Number.isNaN(start) || Number.isNaN(end) || end < start) return match;
                        const lawFile = resolveTargetLawForParagraph(startStr, lawAlias);
                        const links = [];
                        for (let n = start; n <= end; n++) {
                            const url = buildUrl(lawFile, String(n));
                            links.push(`<a href='${url}' class='law-link'>§ ${n}</a>`);
                        }
                        const aliasSuffix = lawAlias ? ` ${prep || 'des'} ${lawAlias}` : '';
                        return `§§ ${links.join(', ')}${aliasSuffix}`;
                    }
                );
                // Einzel-§ inkl. Absatzliste, Satz, Halbsatz und Nummer
                text = text.replace(/§\s*(\d+[a-z]?)(?:\s*(Abs\.?|Absatz)\s*(\d+(?:\s*(?:und|,)\s*\d+)*))?(?:\s*(Satz)\s*(\d+))?(?:\s*(Nummer)\s*(\d+))?(?:\s*(Halbsatz)\s*(erster|zweiter|1|2))?(?:\s+(des|der|das|dem|zum|zur|im|in|vom)\s+)?(Schulgesetz(?:es)?|SchulG|LernmittelVO|Lernmittelverordnung|Schulwahlordnung|SchulwahlO)?/gi,
                    function(match, pNum, absLabel, absListStr, satzLabel, satzNum, nrLabel, nrNum, halbsatzLabel, halbsatzWhich, prep, lawAlias) {
                        const lawFile = resolveTargetLawForParagraph(pNum, lawAlias);
                        const aliasSuffix = lawAlias ? ` ${prep || 'des'} ${lawAlias}` : '';
                        if (absListStr) {
                            const nums = absListStr.match(/\d+/g) || [];
                            if (nums.length > 0) {
                                const firstUrl = buildUrl(lawFile, pNum, nums[0]);
                                const first = `<a href='${firstUrl}' class='law-link'>§ ${pNum} Absatz ${nums[0]}</a>`;
                                const rest = nums.slice(1).map(n => {
                                    const u = buildUrl(lawFile, pNum, n);
                                    return `<a href='${u}' class='law-link'>Absatz ${n}</a>`;
                                });
                                const joined = rest.length ? `${first} und ${rest.join(', ')}` : first;
                                return `${joined}${aliasSuffix}`;
                            }
                        }
                        const url = buildUrl(lawFile, pNum, undefined, satzNum, nrNum);
                        return `<a href='${url}' class='law-link'>${match.trim()}</a>`;
                    }
                );
                // Standalone "Absatz 1 und 2" (ohne direkt voranstehendes §)
                text = text.replace(/(?<!§\s*\d+[a-z]?\s*)(Abs\.?|Absatz)\s*(\d+(?:\s*(?:und|,)\s*\d+)*)/gi,
                    function(match, absLabel, absListStr) {
                        if (!paraId) return match;
                        const nums = absListStr.match(/\d+/g) || [];
                        if (!nums.length) return match;
                        const lawFile = params.law;
                        const firstUrl = buildUrl(lawFile, paraId, nums[0]);
                        const first = `<a href='${firstUrl}' class='law-link'>Absatz ${nums[0]}</a>`;
                        const rest = nums.slice(1).map(n => {
                            const u = buildUrl(lawFile, paraId, n);
                            return `<a href='${u}' class='law-link'>Absatz ${n}</a>`;
                        });
                        const joined = rest.length ? `${first} und ${rest.join(', ')}` : first;
                        return joined;
                    }
                );
                return text;
            }

            // Überschriften zuerst extrahieren und ganz oben anzeigen (Duplikate wie "§ X" überspringen)
            const headings = textdaten.querySelectorAll('h3, h4, h5, h6');
            for (let heading of headings) {
                const level = heading.tagName.toLowerCase();
                const headingText = (heading.textContent || '').trim();
                const isDuplicateParaHeading = paraId && /^\s*§\s*${paraId}\b/i.test(headingText);
                if (isDuplicateParaHeading) continue; // skip duplicate "§ X" heading
                html += `<${level} class="section-title">${heading.innerHTML}</${level}>`;
            }
            const paragraphs = textdaten.getElementsByTagName('p');
            for (let i = 0; i < paragraphs.length; i++) {
                let p = paragraphs[i];
                let absNum = absCounter;
                // Absatznummer aus Text erkennen (z.B. (1), (2), ...)
                const absMatch = p.textContent.match(/^\((\d+)\)/);
                if (absMatch) {
                    absNum = absMatch[1];
                    absCounter = parseInt(absNum) + 1;
                }
                let absId = paraId ? `para-${paraId}-abs-${absNum}` : '';
                let highlight = (params.pa === paraId && params.abs === absNum.toString());
                // Link-Erkennung und Ersetzung (optimiert)
                let paragraphHTML = linkifyParagraphText(p.innerHTML);
                html += `<p id="${absId}" class="${highlight ? 'highlighted' : ''}">${paragraphHTML}</p>`;
            }
            // Tabellen
            const tables = textdaten.getElementsByTagName('table');
            for (let table of tables) {
                html += '<div class="law-table-scroll"><div class="law-table-inner">';
                html += '<table class="law-table">';
                const rows = table.getElementsByTagName('tr');
                for (let row of rows) {
                    html += '<tr>';
                    const ths = row.getElementsByTagName('th');
                    for (let th of ths) {
                        html += `<th><div class="law-cell-wrap">${th.innerHTML}</div></th>`;
                    }
                    const tds = row.getElementsByTagName('td');
                    for (let td of tds) {
                        html += `<td><div class="law-cell-wrap">${td.innerHTML}</div></td>`;
                    }
                    html += '</tr>';
                }
                html += '</table>';
                html += '</div></div>';
            }
            return html || textdaten.textContent;
        }

        // Zu Paragraf und Absatz scrollen
        function scrollToParagraphFromURL() {
            const params = parseURLParams();
            if (params.pa && paragraphPositions[params.pa]) {
                let absId = params.abs ? `para-${params.pa}-abs-${params.abs}` : null;
                if (absId) {
                    let absElem = document.getElementById(absId);
                    if (absElem) {
                        absElem.scrollIntoView({ behavior: 'auto', block: 'start' });
                        currentParagraph = `${params.pa}-abs-${params.abs}`;
                        updateURL({ law: params.law, pa: params.pa, abs: params.abs });
                        renderCurrentInfo();
                        return;
                    }
                }
                paragraphPositions[params.pa].scrollIntoView({ behavior: 'auto', block: 'start' });
                currentParagraph = params.pa;
                updateURL({ law: params.law, pa: params.pa });
                renderCurrentInfo();
            }
        }

        // Scroll-Position im Link anzeigen (jetzt inkl. Absatz)
        function updateScrollURLOnScroll() {
            let closestPara = null;
            let closestAbs = null;
            let minDistance = Infinity;
            for (const paraId in paragraphPositions) {
                const rect = paragraphPositions[paraId].getBoundingClientRect();
                if (rect.top >= 0 && rect.top < minDistance) {
                    minDistance = rect.top;
                    closestPara = paraId;
                    closestAbs = null;
                }
                // Prüfe Absätze
                const absElems = paragraphPositions[paraId].querySelectorAll('p[id^="para-"], p.highlighted');
                for (let absElem of absElems) {
                    const absRect = absElem.getBoundingClientRect();
                    const absMatch = absElem.id.match(/para-(\d+[a-z]?)-abs-(\d+)/);
                    if (absRect.top >= 0 && absRect.top < minDistance && absMatch) {
                        minDistance = absRect.top;
                        closestPara = absMatch[1];
                        closestAbs = absMatch[2];
                    }
                }
            }
            if (closestPara) {
                if (closestAbs) {
                    updateURL({ law: currentLawFile, pa: closestPara, abs: closestAbs });
                    currentParagraph = `${closestPara}-abs-${closestAbs}`;
                } else {
                    updateURL({ law: currentLawFile, pa: closestPara });
                    currentParagraph = closestPara;
                }
                 renderCurrentInfo();
              }
          }

        // Initialisierung
        async function init() {
            await fetchLawFiles();
            const params = parseURLParams();
            currentLawFile = params.law;
            renderSideNav();
            try {
                await loadXMLData(currentLawFile);
                displayContent();
                renderCurrentInfo();
                window.addEventListener('scroll', updateScrollURLOnScroll);
                 // Popover Event-Delegation für Gesetzeslinks
                 document.addEventListener('mouseover', handlePopoverMouseOver);
                 document.addEventListener('mouseout', handlePopoverMouseOut);
                document.querySelectorAll('.law-nav-link').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const url = new URL(link.href);
                        window.location.search = url.search;
                    });
                });
            } catch (error) {
                document.getElementById('content').innerHTML = `<div class="error">Fehler beim Laden: ${error.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
