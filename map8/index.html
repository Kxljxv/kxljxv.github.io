<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enhanced 3D GeoJSON Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }
        #control-panel {
            position: absolute;
            top: 1em;
            left: 1em;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 1em;
            border-radius: 5px;
            z-index: 2;
            font-family: sans-serif;
        }
        #control-panel label, 
        #control-panel select {
            display: block;
            margin-bottom: 0.5em;
        }
        #legend {
            margin-top: 1em;
        }
        #legend-gradient {
            display: block;
            margin-bottom: 0.3em;
        }
        .legend-labels {
            font-size: 0.8em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="control-panel">
        <h2>Pankow 2025 Results</h2>
        <label for="color-by">Color by:</label>
        <select id="color-by"></select>
        <div id="legend">
            <canvas id="legend-gradient" width="200" height="20"></canvas>
            <div class="legend-labels">
                <span>0</span>
                <span style="float: right;">1</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <script>
        let map;
        let extrudedLayer;

        // Fetch GeoJSON data
        fetch('https://kxljxv.github.io/wahlergebnisse/pankow2025erg3d.json')
        .then(response => response.json())
        .then(data => {
            const colorBySelect = document.getElementById('color-by');
            const firstFeatureProperties = data.features[0].properties;
            
            // Filter out non-numerical attributes
            const numericalAttributes = Object.keys(firstFeatureProperties)
                .filter(key => !['UWB', 'hoehe', 'funktion_t'].includes(key) && 
                        typeof firstFeatureProperties[key] === 'number');
            
            // Populate dropdown
            numericalAttributes.forEach(attribute => {
                const option = document.createElement('option');
                option.value = attribute;
                option.textContent = attribute;
                colorBySelect.appendChild(option);
            });

            // Initialize map
            initializeMap(data, numericalAttributes[0]);
        })
        .catch(error => {
            console.error('Error loading GeoJSON:', error);
        });

        function initializeMap(geojsonData, initialColorAttribute) {
            // Use OpenStreetMap as a free base map
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://demotiles.maplibre.org/style.json', // Open-source base map
                center: [13.4050, 52.5200], // Approximate center of Berlin
                zoom: 11,
                pitch: 45, // Slight 3D angle
                bearing: 0,
                antialias: true
            });

            map.on('load', () => {
                map.addSource('pankow-data', {
                    type: 'geojson',
                    data: geojsonData
                });

                add3DLayer(initialColorAttribute);

                // Event listener for dropdown change
                const colorBySelect = document.getElementById('color-by');
                colorBySelect.addEventListener('change', (event) => {
                    update3DLayerColor(event.target.value);
                });

                drawColorGradient();
                map.scrollZoom.disable(); // Disable scroll zoom initially
            });
        }

        function getColorExpression(attribute) {
            return [
                'interpolate',
                ['linear'],
                ['get', attribute],
                0, 'rgb(0, 255, 0)', // Green for value 0
                1, 'rgb(255, 0, 0)'  // Red for value 1
            ];
        }

        function add3DLayer(colorAttribute) {
            extrudedLayer = map.addLayer({
                'id': 'pankow-buildings',
                'type': 'fill-extrusion',
                'source': 'pankow-data',
                'paint': {
                    'fill-extrusion-color': getColorExpression(colorAttribute),
                    'fill-extrusion-height': ['get', 'hoehe'],
                    'fill-extrusion-base': 0,
                    'fill-extrusion-opacity': 0.7
                }
            });
        }

        function update3DLayerColor(selectedAttribute) {
            if (extrudedLayer) {
                map.setPaintProperty('pankow-buildings', 'fill-extrusion-color', 
                    getColorExpression(selectedAttribute));
            }
        }

        function drawColorGradient() {
            const canvas = document.getElementById('legend-gradient');
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            
            gradient.addColorStop(0, 'rgb(0, 255, 0)'); // Green at the start (value 0)
            gradient.addColorStop(1, 'rgb(255, 0, 0)'); // Red at the end (value 1)
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
