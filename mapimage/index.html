<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>High-Resolution Map Export with MapLibre GL JS</title>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { font-family: sans-serif; margin: 2em; }
    #map { display: none; }
    #result-img { max-width: 100%; border: 1px solid #ccc; margin-top: 1em; }
  </style>
</head>
<body>
  <h2>High-Resolution Map Export (MapLibre GL JS)</h2>
  <form id="map-form">
    <label>
      Width (px):
      <input type="number" id="width" value="12000" required>
    </label>
    <label>
      Height (px):
      <input type="number" id="height" value="8000" required>
    </label>
    <br><br>
    <label>
      Center Latitude:
      <input type="number" id="lat" step="any" value="52.52" required>
    </label>
    <label>
      Center Longitude:
      <input type="number" id="lon" step="any" value="13.405" required>
    </label>
    <br><br>
    <label>
      Zoom:
      <input type="number" id="zoom" value="14" step="any" required>
    </label>
    <br><br>
    <label>
      style.json:
      <input type="file" id="stylefile" accept=".json" required>
    </label>
    <br><br>
    <button type="submit">Render &amp; Export Map</button>
  </form>
  <div id="progress"></div>
  <div id="preview">
    <img id="result-img" style="display:none;" />
    <a id="download-link" href="#" download="image.png" style="display:none;">Download PNG</a>
    <div id="actual-size"></div>
  </div>
  <div id="map"></div>
  <script>
    // Utility to get browser max canvas size
    function getMaxCanvasSize() {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      var max = 32767; // spec limit, but browsers are often much lower
      // Try powers of two up to max
      let test = 4096;
      while (test <= max) {
        try {
          canvas.width = test;
          canvas.height = test;
          ctx.fillRect(0, 0, 1, 1);
          test *= 2;
        } catch (e) {
          break;
        }
      }
      return canvas.width;
    }

    const form = document.getElementById('map-form');
    const progress = document.getElementById('progress');
    const resultImg = document.getElementById('result-img');
    const downloadLink = document.getElementById('download-link');
    const mapDiv = document.getElementById('map');
    const actualSizeDiv = document.getElementById('actual-size');

    form.onsubmit = async function(e) {
      e.preventDefault();
      resultImg.style.display = 'none';
      downloadLink.style.display = 'none';
      actualSizeDiv.textContent = '';

      const width = parseInt(document.getElementById('width').value, 10);
      const height = parseInt(document.getElementById('height').value, 10);
      const lat = parseFloat(document.getElementById('lat').value);
      const lon = parseFloat(document.getElementById('lon').value);
      const zoom = parseFloat(document.getElementById('zoom').value);
      const styleFile = document.getElementById('stylefile').files[0];

      if (!styleFile) {
        progress.textContent = "Please select a style.json file.";
        return;
      }

      // Browser max canvas size
      const maxSize = getMaxCanvasSize();
      // If requested size is too large, warn and clamp
      let w = width, h = height;
      if (width > maxSize || height > maxSize) {
        progress.textContent = `Warning: Your browser's max canvas size is ${maxSize}x${maxSize}. Image will be clamped.`;
        w = Math.min(width, maxSize);
        h = Math.min(height, maxSize);
      } else {
        progress.textContent = '';
      }

      // Read style.json
      const styleText = await styleFile.text();
      let styleJson;
      try {
        styleJson = JSON.parse(styleText);
      } catch (err) {
        progress.textContent = "Invalid style.json file!";
        return;
      }

      // Prepare hidden map container
      mapDiv.style.display = 'block';
      mapDiv.style.width = w + "px";
      mapDiv.style.height = h + "px";
      mapDiv.innerHTML = ""; // Clear previous map

      // Set devicePixelRatio to 1 for consistent scaling (optional)
      const oldDpr = window.devicePixelRatio;
      Object.defineProperty(window, 'devicePixelRatio', {
        get: () => 1
      });

      // Create MapLibre map
      const map = new maplibregl.Map({
        container: mapDiv,
        style: styleJson,
        center: [lon, lat],
        zoom: zoom,
        preserveDrawingBuffer: true,
        interactive: false,
        attributionControl: false,
        boxZoom: false,
        doubleClickZoom: false,
        dragPan: false,
        dragRotate: false,
        keyboard: false,
        scrollZoom: false,
        touchZoomRotate: false
      });

      // Wait for style to load and tiles to render
      map.once('idle', function () {
        setTimeout(() => {
          try {
            const canvas = map.getCanvas();
            const actualW = canvas.width;
            const actualH = canvas.height;
            actualSizeDiv.textContent = `Actual output image size: ${actualW} x ${actualH} pixels`;
            canvas.toBlob(function(blob) {
              if (blob) {
                const url = URL.createObjectURL(blob);
                resultImg.src = url;
                resultImg.style.display = "block";
                downloadLink.href = url;
                downloadLink.style.display = "inline-block";
                downloadLink.textContent = "Download PNG";
                progress.textContent = "Done. Preview below:";
              } else {
                progress.textContent = "Failed to export image.";
              }
              map.remove();
              mapDiv.style.display = 'none';

              // Restore devicePixelRatio
              Object.defineProperty(window, 'devicePixelRatio', {
                get: () => oldDpr
              });
            }, "image/png");
          } catch (err) {
            progress.textContent = "Error exporting image: " + err;
            map.remove();
            mapDiv.style.display = 'none';
            // Restore devicePixelRatio
            Object.defineProperty(window, 'devicePixelRatio', {
              get: () => oldDpr
            });
          }
        }, 1000); // Wait an extra second for all tiles to settle
      });

      map.on('error', function(e) {
        progress.textContent = "MapLibre error: " + e.error.message;
      });
    };
  </script>
</body>
</html>
