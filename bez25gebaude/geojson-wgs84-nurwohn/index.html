<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoJSON Map</title>
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css">
  <style>
    body, html { margin: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
    .popup-content {
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const geojsonUrls = [
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/01.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/02.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/03.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/04.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/05.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/06.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/07.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/08.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/09.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/10.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/11.json",
    "https://kxljxv.github.io/bez25gebaude/geojson-wgs84-nurwohn/12.json"
  ];

  function getQueryParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  const field = getQueryParam("field") || "SPD";
  const colorHex = getQueryParam("color") || "#ff0000";

  function getColor(value) {
    return value !== null ? `rgba(${parseInt(colorHex.slice(1, 3), 16)}, ${parseInt(colorHex.slice(3, 5), 16)}, ${parseInt(colorHex.slice(5, 7), 16)}, ${value})` : "rgba(200, 200, 200, 0.5)";
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    center: [13.405, 52.52], // Berlin coordinates
    zoom: 10
  });

  function loadGeoJSON(url, index) {
    fetch(url).then(response => response.json()).then(data => {
      const sourceId = `geojson-source-${index}`;
      const layerId = `geojson-layer-${index}`;

      map.addSource(sourceId, { type: 'geojson', data: data });
      map.addLayer({
        id: layerId,
        type: 'fill',
        source: sourceId,
        paint: {
          'fill-color': ['case', ['has', field], getColor(['get', field]), 'rgba(200, 200, 200, 0.5)'],
          'fill-opacity': 0.8
        }
      });

      map.on('click', layerId, (e) => {
        const properties = e.features[0].properties;
        const popupContent = document.createElement('div');
        popupContent.className = 'popup-content';
        popupContent.innerHTML = `<strong>${field}:</strong> ${(properties[field] * 100).toFixed(2)}%`;

        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setDOMContent(popupContent)
          .addTo(map);
      });
    });
  }

  map.on('load', () => {
    geojsonUrls.forEach((url, index) => loadGeoJSON(url, index));
  });
</script>
</body>
</html>
