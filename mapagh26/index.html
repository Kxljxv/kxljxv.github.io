<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wahlkreise Berlin AGH 2026</title>
  <!-- Maplibre CSS -->
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #2d2d2d;
      font-family: 'Poppins', sans-serif;
    }
    html { height: 100%; }
    
    #map { 
      width: 100%; 
      height: 100%; 
    }

    #info-box {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 300px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      padding: 15px;
      color: white;
      z-index: 10;
    }

    #info-box h2 { 
      margin-top: 0; 
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-label {
      font-weight: 600;
    }

    .info-value {
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <!-- Infobox-Overlay -->
  <div id="info-box">
    <h2 id="district-title">Wähle einen Wahlkreis</h2>
    <div id="district-info"></div>
  </div>

  <!-- Bibliotheken -->
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  
  <script>
    // Maplibre-Karte initialisieren
    var map = new maplibregl.Map({
      container: 'map',
      style: 'https://sgx.geodatenzentrum.de/wmts_basemapde/1.0.0/WMTSCapabilities.xml',  // Basemapde
      center: [13.40, 52.52], // Berlin Zentrum
      zoom: 10,
      pitch: 0,
      bearing: 0
    });
    
    // Kartensteuerung einschränken
    map.dragRotate.disable();
    map.touchZoomRotate.disableRotation();
    map.keyboard.disable();
    
    // Bezirksnamen-Mapping
    const bezirkMapping = {
      '01': 'Mitte',
      '02': 'Friedrichshain-Kreuzberg',
      '03': 'Pankow',
      '04': 'Charlottenburg-Wilmersdorf',
      '05': 'Spandau',
      '06': 'Steglitz-Zehlendorf',
      '07': 'Tempelhof-Schöneberg',
      '08': 'Neukölln',
      '09': 'Treptow-Köpenick',
      '10': 'Marzahn-Hellersdorf',
      '11': 'Lichtenberg',
      '12': 'Reinickendorf'
    };

    // GeoJSON laden und darstellen
    map.on('load', function() {
      fetch('./AWK_AH2026.json')
        .then(response => response.json())
        .then(function(geojson) {
          // GeoJSON-Layer hinzufügen
          map.addSource('wahlkreise', {
            type: 'geojson',
            data: geojson
          });

          // Füllungs-Layer für Wahlkreise
          map.addLayer({
            'id': 'wahlkreise-fill',
            'type': 'fill',
            'source': 'wahlkreise',
            'paint': {
              'fill-color': '#627BC1',
              'fill-opacity': 0.5
            }
          });

          // Umriss-Layer für Wahlkreise
          map.addLayer({
            'id': 'wahlkreise-line',
            'type': 'line',
            'source': 'wahlkreise',
            'paint': {
              'line-color': '#627BC1',
              'line-width': 1
            }
          });
        })
        .catch(error => console.error('Fehler beim Laden der GeoJSON-Daten:', error));
    });
    
    // Click-Event für Wahlkreise
    map.on('click', 'wahlkreise-fill', function(e) {
      if (!e.features.length) return;
      var feature = e.features[0];
      
      // Highlight des ausgewählten Wahlkreises
      if (map.getLayer('highlight-layer')) {
        map.removeLayer('highlight-layer');
        map.removeSource('highlight-layer');
      }
      
      map.addSource('highlight-layer', {
        type: 'geojson',
        data: feature
      });
      
      map.addLayer({
        id: 'highlight-layer',
        type: 'line',
        source: 'highlight-layer',
        paint: {
          'line-color': '#ffffff',
          'line-width': 3
        }
      });
      
      // Infobox aktualisieren
      document.getElementById('district-title').textContent = 'Wahlkreis ' + feature.properties.AWK;
      
      // Bezirksnamen aus dem Mapping holen
      const bezirksname = bezirkMapping[feature.properties.BEZ] || feature.properties.BEZ;
      
      document.getElementById('district-info').innerHTML = `
        <div class="info-row">
          <span class="info-label">Wahlkreis:</span>
          <span class="info-value">${feature.properties.AWK}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Wahlkreis (kurz):</span>
          <span class="info-value">${feature.properties.AWK2}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Bezirk:</span>
          <span class="info-value">${bezirksname}</span>
        </div>
      `;
    });
    
    // Hover-Effekte
    map.on('mouseenter', 'wahlkreise-fill', function() {
      map.getCanvas().style.cursor = 'pointer';
    });
    
    map.on('mouseleave', 'wahlkreise-fill', function() {
      map.getCanvas().style.cursor = '';
    });
  </script>
</body>
</html>
