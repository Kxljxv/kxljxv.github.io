<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGH Wahlkreise Berlin 2026</title>
  <!-- Maplibre CSS -->
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0; height: 100%;
      background: #2d2d2d;
      font-family: 'Poppins', sans-serif;
    }
    html { height: 100%; }
    #map { width: 100vw; height: 100vh;}
    #info-box {
      position: absolute;
      top: 20px; right: 20px;
      min-width: 260px;
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      padding: 16px 14px;
      color: #fff;
      z-index: 10;
      font-size: 1rem;
    }
    #info-box h2 { margin-top: 0; font-size: 1.15rem; font-weight: 600;}
    #info-box .feld { font-size: 1.02rem; padding-bottom: 4px;}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info-box">
    <h2 id="district-title">Wähle einen Wahlkreis</h2>
    <div id="district-info">
      <span class="feld">Nummer (AWK): –</span><br>
      <span class="feld">Großregion (AWK2): –</span><br>
      <span class="feld">Bezirk (BEZ): –</span>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>
    // Karte mit BasemapDE - bright style
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemap.de/tiles/bright.json', // BasemapDE bright
      center: [13.4050, 52.52], // Grob Berlin
      zoom: 10
    });
    map.dragRotate.disable();
    map.touchZoomRotate.disableRotation();
    map.keyboard.disable();

    map.on('load', function() {
      fetch('./AWK_AH2026.json')
        .then(response => response.json())
        .then(function(geojson) {
          // GeoJSON-Layer für Wahlkreise
          map.addSource('wahlkreise', {
            type: 'geojson',
            data: geojson
          });

          // Füllfarb-Layer (fixes blau)
          map.addLayer({
            id: 'wahlkreise-fill',
            type: 'fill',
            source: 'wahlkreise',
            paint: {
              'fill-color': '#0c87e7',
              'fill-opacity': 0.32
            }
          });

          // Umriss/Border-Layer
          map.addLayer({
            id: 'wahlkreise-line',
            type: 'line',
            source: 'wahlkreise',
            paint: {
              'line-color': '#175ae0',
              'line-width': 2
            }
          });
        })
        .catch(error => console.error('Fehler beim Laden der GeoJSON:', error));
    });

    map.on('click', 'wahlkreise-fill', function(e) {
      if (!e.features.length) return;
      const feature = e.features[0];
      // Highlight zeichnen
      if (map.getLayer('highlight-layer')) {
        map.removeLayer('highlight-layer');
        map.removeSource('highlight-layer');
      }
      map.addSource('highlight-layer', { type: 'geojson', data: feature });
      map.addLayer({
        id: 'highlight-layer',
        type: 'line',
        source: 'highlight-layer',
        paint: { 'line-color': '#fff', 'line-width': 4 }
      });

      // Infobox aktualisieren
      document.getElementById('district-title').textContent =
        'Wahlkreis ' + (feature.properties.AWK || "–");
      document.getElementById('district-info').innerHTML = `
        <span class="feld">Nummer (AWK): ${feature.properties.AWK || "–"}</span><br>
        <span class="feld">Großregion (AWK2): ${feature.properties.AWK2 || "–"}</span><br>
        <span class="feld">Bezirk (BEZ): ${feature.properties.BEZ || "–"}</span>
      `;
    });

    map.on('mouseenter', 'wahlkreise-fill', function() {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'wahlkreise-fill', function() {
      map.getCanvas().style.cursor = '';
    });
  </script>
</body>
</html>
