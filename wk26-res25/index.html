<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wahlergebnisse und Wahlkreise Berlin</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Maplibre CSS -->
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    /* Zentrale Farbvariablen */
    :root {
      --body-bg: #1c1c1c;
      --primary-text: #e0e0e0;
      --secondary-text: #b0b0b0;
      --control-bg: #2a2a2a;
      --border-color: #444444;
      --accent: #a3512b;
      
      /* Parteifarben */
      --party-spd-reg: #D63C3C;
      --party-gruen-reg: #028902;
      --party-cdu-reg: #767576;
      --party-linke-reg: #C72DC1;
      --party-afd-reg: #4667FA;
      --party-fdp-reg: #6b4c00;
      --party-bsw-reg: #6a0dad;
      --party-tierschutz-reg: #005c5c;
      --party-volt-reg: #4b2e83;
      --party-fw-reg: #8a5a00;
      --party-mlpd-reg: #7a112f;
    }

    body {
      background-color: var(--body-bg);
      color: var(--primary-text);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--control-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .main-container {
      max-width: 1200px;
    }

    #mapContainer {
      margin-bottom: 1rem;
    }

    /* Layer Toggle Buttons */
    .layer-toggle-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      background-color: rgba(42, 42, 42, 0.95);
      color: var(--primary-text);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .layer-toggle-btn:hover {
      background-color: var(--accent);
    }

    .layer-toggle-btn.active {
      background-color: var(--accent);
      font-weight: 600;
    }

    #backgroundToggle {
      top: 10px;
      left: 10px;
    }

    #wahlkreiseToggle {
      top: 50px;
      left: 10px;
    }

    /* Jahreswahl */
    #yearSelection {
      margin: 1rem auto;
    }

    .year-btn {
      background-color: var(--control-bg);
      color: var(--primary-text);
      border: 1px solid var(--border-color);
      transition: background-color 0.2s;
    }

    .year-btn:hover,
    .year-btn.active {
      background-color: var(--accent);
    }

    /* Sidebar */
    #sidebar {
      background-color: var(--control-bg);
    }

    #searchField {
      background-color: var(--body-bg);
      color: var(--primary-text);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
    }

    /* Parteiauswahl */
    #partyRadioGroup label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-weight: 500;
      background-color: var(--control-bg);
      color: var(--primary-text);
    }

    #partyRadioGroup input {
      accent-color: var(--accent);
    }

    #partyRadioGroup input:checked + span {
      font-weight: bold;
    }

    /* Ergebnisbereich */
    #resultPanel {
      background-color: var(--control-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
    }

    /* Wahlkreis Info Box */
    #wahlkreisInfo {
      background-color: var(--control-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 1rem;
    }

    #wahlkreisInfo .feld {
      font-size: 0.95rem;
      padding-bottom: 4px;
    }
  </style>
</head>
<body class="bg-body">
  <header class="py-4 border-b border-border text-center">
    <h1 class="text-3xl font-bold text-primary">Wahlergebnisse und Wahlkreise in Berlin</h1>
  </header>
  
  <div class="main-container mx-auto p-4 flex flex-col lg:flex-row gap-4">
    <!-- Kartenbereich -->
    <div id="mapContainer" class="relative w-full lg:w-2/3 h-[22rem] lg:h-[30rem] rounded-lg overflow-hidden shadow">
      <button id="backgroundToggle" class="layer-toggle-btn">Hintergrundkarte</button>
      <button id="wahlkreiseToggle" class="layer-toggle-btn active">Wahlkreise</button>
      <div id="map" class="w-full h-full"></div>
    </div>
    
    <!-- Sidebar -->
    <aside id="sidebar" class="w-full lg:w-1/3 rounded-lg p-4 bg-control shadow flex flex-col gap-4">
      <!-- Suchfeld -->
      <input type="text" id="searchField" placeholder="Suche nach Bezirk oder Adresse (z.B. Alexanderplatz)" class="w-full p-2 rounded bg-body text-primary" />
      
      <!-- Parteiauswahl -->
      <div id="partySelection">
        <h2 class="mb-2 text-lg font-semibold text-primary">Partei wählen</h2>
        <div id="partyRadioGroup" class="flex flex-wrap gap-2"></div>
      </div>
      
      <!-- Ergebnisbereich -->
      <div id="resultPanel" class="bg-control p-4 rounded shadow">
        <h2 id="resultHeader" class="mb-2 text-lg font-semibold text-primary">Ergebnisse</h2>
        <canvas id="resultChart" class="w-full" style="max-height: 250px;"></canvas>
      </div>

      <!-- Wahlkreis Info -->
      <div id="wahlkreisInfo" style="display: none;">
        <h2 class="text-lg font-semibold text-primary mb-2">Wahlkreis Information</h2>
        <div id="wahlkreisDetails">
          <span class="feld">Nummer (AWK): –</span><br>
          <span class="feld">Großregion (AWK2): –</span><br>
          <span class="feld">Bezirk (BEZ): –</span>
        </div>
      </div>
    </aside>
  </div>
  
  <!-- Jahreswahl -->
  <div id="yearSelection" class="mt-4 flex justify-center space-x-4">
    <button class="year-btn px-4 py-2 rounded-full border border-border bg-control text-primary font-medium" data-year="2021">2021</button>
    <button class="year-btn px-4 py-2 rounded-full border border-border bg-control text-primary font-medium" data-year="2025">2025</button>
  </div>
  
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>
    /***********************
     * Datensätze und Konfiguration
     ***********************/
    var dataset2025 = {
      url: 'https://kxljxv.github.io/wahlergebnisse2025.json',
      partyRanges: {
        "SPDinkBW": { min: 0.06, max: 0.39984263 },
        "GrueninkBW": { min: 0.015, max: 0.541414141 },
        "CDUinkBW": { min: 0.025714286, max: 0.46 },
        "LINKEinkBW": { min: 0.011583012, max: 0.5 },
        "AfDinkBW": { min: 0.005931198, max: 0.5 },
        "FDPinkBW": { min: 0.004, max: 0.268841395 },
        "BSWinkBWB": { min: 0.012, max: 0.16 },
        "PARTEIMENSCHUMWELTTIERSCHUTZinkBW": { min: 0.0, max: 0.085704944 },
        "VoltDeutschlandinkBW": { min: 0.0, max: 0.029 },
        "FWinkBW": { min: 0.0, max: 0.034937014 },
        "MLPDinkBW": { min: 0.0, max: 0.012658228 }
      },
      availableParties: [
        "SPDinkBW", "GrueninkBW", "CDUinkBW", "LINKEinkBW",
        "AfDinkBW", "FDPinkBW", "BSWinkBWB", "PARTEIMENSCHUMWELTTIERSCHUTZinkBW",
        "VoltDeutschlandinkBW", "FWinkBW", "MLPDinkBW"
      ]
    };

    var dataset2021 = {
      url: 'https://kxljxv.github.io/wahlergebnisse2021.json',
      partyRanges: {
        "SPDinkBW": { min: 0.06, max: 0.39984263 },
        "GrueninkBW": { min: 0.015, max: 0.541414141 },
        "CDUinkBW": { min: 0.025714286, max: 0.46 },
        "LinkeinkBW": { min: 0.011583012, max: 0.5 },
        "AfDinkBW": { min: 0.005931198, max: 0.5 },
        "FDPinkBW": { min: 0.004, max: 0.268841395 },
        "PARTEIMENSCHUMWELTTIERSCHUTZinkBW": { min: 0.0, max: 0.085704944 },
        "VoltinkBW": { min: 0.0, max: 0.029 },
        "FWinkBW": { min: 0.0, max: 0.034937014 },
        "MLPDinkBW": { min: 0.0, max: 0.012658228 }
      },
      availableParties: [
        "SPDinkBW", "GrueninkBW", "CDUinkBW", "LinkeinkBW",
        "AfDinkBW", "FDPinkBW", "PARTEIMENSCHUMWELTTIERSCHUTZinkBW",
        "VoltinkBW", "FWinkBW", "MLPDinkBW"
      ]
    };

    var partyMapping = {
      "VoltinkBW": "Volt"
    };

    var currentDataset = dataset2025;
    var currentParty = "Gewinner";
    var geojsonData = null;
    var wahlkreiseVisible = true;
    var backgroundVisible = false;

    /***********************
     * Karte initialisieren
     ***********************/
    var map = new maplibregl.Map({
      container: 'map',
      style: 'https://kxljxv.github.io/bm_web_gry_7.json',
      center: [13.40, 52.52],
      zoom: 10,
      minZoom: 6,
      maxBounds: [[12.5, 51.5], [14.5, 53]],
      attributionControl: false
    });
    map.dragRotate.disable();
    map.touchZoomRotate.disableRotation();

    /***********************
     * Layer Toggle Buttons
     ***********************/
    document.getElementById('backgroundToggle').addEventListener('click', function() {
      backgroundVisible = !backgroundVisible;
      this.classList.toggle('active', backgroundVisible);
      
      if (backgroundVisible) {
        if (!map.getSource('background-layer')) {
          map.addSource('background-layer', {
            type: 'vector',
            url: 'https://kxljxv.github.io/bmdebright.json'
          });
        }
        
        // Mache Wahlergebnis-Layer transparent
        if (map.getLayer('geojson-fill')) {
          map.setPaintProperty('geojson-fill', 'fill-opacity', 0.6);
        }
        if (map.getLayer('wahlkreise-fill')) {
          map.setPaintProperty('wahlkreise-fill', 'fill-opacity', 0.3);
        }
      } else {
        // Setze Opazität zurück
        if (map.getLayer('geojson-fill')) {
          map.setPaintProperty('geojson-fill', 'fill-opacity', 1);
        }
        if (map.getLayer('wahlkreise-fill')) {
          map.setPaintProperty('wahlkreise-fill', 'fill-opacity', 0.2);
        }
      }
    });

    document.getElementById('wahlkreiseToggle').addEventListener('click', function() {
      wahlkreiseVisible = !wahlkreiseVisible;
      this.classList.toggle('active', wahlkreiseVisible);
      
      if (map.getLayer('wahlkreise-fill')) {
        map.setLayoutProperty('wahlkreise-fill', 'visibility', wahlkreiseVisible ? 'visible' : 'none');
      }
      if (map.getLayer('wahlkreise-line')) {
        map.setLayoutProperty('wahlkreise-line', 'visibility', wahlkreiseVisible ? 'visible' : 'none');
      }
      
      // Info Box verstecken wenn Wahlkreise ausgeblendet
      if (!wahlkreiseVisible) {
        document.getElementById('wahlkreisInfo').style.display = 'none';
      }
    });

    /***********************
     * Jahresauswahl
     ***********************/
    document.querySelectorAll('.year-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        var selectedYear = this.getAttribute('data-year');
        currentDataset = (selectedYear === "2025") ? dataset2025 : dataset2021;
        
        if (currentParty !== "Gewinner") {
          if (!currentDataset.availableParties.includes(currentParty)) {
            currentParty = partyMapping[currentParty] || "Gewinner";
          }
        }
        populatePartyRadioGroup();
        loadGeoJson();
      });
    });
    document.querySelector('.year-btn[data-year="2025"]').classList.add('active');

    /***********************
     * GeoJSON-Daten laden
     ***********************/
    function loadGeoJson() {
      fetch(currentDataset.url)
        .then(response => response.json())
        .then(data => {
          geojsonData = data;
          updateMapColors();
          
          if (!map.getSource('geojson-layer')) {
            map.addSource('geojson-layer', { type: 'geojson', data: geojsonData });
            
            map.addLayer({
              id: 'geojson-fill',
              type: 'fill',
              source: 'geojson-layer',
              paint: {
                'fill-color': ['get', 'fillColor'],
                'fill-opacity': backgroundVisible ? 0.6 : 1,
                'fill-outline-color': 'transparent'
              }
            });
          } else {
            map.getSource('geojson-layer').setData(geojsonData);
          }
          
          // Lade Wahlkreise nach Wahlergebnissen
          loadWahlkreise();
        })
        .catch(error => console.error('Fehler beim Laden der GeoJSON-Daten:', error));
    }

    /***********************
     * Wahlkreise laden
     ***********************/
    function loadWahlkreise() {
      if (map.getSource('wahlkreise')) return;
      
      fetch('https://kxljxv.github.io/AWK_AH2026.json')
        .then(response => response.json())
        .then(data => {
          map.addSource('wahlkreise', {
            type: 'geojson',
            data: data
          });

          map.addLayer({
            'id': 'wahlkreise-fill',
            'type': 'fill',
            'source': 'wahlkreise',
            'paint': {
              'fill-color': '#0c87e7',
              'fill-opacity': 0.2
            }
          });

          map.addLayer({
            'id': 'wahlkreise-line',
            'type': 'line',
            'source': 'wahlkreise',
            'paint': {
              'line-color': '#175ae0',
              'line-width': 2
            }
          });

          // Click Handler für Wahlkreise
          map.on('click', 'wahlkreise-fill', function(e) {
            if (!e.features.length || !wahlkreiseVisible) return;
            const feature = e.features[0];
            
            // Highlight Layer
            if (map.getLayer('highlight-layer')) {
              map.removeLayer('highlight-layer');
              map.removeSource('highlight-layer');
            }
            
            map.addSource('highlight-layer', {
              type: 'geojson',
              data: feature.geometry
            });

            map.addLayer({
              'id': 'highlight-layer',
              'type': 'line',
              'source': 'highlight-layer',
              'paint': {
                'line-color': '#ffffff',
                'line-width': 4
              }
            });

            // Wahlkreis Info anzeigen
            document.getElementById('wahlkreisInfo').style.display = 'block';
            document.getElementById('wahlkreisDetails').innerHTML = `
              <span class="feld">Nummer (AWK): ${feature.properties.AWK || "–"}</span><br>
              <span class="feld">Großregion (AWK2): ${feature.properties.AWK2 || "–"}</span><br>
              <span class="feld">Bezirk (BEZ): ${feature.properties.BEZ || "–"}</span>
            `;
          });

          map.on('mouseenter', 'wahlkreise-fill', function() {
            if (wahlkreiseVisible) map.getCanvas().style.cursor = 'pointer';
          });

          map.on('mouseleave', 'wahlkreise-fill', function() {
            map.getCanvas().style.cursor = '';
          });
        })
        .catch(error => console.error('Fehler beim Laden der Wahlkreise:', error));
    }

    loadGeoJson();

    /***********************
     * Farben aktualisieren
     ***********************/
    function updateMapColors() {
      if (!geojsonData) return;
      
      geojsonData.features.forEach(function(feature) {
        var fillColor;
        if (currentParty === "Gewinner") {
          var winningParty = null, winningValue = 0;
          currentDataset.availableParties.forEach(function(key) {
            var val = parseFloat(feature.properties[key].replace(',', '.'));
            if (val > winningValue) {
              winningValue = val;
              winningParty = key;
            }
          });
          fillColor = getPartyColor(winningParty);
        } else {
          var val = parseFloat(feature.properties[currentParty].replace(',', '.'));
          var range = currentDataset.partyRanges[currentParty];
          var norm = (val - range.min) / (range.max - range.min);
          norm = Math.max(0, Math.min(norm, 1));
          fillColor = interpolateColor("#f0f0f0", getPartyColor(currentParty), norm);
        }
        feature.properties.fillColor = fillColor;
      });
      
      if (map.getSource('geojson-layer')) {
        map.getSource('geojson-layer').setData(geojsonData);
      }
      if (lastClickedFeature) updateResultChart(lastClickedFeature);
    }

    function interpolateColor(color1, color2, factor) {
      var c1 = hexToRgb(color1);
      var c2 = hexToRgb(color2);
      var result = {
        r: Math.round(c1.r + (c2.r - c1.r) * factor),
        g: Math.round(c1.g + (c2.g - c1.g) * factor),
        b: Math.round(c1.b + (c2.b - c1.b) * factor)
      };
      return "rgb(" + result.r + ", " + result.g + ", " + result.b + ")";
    }

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      var bigint = parseInt(hex, 16);
      return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function getPartyColor(key) {
      switch(key) {
        case "SPDinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-spd-reg').trim();
        case "GrueninkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-gruen-reg').trim();
        case "CDUinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-cdu-reg').trim();
        case "LINKEinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-linke-reg').trim();
        case "LinkeinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-linke-reg').trim();
        case "AfDinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-afd-reg').trim();
        case "FDPinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-fdp-reg').trim();
        case "BSWinkBWB": return getComputedStyle(document.documentElement).getPropertyValue('--party-bsw-reg').trim();
        case "PARTEIMENSCHUMWELTTIERSCHUTZinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-tierschutz-reg').trim();
        case "VoltDeutschlandinkBW": 
        case "VoltinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-volt-reg').trim();
        case "FWinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-fw-reg').trim();
        case "MLPDinkBW": return getComputedStyle(document.documentElement).getPropertyValue('--party-mlpd-reg').trim();
        default: return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      }
    }

    /***********************
     * Chart.js
     ***********************/
    var lastClickedFeature = null;
    var ctx = document.getElementById('resultChart').getContext('2d');
    var resultChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [{
          label: 'Ergebnis (%)',
          data: [],
          backgroundColor: [],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--primary-text').trim() },
            grid: { color: 'rgba(255,255,255,0.1)' }
          },
          y: {
            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--primary-text').trim() },
            grid: { color: 'rgba(255,255,255,0.1)' },
            beginAtZero: true,
            max: 100
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return context.parsed.y + "%";
              }
            }
          }
        }
      }
    });

    function updateResultChart(feature) {
      lastClickedFeature = feature;
      var labels = [];
      var dataValues = [];
      var backgroundColors = [];
      
      currentDataset.availableParties.forEach(function(key) {
        var val = parseFloat(feature.properties[key].replace(',', '.'));
        labels.push(partyDisplayNames[key] || key);
        dataValues.push((val * 100).toFixed(2));
        backgroundColors.push(getPartyColor(key));
      });
      
      resultChart.data.labels = labels;
      resultChart.data.datasets[0].data = dataValues;
      resultChart.data.datasets[0].backgroundColor = backgroundColors;
      var maxVal = Math.max(...dataValues.map(Number));
      resultChart.options.scales.y.max = Math.ceil(maxVal / 10) * 10 || 100;
      
      var district = feature.properties.UWB || "";
      document.getElementById('resultHeader').innerText = "Ergebnisse - " + district;
      
      resultChart.update();
    }

    /***********************
     * Interaktive Karte
     ***********************/
    var marker;
    map.on('click', 'geojson-fill', function(e) {
      if (!e.features.length) return;
      var feature = e.features[0];
      updateResultChart(feature);
      
      if (marker) marker.remove();
      marker = new maplibregl.Marker({ color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() })
        .setLngLat(e.lngLat)
        .addTo(map);
    });

    map.on('mouseenter', 'geojson-fill', function() {
      map.getCanvas().style.cursor = 'pointer';
    });

    map.on('mouseleave', 'geojson-fill', function() {
      map.getCanvas().style.cursor = '';
    });

    /***********************
     * Suchfeld
     ***********************/
    document.getElementById('searchField').addEventListener('input', function(e) {
      var query = e.target.value.toLowerCase();
      
      if (query.includes("alexanderplatz")) {
        map.flyTo({ center: [13.411, 52.521], zoom: 13 });
      } else if (query.includes("potsdamer platz")) {
        map.flyTo({ center: [13.376, 52.509], zoom: 13 });
      } else {
        if (!geojsonData) return;
        var filtered = JSON.parse(JSON.stringify(geojsonData));
        filtered.features = filtered.features.filter(function(feature) {
          return feature.properties.UWB.toLowerCase().includes(query) ||
                 (feature.properties.adresse && feature.properties.adresse.toLowerCase().includes(query));
        });
        if (map.getSource('geojson-layer')) {
          map.getSource('geojson-layer').setData(filtered);
        }
      }
    });

    /***********************
     * Parteiauswahl
     ***********************/
    var partyDisplayNames = {
      "SPDinkBW": "SPD",
      "GrueninkBW": "Grüne",
      "CDUinkBW": "CDU",
      "LINKEinkBW": "Die Linke",
      "LinkeinkBW": "Die Linke",
      "AfDinkBW": "AfD",
      "FDPinkBW": "FDP",
      "BSWinkBWB": "BSW",
      "PARTEIMENSCHUMWELTTIERSCHUTZinkBW": "Tierschutz",
      "VoltDeutschlandinkBW": "Volt",
      "VoltinkBW": "Volt",
      "FWinkBW": "FW",
      "MLPDinkBW": "MLPD"
    };

    function populatePartyRadioGroup() {
      var container = document.getElementById('partyRadioGroup');
      container.innerHTML = "";
      
      var label = document.createElement('label');
      label.innerHTML = `<input type="radio" name="party" value="Gewinner" ${currentParty==="Gewinner"?"checked":""}> <span>Gewinner</span>`;
      container.appendChild(label);
      
      currentDataset.availableParties.forEach(function(key) {
        var unifiedKey = (key === "VoltinkBW") ? "Volt" : key;
        var lbl = document.createElement('label');
        lbl.style.backgroundColor = hexToRGBA(getPartyColor(key), 0.15);
        var isChecked = (currentParty === unifiedKey) ? "checked" : "";
        lbl.innerHTML = `<input type="radio" name="party" value="${key}" ${isChecked}> <span>${partyDisplayNames[key] || key}</span>`;
        container.appendChild(lbl);
      });
    }

    function hexToRGBA(hex, alpha) {
      var r = parseInt(hex.substring(1, 3), 16),
          g = parseInt(hex.substring(3, 5), 16),
          b = parseInt(hex.substring(5, 7), 16);
      return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
    }

    populatePartyRadioGroup();

    document.getElementById('partyRadioGroup').addEventListener('change', function(e) {
      currentParty = e.target.value;
      if (currentParty === "VoltinkBW") currentParty = "Volt";
      updateMapColors();
      
      if (!lastClickedFeature) {
        resultChart.data.labels = [];
        resultChart.data.datasets[0].data = [];
        resultChart.update();
      }
    });
  </script>
</body>
</html>
