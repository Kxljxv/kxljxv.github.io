<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netzwerk Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.css" rel="stylesheet" />
    <style>

        /* Custom Fonts */
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic_bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic_italic.woff2') format('woff2');
            font-weight: normal;
            font-style: italic;
        }
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic_italic_bold.woff2') format('woff2');
            font-weight: bold;
            font-style: italic;
        }
        @font-face {
            font-family: 'ModernDense';
            src: url('https://kxljxv.github.io/aea/fonts/modern_dense.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'ModernDense';
            src: url('https://kxljxv.github.io/aea/fonts/modern_dense_italic.woff2') format('woff2');
            font-weight: normal;
            font-style: italic;
        }
        @font-face {
            font-family: 'ModernWide';
            src: url('https://kxljxv.github.io/aea/fonts/modern_wide.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Serif';
            src: url('https://kxljxv.github.io/aea/fonts/serif.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Serif';
            src: url('https://kxljxv.github.io/aea/fonts/serif_italic.woff2') format('woff2');
            font-weight: normal;
            font-style: italic;
        }

        /* Custom CSS Variables */
        :root {
            --always-white-full:hsl(0 0% 100%);
            --always-black-full:hsl(0 0% 0%);

            --always-white:0 0% 100%;
            --always-black:0 0% 0%;

            --accent-brand-full:hsl(15 63.1% 59.6%);
            --accent-main-000-full:hsl(15 54.2% 51.2%);
            --accent-main-100-full:hsl(15 63.1% 59.6%);
            --accent-main-200-full:hsl(15 63.1% 59.6%);
            --accent-main-900-full:hsl(0 0% 0%);
            --accent-pro-000-full:hsl(251 84.6% 74.5%);
            --accent-pro-100-full:hsl(251 40.2% 54.1%);
            --accent-pro-200-full:hsl(251 40% 45.1%);
            --accent-pro-900-full:hsl(250 25.3% 19.4%);
            --accent-secondary-000-full:hsl(210 65.5% 67.1%);
            --accent-secondary-100-full:hsl(210 70.9% 51.6%);
            --accent-secondary-200-full:hsl(210 70.9% 51.6%);
            --accent-secondary-900-full:hsl(210 55.9% 24.6%);
            --bg-000-full:hsl(60 2.1% 18.4%);
            --bg-100-full:hsl(60 2.7% 14.5%);
            --bg-200-full:hsl(30 3.3% 11.8%);
            --bg-300-full:hsl(60 2.6% 7.6%);
            --bg-400-full:hsl(0 0% 0%);
            --bg-500-full:hsl(0 0% 0%);
            --border-100-full:hsl(51 16.5% 84.5%);
            --border-200-full:hsl(51 16.5% 84.5%);
            --border-300-full:hsl(51 16.5% 84.5%);
            --border-400-full:hsl(51 16.5% 84.5%);
            --danger-000-full:hsl(0 98.4% 75.1%);
            --danger-100-full:hsl(0 67% 59.6%);
            --danger-200-full:hsl(0 67% 59.6%);
            --danger-900-full:hsl(0 46.5% 27.8%);
            --oncolor-100-full:hsl(0 0% 100%);
            --oncolor-200-full:hsl(60 6.7% 97.1%);
            --oncolor-300-full:hsl(60 6.7% 97.1%);
            --pictogram-100-full:hsl(48 3.4% 29.2%);
            --pictogram-200-full:hsl(60 2.5% 23.3%);
            --pictogram-300-full:hsl(60 2.1% 18.4%);
            --pictogram-400-full:hsl(60 2.7% 14.5%);
            --success-000-full:hsl(97 59.1% 46.1%);
            --success-100-full:hsl(97 75% 32.9%);
            --success-200-full:hsl(97 75% 32.9%);
            --success-900-full:hsl(127 100% 13.9%);
            --text-000-full:hsl(48 33.3% 97.1%);
            --text-100-full:hsl(48 33.3% 97.1%);
            --text-200-full:hsl(50 9% 73.7%);
            --text-300-full:hsl(50 9% 73.7%);
            --text-400-full:hsl(48 4.8% 59.2%);
            --text-500-full:hsl(48 4.8% 59.2%);


            --accent-brand:15 63.1% 59.6%;
            --accent-main-000:15 54.2% 51.2%;
            --accent-main-100:15 63.1% 59.6%;
            --accent-main-200:15 63.1% 59.6%;
            --accent-main-900:0 0% 0%;
            --accent-pro-000:251 84.6% 74.5%;
            --accent-pro-100:251 40.2% 54.1%;
            --accent-pro-200:251 40% 45.1%;
            --accent-pro-900:250 25.3% 19.4%;
            --accent-secondary-000:210 65.5% 67.1%;
            --accent-secondary-100:210 70.9% 51.6%;
            --accent-secondary-200:210 70.9% 51.6%;
            --accent-secondary-900:210 55.9% 24.6%;
            --bg-000:60 2.1% 18.4%;
            --bg-100:60 2.7% 14.5%;
            --bg-200:30 3.3% 11.8%;
            --bg-300:60 2.6% 7.6%;
            --bg-400:0 0% 0%;
            --bg-500:0 0% 0%;
            --border-100:51 16.5% 84.5%;
            --border-200:51 16.5% 84.5%;
            --border-300:51 16.5% 84.5%;
            --border-400:51 16.5% 84.5%;
            --danger-000:0 98.4% 75.1%;
            --danger-100:0 67% 59.6%;
            --danger-200:0 67% 59.6%;
            --danger-900:0 46.5% 27.8%;
            --oncolor-100:0 0% 100%;
            --oncolor-200:60 6.7% 97.1%;
            --oncolor-300:60 6.7% 97.1%;
            --pictogram-100:48 3.4% 29.2%;
            --pictogram-200:60 2.5% 23.3%;
            --pictogram-300:60 2.1% 18.4%;
            --pictogram-400:60 2.7% 14.5%;
            --success-000:97 59.1% 46.1%;
            --success-100:97 75% 32.9%;
            --success-200:97 75% 32.9%;
            --success-900:127 100% 13.9%;
            --text-000:48 33.3% 97.1%;
            --text-100:48 33.3% 97.1%;
            --text-200:50 9% 73.7%;
            --text-300:50 9% 73.7%;
            --text-400:48 4.8% 59.2%;
            --text-500:48 4.8% 59.2%;

            --bg-primary: #262624;
            --bg-primary-unselected: #30302e;
            --bg-primary-hover: #2b2b29;
            --bg-primary-selected: #30302e;

            --button-normal: rgb(38, 38, 36, 0);

            --button-hover: #2b2b29;

            --button-selected: rgba(20, 20, 19, 0);

            --bg-light: #30302e;
            --bg-light-hover: #1f1e1d;
            --bg-light-selected: #141413;

            --bg-graph: #080807;
            --border-color: #4a4a46;
            --border-color-hover: #65645f;
            --text-heading-primary: #faf9f5;
            --text-heading-secondary: #faf9f5;
            --text-primary: #faf9f5;
            --text-secondary: #faf9f5;
            --text-tertiary: #9c9a92;
            --accent-primary-color: #bf603b;
            --accent-primary-hover: #d27753;
            --accent-secondary-color: #4084de;
            --accent-secondary-hover: #7cace4;
            --node-antrag: #d86b74;
            --node-supporter: #7dff00;
            --node-group-red: #d86b74;
            --node-group-green: #9cc376;
            --node-group-blue: #6eb0f2;
            --node-group-purple: #c179e0;
            --node-group-orange: #cc9962;
            --node-group-light-grey: #acb2c0;
            --node-group-dark-grey: #5d6371;



            --link-color: rgba(153, 153, 153, 0.3);
            --default-font: 'ModernDense', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--default-font);
            background: var(--bg-graph);
            color: var(--text-primary);
            overflow: hidden;
        }

        .font-dyslexic { font-family: 'Dyslexic', sans-serif !important; }
        .font-modern-dense { font-family: 'ModernDense', sans-serif !important; }
        .font-modern-wide { font-family: 'ModernWide', sans-serif !important; }
        .font-serif { font-family: 'Serif', serif !important; }

        #controls-panel {
            transition: transform 0.3s ease;

        }

        /* Canvas statt SVG */
        #graph-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #graph-canvas:active {
            cursor: grabbing;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0BA1DD;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            #controls-panel {
                width: 100% !important;
                height: auto !important;
                max-height: 50vh !important;
                bottom: 0;
                top: auto;
                left: 0;
                right: 0;
                border-radius: 16px 16px 0 0;
            }

            .mobile-hidden {
                display: none;
            }
        }

        /* Tab Content */
        .tab-content {
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Group Item */
        .group-item {
            transition: all 0.2s;
        }

        .group-item:hover {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.4);
        }

        /* Panel Collapse */
        .panel-collapsed {
            transform: translateX(-100%);
        }

        .panel-collapsed #collapse-btn {
            transform: translateX(320px) rotate(180deg);
        }


        #collapse-btn {
            transition: all 0.3s ease;
        }

        /* Color Preset */
        .color-preset {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-preset:hover {
            transform: scale(1.1);
        }

        .color-preset.selected {
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .bright-container {
            background-color: transparent;
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 3.5%),
                    0 0 0 0.5px hsla(var(--border-300) / 0.15);
            color: var(--text-200-full);
            border-radius: 0.5rem;
        }

        .bright-container:hover {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 3.5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.3);
            color: var(--text-000-full);
        }

        .bright-container:focus-within {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 7.5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.3);
            color: var(--text-000-full);
        }

        .bright-container:hover:focus-within {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 7.5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.3);
            color: var(--text-000-full);
        }

        .fancy-button {
            background-color: transparent;
            color: var(--text-200-full);
            border-radius: 0.5rem;
        }

        .fancy-button:hover {
            background-color: var(--bg-300-full);
            color: var(--text-000-full);
        }

        .fancy-button:focus,
        .fancy-button:focus-visible {
            background-color: var(--bg-200-full);
            color: var(--text-200-full);
            outline: none;
        }

        .fancy-button:hover:focus,
        .fancy-button:hover:focus-visible {
            background-color: var(--bg-200-full);
            color: var(--text-200-full);
        }







    </style>
</head>
<body>
<div class="relative h-screen w-screen">
    <!-- Canvas Element statt SVG -->
    <canvas id="graph-canvas"></canvas>



    <!-- Controls Panel -->
    <div id="controls-panel" class="absolute top-5 left-5 w-80 overflow-hidden z-40 rounded-2xl border-width:0 bg-[hsl(var(--bg-100))] border-transparent shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/3.5%),0_0_0_0.5px_hsla(var(--border-300)/0.15)] hover:shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/3.5%),0_0_0_0.5px_hsla(var(--border-200)/0.3)] focus-within:shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/7.5%),0_0_0_0.5px_hsla(var(--border-200)/0.3)] hover:focus-within:shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/7.5%),0_0_0_0.5px_hsla(var(--border-200)/0.3)]">
        <!-- Collapse Button -->
        <button id="collapse-btn" class="absolute top-4 -right-10 z-50 rounded-r-lg p-2 transition-all fancy-button">
            <svg class="h-5 w-5 text-[hsl(var(--text-200))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>

        <!-- Mobile Toggle Button -->
        <button id="mobile-toggle" class="flex w-full items-center justify-between p-4 text-[hsl(var(--text-200))] md:hidden fancy-button">
            <span class="font-semibold">Steuerung</span>
            <svg class="h-5 w-5 transition-transform" id="mobile-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>

        <div id="controls-content" class="md:block">
            <!-- Tabs -->
            <div class="border-b border-[hsl(var(--text-500)/0.2)]">
                <ul class="flex flex-wrap text-center text-sm font-medium" role="tablist">
                    <li class="flex-1" role="presentation">
                        <button class="inline-block w-full rounded-t-lg transition-colors px-1 h-[3rem] text-base tracking-wider text-[hsl(var(--text-500))] border-b-2 border-[hsl(var(--text-100)/0)] hover:text-[hsl(var(--text-200))]" id="view-tab" type="button" role="tab">Ansicht</button>
                    </li>
                    <li class="flex-1" role="presentation">
                        <button class="inline-block w-full rounded-t-lg transition-colors px-1 h-[3rem] text-base tracking-wider text-[hsl(var(--text-500))] border-b-2 border-[hsl(var(--text-100)/0)] hover:text-[hsl(var(--text-200))]" id="search-tab" type="button" role="tab">Suche</button>
                    </li>
                    <li class="flex-1" role="presentation">
                        <button class="inline-block w-full rounded-t-lg transition-colors px-1 h-[3rem] text-base tracking-wider text-[hsl(var(--text-500))] border-b-2 border-[hsl(var(--text-100)/0)] hover:text-[hsl(var(--text-200))]" id="groups-tab" type="button" role="tab">Gruppen</button>
                    </li>
                </ul>
            </div>

            <div id="tab-content">
                <!-- View Tab -->
                <div class="tab-content hidden p-4" id="view-content" role="tabpanel">
                    <h3 class="mb-2 text-[hsl(var(--text-200))] flex items-center text-center min-w-0 font-serif text-2xl">Darstellung</h3>

                    <hr class="mb-2 mt-2 border-[hsl(var(--text-500)/0.2)]">




                    <div class="mb-2 mt-2">
                        <label class="mb-2 block text-sm font-medium text-[hsl(var(--text-000))]">Node Typ</label>
                        <select id="node-type" class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bright-container focus:ring-2 focus:ring-[hsl(var(--bg-200))]">
                             <option value="all">Alle anzeigen</option>
                             <option value="antrag">Nur Anträge</option>
                             <option value="supporter">Nur Supporter</option>
                         </select>
                    </div>





                    <div class="mb-4 space-y-2">
                        <div class="flex items-center">
                            <input id="show-labels" type="checkbox" checked class="h-4 w-4 rounded border-[hsl(var(--border-300)/0.3)] bg-[hsl(var(--bg-200))] text-[hsl(var(--accent-main-100))] focus:ring-2 focus:ring-[hsl(var(--accent-main-100)/0.3)]" />
                            <label for="show-labels" class="ml-2 text-sm font-medium text-[hsl(var(--text-200))]">Labels anzeigen</label>
                        </div>
                        <div class="flex items-center">
                            <input id="show-links" type="checkbox" class="h-4 w-4 rounded border-[hsl(var(--border-300)/0.3)] bg-[hsl(var(--bg-200))] text-[hsl(var(--accent-main-100))] focus:ring-2 focus:ring-[hsl(var(--accent-main-100)/0.3)]" />
                            <label for="show-links" class="ml-2 text-sm font-medium text-[hsl(var(--text-200))]">Verbindungen anzeigen</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="mb-2 block text-sm font-medium text-[hsl(var(--text-200))]">Node-Größe</label>
                        <input id="node-size" type="range" min="0.5" max="2" step="0.1" value="1" class="h-2 w-full cursor-pointer appearance-none rounded-lg bg-[hsl(var(--bg-200))] accent-[hsl(var(--accent-main-100))]" />
                    </div>

                    <button id="reset-view" class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">Ansicht zurücksetzen</button>

                </div>

                <!-- Search Tab -->
                <div class="tab-content hidden p-4" id="search-content" role="tabpanel">

                    <h3 class="mb-2 text-[hsl(var(--text-200))] flex items-center text-center min-w-0 font-serif text-2xl">Suche</h3>

                    <hr class="mb-2 mt-2 border-[hsl(var(--text-500)/0.2)]">


                    <div class="mb-4">
                        <label class="mb-2 block text-sm font-medium text-[hsl(var(--text-000))]">Nach Node suchen</label>
                        <input id="search" type="text" placeholder="Node-Name eingeben..." class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bright-container focus:ring-2 focus:ring-[hsl(var(--bg-200))]" />
                    </div>

                    <div id="selected-node-container" class="mb-4">
                        <h4 class="mb-2 text-sm font-medium text-[hsl(var(--text-000))]">Ausgewählt:</h4>
                        <p id="selected-node" class="text-sm text-[hsl(var(--text-200))]">Nichts</p>
                        <!-- Button für Antrags-URL -->
                        <button id="open-antrag-url" class="hidden w-full mt-2 font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bg-[hsl(var(--accent-secondary-100))] text-white hover:bg-[hsl(var(--accent-secondary-000))]">
                            Antrag öffnen
                        </button>
                    </div>

                    <button id="reset-selection" class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">Auswahl aufheben</button>

                </div>

                <!-- Groups Tab -->
                <div class="tab-content hidden p-4" id="groups-content" role="tabpanel">

                    <h3 class="mb-2 text-[hsl(var(--text-200))] flex items-center text-center min-w-0 font-serif text-2xl">Gruppen</h3>

                    <hr class="mb-2 mt-2 border-[hsl(var(--text-500)/0.2)]">

                    <div class="mb-4">
                        <button id="create-group-btn" class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bg-[hsl(var(--accent-main-100))] text-white hover:bg-[hsl(var(--accent-main-000))]">
                            Neue Gruppe erstellen
                        </button>
                    </div>

                    <div id="groups-list" class="space-y-2">
                        <!-- Groups will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-[hsl(var(--bg-400))]">
        <div class="text-center">
            <div class="mb-4 h-12 w-12 animate-spin rounded-full border-4 border-[hsl(var(--accent-main-100))] border-t-transparent mx-auto"></div>
            <p id="loading-text" class="text-[hsl(var(--text-100))]">Lade Daten...</p>
        </div>
    </div>

    <!-- Color Selection Modal -->
    <div id="color-modal" tabindex="-1" aria-hidden="true" class="fixed top-0 left-0 right-0 z-50 hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative w-full max-w-2xl max-h-full">
            <div class="relative rounded-lg shadow bg-[hsl(var(--bg-100))]">
                <div class="flex items-start justify-between p-4 border-b border-[hsl(var(--text-500)/0.2)] rounded-t">
                    <h3 class="text-xl font-semibold text-[hsl(var(--text-100))]">
                        Farbe für Gruppe auswählen
                    </h3>
                    <button type="button" class="text-[hsl(var(--text-400))] bg-transparent hover:bg-[hsl(var(--bg-200))] rounded-lg text-sm p-1.5 ml-auto inline-flex items-center" data-modal-hide="color-modal">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
                <div class="p-6 space-y-6">
                    <div class="flex flex-wrap gap-3" id="color-presets">
                        <!-- Color presets will be added dynamically -->
                    </div>
                    <div>
                        <label class="block mb-2 text-sm font-medium text-[hsl(var(--text-100))]">Oder eigene Farbe wählen:</label>
                        <input type="color" id="custom-color-input" class="w-full h-10 rounded cursor-pointer" />
                    </div>
                </div>
                <div class="flex items-center p-6 space-x-2 border-t border-[hsl(var(--text-500)/0.2)] rounded-b">
                    <button id="confirm-color" type="button" class="font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 bg-[hsl(var(--accent-main-100))] text-white hover:bg-[hsl(var(--accent-main-000))]">
                        Bestätigen
                    </button>
                    <button data-modal-hide="color-modal" type="button" class="font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">
                        Abbrechen
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.js"></script>
<script>
    class GraphVisualization {
        constructor() {
            this.canvas = document.getElementById('graph-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            
            this.canvas.width = this.width;
            this.canvas.height = this.height;

            this.selectedNode = null;
            this.hoveredNode = null;
            this.groups = [];
            this.nodeGroups = new Map();
            this.selectedColor = '#7f6df2';
            this.defaultFont = 'modern_dense';
            this.currentGroupForSearch = null;
            this.amendmentsUrls = new Map();

            this.settings = {
                showLabels: true,
                showLinks: false,
                nodeType: 'all',
                nodeSize: 1
            };

            this.transform = {
                x: 0,
                y: 0,
                scale: 1
            };

            this.isDragging = false;
            this.dragStart = { x: 0, y: 0 };

            this.setupEventListeners();
            this.setupTabs();
            this.setupMobileToggle();
            this.setupColorModal();
            this.setupCollapsePanel();
            this.loadData();
        }

        setupCollapsePanel() {
            const panel = document.getElementById('controls-panel');
            const btn = document.getElementById('collapse-btn');

            btn.addEventListener('click', () => {
                panel.classList.toggle('panel-collapsed');
            });
        }

        setupColorModal() {
            const modal = FlowbiteInstances.getInstance('Modal', 'color-modal');
            const presets = document.querySelectorAll('.color-preset');
            const customInput = document.getElementById('custom-color-input');
            const confirmBtn = document.getElementById('confirm-color');
            const selectBtn = document.getElementById('select-color-btn');

            selectBtn.addEventListener('click', () => {
                const modalEl = document.getElementById('color-modal');
                const modalInstance = new Modal(modalEl);
                modalInstance.show();
            });

            presets.forEach(preset => {
                preset.addEventListener('click', () => {
                    presets.forEach(p => p.classList.remove('selected'));
                    preset.classList.add('selected');
                    this.selectedColor = preset.dataset.color;
                    customInput.value = this.selectedColor;
                });
            });

            customInput.addEventListener('input', (e) => {
                this.selectedColor = e.target.value;
                presets.forEach(p => p.classList.remove('selected'));
            });

            confirmBtn.addEventListener('click', () => {
                if (this.currentGroupForSearch !== null) {
                    const group = this.groups[this.currentGroupForSearch];
                    if (group) {
                        group.color = this.selectedColor;
                        this.updateGroupsList();
                        this.render();
                    }
                }
                const modalEl = document.getElementById('color-modal');
                const modalInstance = FlowbiteInstances.getInstance('Modal', 'color-modal');
                if (modalInstance) {
                    modalInstance.hide();
                }
            });

            const colorPresets = [
                '#d86b74', '#9cc376', '#6eb0f2', '#c179e0', '#cc9962',
                '#acb2c0', '#5d6371', '#ff6b6b', '#4ecdc4', '#45b7d1',
                '#96ceb4', '#ffeaa7', '#dfe6e9', '#fd79a8', '#fdcb6e'
            ];

            const presetsContainer = document.getElementById('color-presets');
            colorPresets.forEach(color => {
                const div = document.createElement('div');
                div.className = 'color-preset';
                div.style.backgroundColor = color;
                div.dataset.color = color;
                presetsContainer.appendChild(div);
            });

            presetsContainer.querySelectorAll('.color-preset').forEach(preset => {
                preset.addEventListener('click', () => {
                    presetsContainer.querySelectorAll('.color-preset').forEach(p => p.classList.remove('selected'));
                    preset.classList.add('selected');
                    this.selectedColor = preset.dataset.color;
                    customInput.value = this.selectedColor;
                });
            });
        }

        setupMobileToggle() {
            const toggleBtn = document.getElementById('mobile-toggle');
            const content = document.getElementById('controls-content');
            const icon = document.getElementById('mobile-toggle-icon');

            if (window.innerWidth <= 768) {
                content.style.display = 'none';
            }

            toggleBtn.addEventListener('click', () => {
                const isHidden = content.style.display === 'none';
                content.style.display = isHidden ? 'block' : 'none';
                icon.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        }

        setupTabs() {
            const tabs = ['view', 'search', 'groups'];
            const tabButtons = tabs.map(tab => document.getElementById(`${tab}-tab`));
            const tabContents = tabs.map(tab => document.getElementById(`${tab}-content`));

            tabButtons.forEach((button, index) => {
                button.addEventListener('click', () => {
                    tabButtons.forEach(btn => {
                        btn.classList.remove('border-[hsl(var(--text-100))]', 'text-[hsl(var(--text-100))]');
                        btn.classList.add('text-[hsl(var(--text-500))]', 'border-[hsl(var(--text-100)/0)]');
                    });

                    button.classList.remove('text-[hsl(var(--text-500))]', 'border-[hsl(var(--text-100)/0)]');
                    button.classList.add('border-[hsl(var(--text-100))]', 'text-[hsl(var(--text-100))]');

                    tabContents.forEach(content => content.classList.add('hidden'));
                    tabContents[index].classList.remove('hidden');
                });
            });

            tabButtons[0].click();
        }

        async loadData() {
            try {
                const [graphData, urlData] = await Promise.all([
                    fetch('./data.json').then(r => r.json()),
                    fetch('./amendments_url.json').then(r => r.json())
                ]);

                urlData.forEach(item => {
                    this.amendmentsUrls.set(item.title, item.url);
                });

                this.processData(graphData);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading-text').textContent = 'Fehler beim Laden der Daten';
            }
        }

        processData(data) {
            document.getElementById('loading-text').textContent = 'Verarbeite Daten...';

            const linkCountMap = new Map();
            data.links.forEach(link => {
                linkCountMap.set(link.source, (linkCountMap.get(link.source) || 0) + 1);
                linkCountMap.set(link.target, (linkCountMap.get(link.target) || 0) + 1);
            });

            this.nodes = data.nodes.map(node => ({
                ...node,
                linkCount: linkCountMap.get(node.id) || 0,
                x: Math.random() * this.width,
                y: Math.random() * this.height
            }));

            this.links = data.links.map(link => ({
                source: this.nodes.find(n => n.id === link.source),
                target: this.nodes.find(n => n.id === link.target)
            }));

            this.simulatePhysics();
        }

        simulatePhysics() {
            document.getElementById('loading-text').textContent = 'Simulation läuft...';

            const simulation = d3.forceSimulation(this.nodes)
                .force("link", d3.forceLink(this.links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(this.width / 2, this.height / 2))
                .force("collision", d3.forceCollide().radius(30))
                .alphaDecay(0.02)
                .alphaMin(0.001);

            let iterations = 0;
            const maxIterations = 300;

            simulation.on("tick", () => {
                iterations++;
                const progress = Math.min(100, (iterations / maxIterations) * 100);
                document.getElementById('loading-text').textContent = `Simulation läuft... ${Math.round(progress)}%`;
            });

            simulation.on("end", () => {
                document.getElementById('loading').style.display = 'none';
                this.render();
                this.centerGraph();
            });
        }

        setupEventListeners() {
            window.addEventListener('resize', () => this.onResize());

            // Canvas Interaktionen
            this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
            this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
            this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
            this.canvas.addEventListener('wheel', (e) => this.onWheel(e));
            this.canvas.addEventListener('click', (e) => this.onCanvasClick(e));

            document.getElementById('search').addEventListener('input', (e) => this.onSearch(e));
            document.getElementById('node-type').addEventListener('change', (e) => this.onFilterChange(e));
            document.getElementById('show-labels').addEventListener('change', (e) => {
                this.settings.showLabels = e.target.checked;
                this.render();
            });
            document.getElementById('show-links').addEventListener('change', (e) => {
                this.settings.showLinks = e.target.checked;
                this.render();
            });
            document.getElementById('node-size').addEventListener('input', (e) => {
                this.settings.nodeSize = parseFloat(e.target.value);
                this.render();
            });
            document.getElementById('reset-view').addEventListener('click', () => this.centerGraph());
            document.getElementById('reset-selection').addEventListener('click', () => this.deselectAll());
            document.getElementById('create-group-btn').addEventListener('click', () => this.createGroup());
            
            document.getElementById('open-antrag-url').addEventListener('click', () => {
                if (this.selectedNode) {
                    const url = this.amendmentsUrls.get(this.selectedNode.label);
                    if (url) {
                        window.open(url, '_blank');
                    }
                }
            });
        }

        onMouseDown(e) {
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const node = this.getNodeAtPosition(x, y);
            if (!node) {
                this.isDragging = true;
                this.dragStart = { x: e.clientX, y: e.clientY };
                this.canvas.style.cursor = 'grabbing';
            }
        }

        onMouseMove(e) {
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (this.isDragging) {
                const dx = e.clientX - this.dragStart.x;
                const dy = e.clientY - this.dragStart.y;
                this.transform.x += dx;
                this.transform.y += dy;
                this.dragStart = { x: e.clientX, y: e.clientY };
                this.render();
            } else {
                const node = this.getNodeAtPosition(x, y);
                if (node !== this.hoveredNode) {
                    this.hoveredNode = node;
                    this.canvas.style.cursor = node ? 'pointer' : 'grab';
                    this.render();
                }
            }
        }

        onMouseUp(e) {
            this.isDragging = false;
            this.canvas.style.cursor = 'grab';
        }

        onWheel(e) {
            e.preventDefault();
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.max(0.1, Math.min(4, this.transform.scale * delta));

            const worldX = (x - this.transform.x) / this.transform.scale;
            const worldY = (y - this.transform.y) / this.transform.scale;

            this.transform.x = x - worldX * newScale;
            this.transform.y = y - worldY * newScale;
            this.transform.scale = newScale;

            this.render();
        }

        onCanvasClick(e) {
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const node = this.getNodeAtPosition(x, y);
            if (node) {
                this.selectNode(node);
            } else {
                this.deselectAll();
            }
        }

        getNodeAtPosition(canvasX, canvasY) {
            const worldX = (canvasX - this.transform.x) / this.transform.scale;
            const worldY = (canvasY - this.transform.y) / this.transform.scale;

            for (let node of this.nodes) {
                const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                const dx = node.x - worldX;
                const dy = node.y - worldY;
                if (Math.sqrt(dx * dx + dy * dy) <= radius) {
                    return node;
                }
            }
            return null;
        }

        selectNode(node) {
            this.selectedNode = node;
            document.getElementById('selected-node').textContent = node.label;
            
            const urlButton = document.getElementById('open-antrag-url');
            if (this.amendmentsUrls.has(node.label)) {
                urlButton.classList.remove('hidden');
            } else {
                urlButton.classList.add('hidden');
            }
            
            this.render();
        }

        deselectAll() {
            this.selectedNode = null;
            document.getElementById('selected-node').textContent = 'Nichts';
            
            document.getElementById('open-antrag-url').classList.add('hidden');
            
            this.render();
        }

        render() {
            const ctx = this.ctx;
            ctx.clearRect(0, 0, this.width, this.height);

            ctx.save();
            ctx.translate(this.transform.x, this.transform.y);
            ctx.scale(this.transform.scale, this.transform.scale);

            const connectedNodeIds = new Set();
            if (this.selectedNode) {
                this.links.forEach(link => {
                    if (link.source.id === this.selectedNode.id) {
                        connectedNodeIds.add(link.target.id);
                    } else if (link.target.id === this.selectedNode.id) {
                        connectedNodeIds.add(link.source.id);
                    }
                });
            }

            // Links zeichnen
            if (this.settings.showLinks) {
                this.links.forEach(link => {
                    const isDimmed = this.selectedNode && 
                        link.source.id !== this.selectedNode.id && 
                        link.target.id !== this.selectedNode.id;
                    
                    ctx.strokeStyle = isDimmed ? 'rgba(153, 153, 153, 0.05)' : 'rgba(153, 153, 153, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(link.source.x, link.source.y);
                    ctx.lineTo(link.target.x, link.target.y);
                    ctx.stroke();
                });
            }

            // Nodes zeichnen
            this.nodes.forEach(node => {
                if (this.settings.nodeType !== 'all' && node.type !== this.settings.nodeType) return;

                const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                const isDimmed = this.selectedNode && 
                    node.id !== this.selectedNode.id && 
                    !connectedNodeIds.has(node.id);
                
                const isSelected = node === this.selectedNode;

                ctx.globalAlpha = isDimmed ? 0.2 : 1;
                
                ctx.fillStyle = this.getNodeColor(node);
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                ctx.fill();

                if (isSelected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (node === this.hoveredNode) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                ctx.globalAlpha = 1;
            });

            // Labels zeichnen
            this.nodes.forEach(node => {
                if (this.settings.nodeType !== 'all' && node.type !== this.settings.nodeType) return;

                const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                const showLabel = this.settings.showLabels || 
                    node === this.selectedNode || 
                    node === this.hoveredNode || 
                    connectedNodeIds.has(node.id);

                if (!showLabel) return;

                const isDimmed = this.selectedNode && 
                    node.id !== this.selectedNode.id && 
                    !connectedNodeIds.has(node.id);

                ctx.globalAlpha = isDimmed ? 0.2 : 1;

                ctx.font = this.getFont(node.font || this.defaultFont, 12);
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-primary');
                ctx.fillText(node.label, node.x + radius + 5, node.y + 4);

                if (node.sublabel) {
                    ctx.font = this.getFont(node.font || this.defaultFont, 10);
                    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary');
                    ctx.fillText(node.sublabel, node.x + radius + 5, node.y + 16);
                }

                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        getFont(fontName, size) {
            const fontMap = {
                'modern_dense': 'ModernDense',
                'dyslexic': 'Dyslexic',
                'modern_wide': 'ModernWide',
                'serif': 'Serif'
            };
            return `${size}px ${fontMap[fontName] || 'ModernDense'}`;
        }

        getNodeColor(node) {
            const groupId = this.nodeGroups.get(node.id);
            if (groupId !== undefined) {
                const group = this.groups.find(g => g.id === groupId);
                if (group) return group.color;
            }
            return node.color;
        }

        onResize() {
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            this.canvas.width = this.width;
            this.canvas.height = this.height;
            this.render();
        }

        centerGraph() {
            if (!this.nodes || this.nodes.length === 0) return;

            const bounds = this.getGraphBounds();
            const graphWidth = bounds.maxX - bounds.minX;
            const graphHeight = bounds.maxY - bounds.minY;
            const centerX = (bounds.minX + bounds.maxX) / 2;
            const centerY = (bounds.minY + bounds.maxY) / 2;

            const scaleX = (this.width * 0.8) / graphWidth;
            const scaleY = (this.height * 0.8) / graphHeight;
            this.transform.scale = Math.min(scaleX, scaleY, 1);

            this.transform.x = this.width / 2 - centerX * this.transform.scale;
            this.transform.y = this.height / 2 - centerY * this.transform.scale;

            this.render();
        }

        getGraphBounds() {
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            this.nodes.forEach(node => {
                minX = Math.min(minX, node.x);
                maxX = Math.max(maxX, node.x);
                minY = Math.min(minY, node.y);
                maxY = Math.max(maxY, node.y);
            });

            return { minX, maxX, minY, maxY };
        }

        onSearch(e) {
            const query = e.target.value.toLowerCase();
            if (!query) {
                this.deselectAll();
                return;
            }

            const node = this.nodes.find(n => n.label.toLowerCase().includes(query));
            if (node) {
                this.selectNode(node);
                this.focusOnNode(node);
            }
        }

        focusOnNode(node) {
            this.transform.x = this.width / 2 - node.x * this.transform.scale;
            this.transform.y = this.height / 2 - node.y * this.transform.scale;
            this.render();
        }

        onFilterChange(e) {
            this.settings.nodeType = e.target.value;
            this.render();
        }

        createGroup() {
            if (!this.selectedNode) {
                alert('Bitte wählen Sie zuerst einen Node aus');
                return;
            }

            const groupName = prompt('Gruppenname eingeben:');
            if (!groupName) return;

            const group = {
                id: Date.now(),
                name: groupName,
                color: this.selectedColor,
                nodeIds: [this.selectedNode.id]
            };

            this.groups.push(group);
            this.nodeGroups.set(this.selectedNode.id, group.id);
            this.updateGroupsList();
            this.render();
        }

        updateGroupsList() {
            const container = document.getElementById('groups-list');
            container.innerHTML = '';

            this.groups.forEach((group, index) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-item p-3 rounded-lg cursor-pointer transition-all bright-container';
                
                groupDiv.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded" style="background-color: ${group.color}"></div>
                            <span class="text-sm font-medium text-[hsl(var(--text-100))]">${group.name}</span>
                        </div>
                        <div class="flex gap-2">
                            <button class="change-color-btn p-1 rounded hover:bg-[hsl(var(--bg-200))]" data-index="${index}">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                                </svg>
                            </button>
                            <button class="delete-group-btn p-1 rounded hover:bg-[hsl(var(--bg-200))]" data-index="${index}">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="text-xs text-[hsl(var(--text-400))] mt-1">${group.nodeIds.length} Node(s)</div>
                `;

                container.appendChild(groupDiv);

                groupDiv.querySelector('.change-color-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.currentGroupForSearch = index;
                    const modalEl = document.getElementById('color-modal');
                    const modalInstance = new Modal(modalEl);
                    modalInstance.show();
                });

                groupDiv.querySelector('.delete-group-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.deleteGroup(index);
                });

                groupDiv.addEventListener('click', () => {
                    this.highlightGroup(group);
                });
            });
        }

        deleteGroup(index) {
            const group = this.groups[index];
            group.nodeIds.forEach(nodeId => {
                this.nodeGroups.delete(nodeId);
            });
            this.groups.splice(index, 1);
            this.updateGroupsList();
            this.render();
        }

        highlightGroup(group) {
            if (group.nodeIds.length > 0) {
                const firstNode = this.nodes.find(n => n.id === group.nodeIds[0]);
                if (firstNode) {
                    this.selectNode(firstNode);
                    this.focusOnNode(firstNode);
                }
            }
        }
    }

    const graph = new GraphVisualization();
</script>
</body>
</html>
