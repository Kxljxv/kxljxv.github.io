<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netzwerk Graph</title>
    
    <!-- Flowbite and Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.css" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
            background: #202020;
            color: #dcddde;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #graph-svg {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #graph-svg:active {
            cursor: grabbing;
        }

        .hidden {
            display: none !important;
        }

        .link {
            stroke: rgba(153, 153, 153, 0.3);
            stroke-width: 1;
            transition: opacity 0.3s ease;
        }

        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node:hover {
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        .node.selected {
            stroke: #ffffff;
            stroke-width: 2;
        }

        .node.dimmed {
            opacity: 0.2;
        }

        .link.dimmed {
            opacity: 0.1;
        }

        .label.dimmed {
            opacity: 0.2;
        }

        .label {
            fill: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.3s ease;
        }

        .sublabel {
            fill: #a0a0a0;
            font-family: Arial, sans-serif;
            font-size: 10px;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.3s ease;
        }

        /* Controls Panel */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 20px;
            min-width: 280px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        @media (max-width: 768px) {
            #controls {
                transform: translateX(-100%);
            }
            
            #controls.show {
                transform: translateX(0);
            }
            
            .control-toggle {
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 101;
                background: rgba(30, 30, 30, 0.95);
                border: 1px solid #3a3a3a;
                border-radius: 8px;
                padding: 10px;
                cursor: pointer;
                backdrop-filter: blur(10px);
            }
        }

        .flowbite-input {
            @apply bg-gray-800 border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500;
        }

        .flowbite-select {
            @apply bg-gray-800 border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500;
        }

        .flowbite-button {
            @apply text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none;
        }

        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            color: #a0a0a0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.98);
            padding: 40px 60px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #3a3a3a;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        /* Search Results Styling */
        #search-results {
            @apply mt-2 bg-gray-800 border border-gray-600 rounded-lg overflow-hidden;
            max-height: 200px;
            overflow-y: auto;
        }

        .search-item {
            @apply px-4 py-2 hover:bg-gray-700 cursor-pointer border-b border-gray-600 last:border-b-0;
        }

        /* Checkbox styling */
        .checkbox-group {
            @apply flex items-center mb-4;
        }

        .checkbox-group input[type="checkbox"] {
            @apply w-4 h-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-600;
        }

        .checkbox-group label {
            @apply ml-2 text-sm font-medium text-gray-300;
        }

        /* Range input styling */
        input[type="range"] {
            @apply w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <div id="container">
        <svg id="graph-svg"></svg>
        
        <!-- Mobile Toggle Button -->
        <button id="controls-toggle" type="button" class="control-toggle md:hidden">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
            </svg>
        </button>
        
        <div id="loading">
            <h2 class="text-xl font-bold text-blue-500 mb-4">Graph wird vorbereitet...</h2>
            <div class="spinner"></div>
            <p id="loading-text" class="mt-4">Lade Daten...</p>
        </div>

        <div id="controls">
            <h3 class="text-lg font-semibold text-blue-500 mb-6">Graph Steuerung</h3>
            
            <div class="mb-6">
                <label for="search" class="block mb-2 text-sm font-medium text-gray-300">Suche:</label>
                <input type="text" id="search" class="flowbite-input w-full rounded-lg" placeholder="Node suchen...">
                <div id="search-results"></div>
            </div>

            <div class="mb-6">
                <label for="node-type" class="block mb-2 text-sm font-medium text-gray-300">Node Typ Filter:</label>
                <select id="node-type" class="flowbite-select w-full rounded-lg">
                    <option value="all">Alle anzeigen</option>
                    <option value="antrag">Nur Anträge</option>
                    <option value="supporter">Nur Supporter</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block mb-2 text-sm font-medium text-gray-300">Darstellung:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="show-labels" checked>
                    <label for="show-labels">Labels anzeigen</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="show-links">
                    <label for="show-links">Verbindungen anzeigen</label>
                </div>
            </div>

            <div class="mb-6">
                <label for="node-size" class="block mb-2 text-sm font-medium text-gray-300">Node-Größe:</label>
                <input type="range" id="node-size" min="0.5" max="2" step="0.1" value="1">
            </div>

            <button id="reset-view" class="flowbite-button w-full mb-2">Ansicht zurücksetzen</button>
            <button id="center-graph" class="flowbite-button w-full">Graph zentrieren</button>
        </div>

        <div id="stats">
            <div class="mb-1"><strong>Nodes:</strong> <span id="node-count">0</span></div>
            <div class="mb-1"><strong>Verbindungen:</strong> <span id="link-count">0</span></div>
            <div><strong>Ausgewählt:</strong> <span id="selected-node">-</span></div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.js"></script>
    <script>
        // Add mobile controls toggle functionality
        document.getElementById('controls-toggle').addEventListener('click', () => {
            const controls = document.getElementById('controls');
            controls.classList.toggle('show');
        });

        class GraphVisualization {
            constructor() {
                this.svg = d3.select('#graph-svg');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                
                this.svg.attr('width', this.width).attr('height', this.height);

                // Create main group for zoom/pan
                this.g = this.svg.append('g');
                
                // Create groups for links and nodes
                this.linkGroup = this.g.append('g').attr('class', 'links hidden');
                this.nodeGroup = this.g.append('g').attr('class', 'nodes');
                this.labelGroup = this.g.append('g').attr('class', 'labels');

                this.selectedNode = null;

                this.settings = {
                    showLabels: true,
                    showLinks: false,
                    nodeType: 'all',
                    nodeSize: 1
                };

                // Setup zoom behavior
                this.zoom = d3.zoom()
                    .scaleExtent([0.1, 4])
                    .on('zoom', (event) => {
                        this.g.attr('transform', event.transform);
                        this.currentTransform = event.transform;
                    });

                this.svg.call(this.zoom);
                
                // Add click handler to svg to deselect when clicking background
                this.svg.on('click', (event) => {
                    if (event.target === this.svg.node()) {
                        this.deselectAll();
                    }
                });

                this.loadData();
            }

            // Rest of the GraphVisualization class methods remain the same
            // ... (include all the previous methods without changes)

            onSearch(e) {
                const query = e.target.value.toLowerCase();
                const resultsDiv = document.getElementById('search-results');
                
                if (!query) {
                    resultsDiv.innerHTML = '';
                    return;
                }

                const matches = this.allNodes.filter(node => 
                    node.label.toLowerCase().includes(query) ||
                    (node.sublabel && node.sublabel.toLowerCase().includes(query))
                ).slice(0, 10);

                resultsDiv.innerHTML = matches.map(node => 
                    `<div class="search-item" data-id="${node.id}">
                        ${node.label}${node.sublabel ? ` <span class="text-gray-400">(${node.sublabel})</span>` : ''}
                    </div>`
                ).join('');

                resultsDiv.querySelectorAll('.search-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const node = this.allNodes.find(n => n.id === item.dataset.id);
                        // Just highlight the node without zooming
                        this.onNodeClick({ stopPropagation: () => {} }, node);
                        resultsDiv.innerHTML = '';
                        document.getElementById('search').value = '';
                    });
                });
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            const graph = new GraphVisualization();
        });
    </script>
</body>
</html>
