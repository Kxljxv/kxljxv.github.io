<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netzwerk Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.css" rel="stylesheet" />
    <style>

        /* Custom Fonts */
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic_bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic_italic.woff2') format('woff2');
            font-weight: normal;
            font-style: italic;
        }
        @font-face {
            font-family: 'Dyslexic';
            src: url('https://kxljxv.github.io/aea/fonts/dyslexic_italic_bold.woff2') format('woff2');
            font-weight: bold;
            font-style: italic;
        }
        @font-face {
            font-family: 'ModernDense';
            src: url('https://kxljxv.github.io/aea/fonts/modern_dense.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'ModernDense';
            src: url('https://kxljxv.github.io/aea/fonts/modern_dense_italic.woff2') format('woff2');
            font-weight: normal;
            font-style: italic;
        }
        @font-face {
            font-family: 'ModernWide';
            src: url('https://kxljxv.github.io/aea/fonts/modern_wide.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Serif';
            src: url('https://kxljxv.github.io/aea/fonts/serif.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Serif';
            src: url('https://kxljxv.github.io/aea/fonts/serif_italic.woff2') format('woff2');
            font-weight: normal;
            font-style: italic;
        }

        /* Custom CSS Variables */
        :root {
            --always-white-full:hsl(0 0% 100%);
            --always-black-full:hsl(0 0% 0%);

            --always-white:0 0% 100%;
            --always-black:0 0% 0%;

            --accent-brand-full:hsl(15 63.1% 59.6%);
            --accent-main-000-full:hsl(15 54.2% 51.2%);
            --accent-main-100-full:hsl(15 63.1% 59.6%);
            --accent-main-200-full:hsl(15 63.1% 59.6%);
            --accent-main-900-full:hsl(0 0% 0%);
            --accent-pro-000-full:hsl(251 84.6% 74.5%);
            --accent-pro-100-full:hsl(251 40.2% 54.1%);
            --accent-pro-200-full:hsl(251 40% 45.1%);
            --accent-pro-900-full:hsl(250 25.3% 19.4%);
            --accent-secondary-000-full:hsl(210 65.5% 67.1%);
            --accent-secondary-100-full:hsl(210 70.9% 51.6%);
            --accent-secondary-200-full:hsl(210 70.9% 51.6%);
            --accent-secondary-900-full:hsl(210 55.9% 24.6%);
            --bg-000-full:hsl(60 2.1% 18.4%);
            --bg-100-full:hsl(60 2.7% 14.5%);
            --bg-200-full:hsl(30 3.3% 11.8%);
            --bg-300-full:hsl(60 2.6% 7.6%);
            --bg-400-full:hsl(0 0% 0%);
            --bg-500-full:hsl(0 0% 0%);
            --border-100-full:hsl(51 16.5% 84.5%);
            --border-200-full:hsl(51 16.5% 84.5%);
            --border-300-full:hsl(51 16.5% 84.5%);
            --border-400-full:hsl(51 16.5% 84.5%);
            --danger-000-full:hsl(0 98.4% 75.1%);
            --danger-100-full:hsl(0 67% 59.6%);
            --danger-200-full:hsl(0 67% 59.6%);
            --danger-900-full:hsl(0 46.5% 27.8%);
            --oncolor-100-full:hsl(0 0% 100%);
            --oncolor-200-full:hsl(60 6.7% 97.1%);
            --oncolor-300-full:hsl(60 6.7% 97.1%);
            --pictogram-100-full:hsl(48 3.4% 29.2%);
            --pictogram-200-full:hsl(60 2.5% 23.3%);
            --pictogram-300-full:hsl(60 2.1% 18.4%);
            --pictogram-400-full:hsl(60 2.7% 14.5%);
            --success-000-full:hsl(97 59.1% 46.1%);
            --success-100-full:hsl(97 75% 32.9%);
            --success-200-full:hsl(97 75% 32.9%);
            --success-900-full:hsl(127 100% 13.9%);
            --text-000-full:hsl(48 33.3% 97.1%);
            --text-100-full:hsl(48 33.3% 97.1%);
            --text-200-full:hsl(50 9% 73.7%);
            --text-300-full:hsl(50 9% 73.7%);
            --text-400-full:hsl(48 4.8% 59.2%);
            --text-500-full:hsl(48 4.8% 59.2%);


            --accent-brand:15 63.1% 59.6%;
            --accent-main-000:15 54.2% 51.2%;
            --accent-main-100:15 63.1% 59.6%;
            --accent-main-200:15 63.1% 59.6%;
            --accent-main-900:0 0% 0%;
            --accent-pro-000:251 84.6% 74.5%;
            --accent-pro-100:251 40.2% 54.1%;
            --accent-pro-200:251 40% 45.1%;
            --accent-pro-900:250 25.3% 19.4%;
            --accent-secondary-000:210 65.5% 67.1%;
            --accent-secondary-100:210 70.9% 51.6%;
            --accent-secondary-200:210 70.9% 51.6%;
            --accent-secondary-900:210 55.9% 24.6%;
            --bg-000:60 2.1% 18.4%;
            --bg-100:60 2.7% 14.5%;
            --bg-200:30 3.3% 11.8%;
            --bg-300:60 2.6% 7.6%;
            --bg-400:0 0% 0%;
            --bg-500:0 0% 0%;
            --border-100:51 16.5% 84.5%;
            --border-200:51 16.5% 84.5%;
            --border-300:51 16.5% 84.5%;
            --border-400:51 16.5% 84.5%;
            --danger-000:0 98.4% 75.1%;
            --danger-100:0 67% 59.6%;
            --danger-200:0 67% 59.6%;
            --danger-900:0 46.5% 27.8%;
            --oncolor-100:0 0% 100%;
            --oncolor-200:60 6.7% 97.1%;
            --oncolor-300:60 6.7% 97.1%;
            --pictogram-100:48 3.4% 29.2%;
            --pictogram-200:60 2.5% 23.3%;
            --pictogram-300:60 2.1% 18.4%;
            --pictogram-400:60 2.7% 14.5%;
            --success-000:97 59.1% 46.1%;
            --success-100:97 75% 32.9%;
            --success-200:97 75% 32.9%;
            --success-900:127 100% 13.9%;
            --text-000:48 33.3% 97.1%;
            --text-100:48 33.3% 97.1%;
            --text-200:50 9% 73.7%;
            --text-300:50 9% 73.7%;
            --text-400:48 4.8% 59.2%;
            --text-500:48 4.8% 59.2%;

            --bg-primary: #262624;
            --bg-primary-unselected: #303X02e;
            --bg-primary-hover: #2b2b29;
            --bg-primary-selected: #30302e;

            --button-normal: rgb(38, 38, 36, 0);

            --button-hover: #2b2b29;

            --button-selected: rgba(20, 20, 19, 0);

            --bg-light: #30302e;
            --bg-light-hover: #1f1e1d;
            --bg-light-selected: #141413;

            --bg-graph: #080807;
            --border-color: #4a4a46;
            --border-color-hover: #65645f;
            --text-heading-primary: #faf9f5;
            --text-heading-secondary: #faf9f5;
            --text-primary: #faf9f5;
            --text-secondary: #faf9f5;
            --text-tertiary: #9c9a92;
            --accent-primary-color: #bf603b;
            --accent-primary-hover: #d27753;
            --accent-secondary-color: #4084de;
            --accent-secondary-hover: #7cace4;
            --node-antrag: #d86b74;
            --node-supporter: #7dff00;
            --node-group-red: #d86b74;
            --node-group-green: #9cc376;
            --node-group-blue: #6eb0f2;
            --node-group-purple: #c179e0;
            --node-group-orange: #cc9962;
            --node-group-light-grey: #acb2c0;
            --node-group-dark-grey: #5d6371;



            --link-color: rgba(153, 153, 153, 0.3);
            --default-font: 'ModernDense', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--default-font);
            background: var(--bg-graph);
            color: var(--text-primary);
            overflow: hidden;
        }

        .font-dyslexic { font-family: 'Dyslexic', sans-serif !important; }
        .font-modern-dense { font-family: 'ModernDense', sans-serif !important; }
        .font-modern-wide { font-family: 'ModernWide', sans-serif !important; }
        .font-serif { font-family: 'Serif', serif !important; }

        #controls-panel {
            transition: transform 0.3s ease;

        }

        #graph-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
            display: block;
        }

        #graph-canvas:active {
            cursor: grabbing;
        }

        .link {
            stroke: var(--link-color);
            stroke-width: 1;
        }

        .node {
            cursor: pointer;
            transition: stroke-width 3s;
        }

        .node:hover {
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        .node.selected {
            stroke: #ffffff;
            stroke-width: 2;
        }

        .node.dimmed {
            opacity: 0.2;
        }

        .link.dimmed {
            opacity: 0.1;
        }

        .label.dimmed {
            opacity: 0.2;
        }

        .label {
            fill: var(--text-primary);
            font-size: 12px;
            pointer-events: none;
            user-select: none;
        }

        .sublabel {
            fill: var(--text-secondary);
            font-size: 10px;
            pointer-events: none;
            user-select: none;
        }

        /* Hover Label */
        .hover-label {
            display: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0BA1DD;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            #controls-panel {
                width: 100% !important;
                height: auto !important;
                max-height: 50vh !important;
                bottom: 0;
                top: auto;
                left: 0;
                right: 0;
                border-radius: 16px 16px 0 0;
            }

            .mobile-hidden {
                display: none;
            }
        }

        /* Tab Content */
        .tab-content {
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Group Item */
        .group-item {
            transition: all 0.2s;
        }

        .group-item:hover {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.4);
        }

        /* Panel Collapse */
        .panel-collapsed {
            transform: translateX(-100%);
        }

        .panel-collapsed #collapse-btn {
            transform: translateX(320px) rotate(180deg);
        }


        #collapse-btn {
            transition: all 0.3s ease;
        }

        /* Color Preset */
        .color-preset {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-preset:hover {
            transform: scale(1.1);
        }

        .color-preset.selected {
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        /* Performance optimizations */
        .node, .link, .label, .sublabel {
            will-change: auto;
        }

        .bright-container {
            background-color: transparent;
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 3.5%),
                    0 0 0 0.5px hsla(var(--border-300) / 0.15);
            color: var(--text-200-full);
            border-radius: 0.5rem;
        }

        .bright-container:hover {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 3.5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.3);
            color: var(--text-000-full);
        }

        .bright-container:focus-within {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 7.5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.3);
            color: var(--text-000-full);
        }

        .bright-container:hover:focus-within {
            box-shadow:
                    0 0.25rem 1.25rem hsl(var(--always-black) / 7.5%),
                    0 0 0 0.5px hsla(var(--border-200) / 0.3);
            color: var(--text-000-full);
        }

        .fancy-button {
            background-color: transparent;
            color: var(--text-200-full);
            border-radius: 0.5rem;
        }

        .fancy-button:hover {
            background-color: var(--bg-300-full);
            color: var(--text-000-full);
        }

        .fancy-button:focus,
        .fancy-button:focus-visible {
            background-color: var(--bg-200-full);
            color: var(--text-200-full);
            outline: none;
        }

        .fancy-button:hover:focus,
        .fancy-button:hover:focus-visible {
            background-color: var(--bg-200-full);
            color: var(--text-200-full);
        }







    </style>
</head>
<body>
<div class="relative h-screen w-screen">
    <canvas id="graph-canvas"></canvas>



    <!-- Controls Panel -->
    <div id="controls-panel" class="absolute top-5 left-5 w-80 overflow-hidden z-40 rounded-2xl border-width:0 bg-[hsl(var(--bg-100))] border-transparent shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/3.5%),0_0_0_0.5px_hsla(var(--border-300)/0.15)] hover:shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/3.5%),0_0_0_0.5px_hsla(var(--border-200)/0.3)] focus-within:shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/7.5%),0_0_0_0.5px_hsla(var(--border-200)/0.3)] hover:focus-within:shadow-[0_0.25rem_1.25rem_hsl(var(--always-black)/7.5%),0_0_0_0.5px_hsla(var(--border-200)/0.3)]">
        <!-- Collapse Button -->
        <button id="collapse-btn" class="absolute top-4 -right-10 z-50 rounded-r-lg p-2 transition-all fancy-button">
            <svg class="h-5 w-5 text-[hsl(var(--text-200))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>

        <!-- Mobile Toggle Button -->
        <button id="mobile-toggle" class="flex w-full items-center justify-between p-4 text-[hsl(var(--text-200))] md:hidden fancy-button">
            <span class="font-semibold">Steuerung</span>
            <svg class="h-5 w-5 transition-transform" id="mobile-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>

        <div id="controls-content" class="md:block">
            <!-- Tabs -->
            <div class="border-b border-[hsl(var(--text-500)/0.2)]">
                <ul class="flex flex-wrap text-center text-sm font-medium" role="tablist">
                    <li class="flex-1" role="presentation">
                        <button class="inline-block w-full rounded-t-lg transition-colors px-1 h-[3rem] text-base tracking-wider text-[hsl(var(--text-500))] border-b-2 border-[hsl(var(--text-100)/0)] hover:text-[hsl(var(--text-200))]" id="view-tab" type="button" role="tab">Ansicht</button>
                    </li>
                    <li class="flex-1" role="presentation">
                        <button class="inline-block w-full rounded-t-lg transition-colors px-1 h-[3rem] text-base tracking-wider text-[hsl(var(--text-500))] border-b-2 border-[hsl(var(--text-100)/0)] hover:text-[hsl(var(--text-200))]" id="search-tab" type="button" role="tab">Suche</button>
                    </li>
                    <li class="flex-1" role="presentation">
                        <button class="inline-block w-full rounded-t-lg transition-colors px-1 h-[3rem] text-base tracking-wider text-[hsl(var(--text-500))] border-b-2 border-[hsl(var(--text-100)/0)] hover:text-[hsl(var(--text-200))]" id="groups-tab" type="button" role="tab">Gruppen</button>
                    </li>
                </ul>
            </div>

            <div id="tab-content">
                <!-- View Tab -->
                <div class="tab-content hidden p-4" id="view-content" role="tabpanel">
                    <h3 class="mb-2 text-[hsl(var(--text-200))] flex items-center text-center min-w-0 font-serif text-2xl">Darstellung</h3>

                    <hr class="mb-2 mt-2 border-[hsl(var(--text-500)/0.2)]">




                    <div class="mb-2 mt-2">
                        <label class="mb-2 block text-sm font-medium text-[hsl(var(--text-000))]">Node Typ</label>
                        <select id="node-type" class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bright-container focus:ring-2 focus:ring-[hsl(var(--bg-200))]">
                             <option value="all">Alle anzeigen</option>
                             <option value="antrag">Nur Anträge</option>
                             <option value="supporter">Nur Supporter</option>
                         </select>
                    </div>





                    <div class="mb-4 space-y-2">
                        <div class="flex items-center">
                            <input id="show-labels" type="checkbox" checked class="h-4 w-4 rounded border-[hsl(var(--border-300)/0.3)] bg-[hsl(var(--bg-200))] text-[hsl(var(--accent-main-100))] focus:ring-2 focus:ring-[hsl(var(--accent-main-100)/0.3)]" />
                            <label for="show-labels" class="ml-2 text-sm font-medium text-[hsl(var(--text-200))]">Labels anzeigen</label>
                        </div>
                        <div class="flex items-center">
                            <input id="show-links" type="checkbox" class="h-4 w-4 rounded border-[hsl(var(--border-300)/0.3)] bg-[hsl(var(--bg-200))] text-[hsl(var(--accent-main-100))] focus:ring-2 focus:ring-[hsl(var(--accent-main-100)/0.3)]" />
                            <label for="show-links" class="ml-2 text-sm font-medium text-[hsl(var(--text-200))]">Verbindungen anzeigen</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="mb-2 block text-sm font-medium text-[hsl(var(--text-200))]">Node-Größe</label>
                        <input id="node-size" type="range" min="0.5" max="2" step="0.1" value="1" class="h-2 w-full cursor-pointer appearance-none rounded-lg bg-[hsl(var(--bg-200))] accent-[hsl(var(--accent-main-100))]" />
                    </div>

                    <button id="reset-view" class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">Ansicht zurücksetzen</button>

                </div>

                <!-- Search Tab -->
                <div class="tab-content hidden p-4" id="search-content" role="tabpanel">

                    <h3 class="mb-2 text-[hsl(var(--text-200))] flex items-center text-center min-w-0 font-serif text-2xl">Suche</h3>

                    <hr class="mb-2 mt-2 border-[hsl(var(--text-500)/0.2)]">


                    <div class="mb-4">
                        <label for="search" class="mb-2 block text-sm font-medium text-[hsl(var(--text-200))]">Node suchen</label>
                        <input type="text" id="search" class="block w-full rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bright-container focus:ring-2 focus:ring-[hsl(var(--bg-200))]" placeholder="Name oder KV eingeben..." />
                    </div>

                    <div id="search-results" class="space-y-1"></div>
                </div>

                <!-- Groups Tab -->
                <div class="tab-content hidden p-4" id="groups-content" role="tabpanel">
                    <h3 class="mb-2 text-[hsl(var(--text-200))] flex items-center text-center min-w-0 font-serif text-2xl">Gruppen</h3>

                    <hr class="mb-2 mt-2 border-[hsl(var(--text-500)/0.2)]">


                    <!-- Create Group -->
                    <div class="mb-4 rounded-lg p-3 bright-container">
                        <label class="mb-2 block text-sm font-medium text-[hsl(var(--text-200))]">Neue Gruppe erstellen</label>
                        <input type="text" id="group-name" placeholder="Gruppenname" class="mb-2 block w-full rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bright-container focus:ring-2 focus:ring-[hsl(var(--bg-200))]" />
                        <button id="select-color-btn" class="mb-2 w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">
                            <span id="selected-color-indicator" class="mr-2 inline-block h-4 w-4 rounded" style="background: #7f6df2;"></span>
                            Farbe wählen
                        </button>
                        <button id="create-group" class="mb-2 w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">Gruppe erstellen</button>
                    </div>
                    
                    <!-- Create Kreisverband Group -->
                    <div class="mb-4 rounded-lg p-3 bright-container">
                        <label class="mb-2 block text-sm font-medium text-[hsl(var(--text-200))]">Kreisverbandsgruppe erstellen</label>
                        <input type="text" id="kv-group-name" placeholder="Kreisverband (z.B. KV München)" class="mb-2 block w-full rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent bright-container focus:ring-2 focus:ring-[hsl(var(--bg-200))]" />
                        <button id="select-kv-color-btn" class="mb-2 w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">
                            <span id="selected-kv-color-indicator" class="mr-2 inline-block h-4 w-4 rounded" style="background: #7f6df2;"></span>
                            Farbe wählen
                        </button>
                        <button id="create-kv-group" class="w-full font-medium rounded-lg text-sm px-5 py-2.5 transition-all duration-300 border border-transparent fancy-button">Kreisverbandsgruppe erstellen</button>
                    </div>

                    <!-- Group List -->
                    <div class="mb-4">

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    class GraphVisualization {
        constructor() {
            this.canvas = document.getElementById('graph-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            
            this.canvas.width = this.width;
            this.canvas.height = this.height;

            this.selectedNode = null;
            this.hoveredNode = null;
            this.groups = [];
            this.nodeGroups = new Map();
            this.selectedColor = '#7f6df2';
            this.defaultFont = 'modern_dense';
            this.currentGroupForSearch = null;
            this.amendmentsUrlMap = new Map();
            this.currentTransform = d3.zoomIdentity;

            this.settings = {
                showLabels: true,
                showLinks: false,
                nodeType: 'all',
                nodeSize: 1
            };

            this.zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    this.currentTransform = event.transform;
                    this.render();
                });

            d3.select(this.canvas).call(this.zoom);

            this.canvas.addEventListener('click', (event) => {
                if (event.target === this.canvas) {
                    this.deselectAll();
                }
            });

            this.setupTabs();
            this.setupMobileToggle();
            this.setupColorModal();
            this.setupCollapsePanel();
            this.loadData();
            this.loadAmendmentsUrls();
        }
        
        loadAmendmentsUrls() {
            fetch('amendments_url.json')
                .then(response => response.json())
                .then(data => {
                    data.forEach(item => {
                        this.amendmentsUrlMap.set(item.title, item.url);
                    });
                })
                .catch(error => {
                    console.error('Fehler beim Laden der amendments_url.json:', error);
                });
        }

        setupCollapsePanel() {
            const panel = document.getElementById('controls-panel');
            const btn = document.getElementById('collapse-btn');

            btn.addEventListener('click', () => {
                panel.classList.toggle('panel-collapsed');
            });
        }

        setupColorModal() {
            const modal = FlowbiteInstances.getInstance('Modal', 'color-modal');
            const presets = document.querySelectorAll('.color-preset');
            const customInput = document.getElementById('custom-color-input');
            const confirmBtn = document.getElementById('confirm-color');
            const selectBtn = document.getElementById('select-color-btn');
            const selectKvBtn = document.getElementById('select-kv-color-btn');
            let isKvColorSelection = false;

            selectBtn.addEventListener('click', () => {
                isKvColorSelection = false;
                const modalEl = document.getElementById('color-modal');
                const modal = new Modal(modalEl);
                modal.show();
            });
            
            selectKvBtn.addEventListener('click', () => {
                isKvColorSelection = true;
                const modalEl = document.getElementById('color-modal');
                const modal = new Modal(modalEl);
                modal.show();
            });

            presets.forEach(preset => {
                preset.addEventListener('click', () => {
                    presets.forEach(p => p.classList.remove('selected'));
                    preset.classList.add('selected');
                    this.selectedColor = preset.dataset.color;
                    customInput.value = '';
                });
            });

            customInput.addEventListener('input', (e) => {
                const value = e.target.value;
                if (/^#[0-9A-F]{6}$/i.test(value)) {
                    this.selectedColor = value;
                    presets.forEach(p => p.classList.remove('selected'));
                }
            });

            confirmBtn.addEventListener('click', () => {
                if (isKvColorSelection) {
                    document.getElementById('selected-kv-color-indicator').style.background = this.selectedColor;
                } else {
                    document.getElementById('selected-color-indicator').style.background = this.selectedColor;
                }
                const modalEl = document.getElementById('color-modal');
                const modal = Modal.getInstance(modalEl);
                if (modal) modal.hide();
            });
        }

        setupTabs() {
            const tabs = ['view', 'search', 'groups'];
            tabs.forEach(tab => {
                document.getElementById(`${tab}-tab`).addEventListener('click', () => {
                    tabs.forEach(t => {
                        document.getElementById(`${t}-tab`).classList.remove('font-bold', 'text-[hsl(var(--text-000))]', 'border-b-2', 'border-[hsl(var(--text-100))]', 'hover:text-[hsl(var(--text-200))]');
                        document.getElementById(`${t}-tab`).classList.add('font-medium', 'text-[hsl(var(--text-500))]', 'border-b-2', 'border-[hsl(var(--text-100)/0)]', 'hover:text-[hsl(var(--text-200))]');
                        document.getElementById(`${t}-content`).classList.add('hidden');
                    });
                    document.getElementById(`${tab}-tab`).classList.remove('font-medium', 'text-[hsl(var(--text-500))]', 'border-b-2', 'border-[hsl(var(--text-100)/0)]', 'hover:text-[hsl(var(--text-200))]');
                    document.getElementById(`${tab}-tab`).classList.add('font-bold', 'text-[hsl(var(--text-000))]', 'border-b-2', 'border-[hsl(var(--text-100))]', 'hover:text-[hsl(var(--text-200))]');
                    document.getElementById(`${tab}-content`).classList.remove('hidden');
                });
            });
            document.getElementById('view-tab').click();
        }

        setupMobileToggle() {
            const toggle = document.getElementById('mobile-toggle');
            const content = document.getElementById('controls-content');
            const icon = document.getElementById('mobile-toggle-icon');

            if (toggle) {
                toggle.addEventListener('click', () => {
                    content.classList.toggle('hidden');
                    icon.classList.toggle('rotate-180');
                });
            }
        }

        getFontClass(fontName) {
            const fontMap = {
                'dyslexic': 'font-dyslexic',
                'modern_dense': 'font-modern-dense',
                'modern_wide': 'font-modern-wide',
                'serif': 'font-serif'
            };
            return fontMap[fontName] || fontMap[this.defaultFont];
        }

        deselectAll() {
            this.selectedNode = null;
            document.getElementById('selected-node').textContent = '-';
            
            // Entferne URL-Button
            const urlButton = document.getElementById('url-button');
            if (urlButton) {
                urlButton.remove();
            }
            
            this.render();
        }

        async loadData() {
            try {
                document.getElementById('loading-text').textContent = 'Lade data.json...';

                const response = await fetch('https://kxljxv.github.io/aea/graph_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();

                if (!data.support_map) {
                    throw new Error('Ungültiges Datenformat: support_map fehlt');
                }

                document.getElementById('loading-text').textContent = 'Verarbeite Daten...';
                this.data = data.support_map;
                this.metadata = data.metadata || {};

                this.processData();
                this.setupEventListeners();
                this.simulatePhysics();

            } catch (error) {
                console.error('Fehler beim Laden der Daten:', error);
                document.getElementById('loading').innerHTML = `
                      <div class="max-w-md mx-auto bg-red-900/20 border border-red-500 rounded-lg p-6">
                          <h2 class="text-2xl font-bold text-red-500 mb-4">❌ Fehler beim Laden</h2>
                          <p class="text-red-300 mb-4"><strong>${error.message}</strong></p>
                          <p class="text-gray-400 mb-2">Bitte stelle sicher, dass:</p>
                          <ul class="list-disc list-inside text-gray-400 space-y-1">
                              <li>Das Python-Skript ausgeführt wurde</li>
                              <li>Die Datei graph_data.json existiert</li>
                              <li>Ein lokaler Webserver läuft</li>
                          </ul>
                      </div>
                  `;
            }
        }

        processData() {
            const nodeMap = new Map();
            const links = [];

            Object.entries(this.data).forEach(([aea, aeaData]) => {
                // Erstelle Antrag-Node
                if (!nodeMap.has(aea)) {
                    const antragColor = getComputedStyle(document.documentElement).getPropertyValue('--node-antrag').trim();
                    nodeMap.set(aea, {
                        id: aea,
                        label: aea,
                        type: 'antrag',
                        color: antragColor || '#d86b74',
                        linkCount: 0,
                        font: this.defaultFont
                    });
                }

                // Handle both old format (array) and new format (object with initiator/supporters)
                let initiator = null;
                let supporters = [];
                
                if (Array.isArray(aeaData)) {
                    // Alte Struktur: Array von [name, kv] oder [name, kv, is_initiator]
                    aeaData.forEach(item => {
                        if (item.length > 2 && item[2]) {
                            // is_initiator flag
                            initiator = [item[0], item[1]];
                        } else {
                            supporters.push([item[0], item[1]]);
                        }
                    });
                } else if (aeaData && typeof aeaData === 'object') {
                    // Neue Struktur: {initiator: [name, kv] oder null, supporters: [[name, kv], ...]}
                    initiator = aeaData.initiator || null;
                    supporters = aeaData.supporters || [];
                }

                // Verbindung zu Initiator (Antragsteller) - 5x stärker gewichtet
                if (initiator && initiator[0] && initiator[1]) {
                    const [name, kv] = initiator;
                    const initiatorId = `${name} | ${kv}`;

                    if (!nodeMap.has(initiatorId)) {
                        const supporterColor = getComputedStyle(document.documentElement).getPropertyValue('--node-supporter').trim();
                        nodeMap.set(initiatorId, {
                            id: initiatorId,
                            label: name,
                            sublabel: kv,
                            type: 'supporter',
                            color: supporterColor || '#7dff00',
                            linkCount: 0,
                            font: this.defaultFont,
                            kv: kv
                        });
                    }

                    links.push({
                        source: aea,
                        target: initiatorId,
                        weight: 5,  // Antragsteller 5x stärker gewichtet
                        is_initiator: true
                    });

                    nodeMap.get(aea).linkCount += 5;
                    nodeMap.get(initiatorId).linkCount += 5;
                }

                // Verbindungen zu Supporters - normal gewichtet
                supporters.forEach(supporter => {
                    const name = supporter[0];
                    const kv = supporter[1];
                    if (!name || !kv) return;
                    
                    const supporterId = `${name} | ${kv}`;

                    if (!nodeMap.has(supporterId)) {
                        const supporterColor = getComputedStyle(document.documentElement).getPropertyValue('--node-supporter').trim();
                        nodeMap.set(supporterId, {
                            id: supporterId,
                            label: name,
                            sublabel: kv,
                            type: 'supporter',
                            color: supporterColor || '#7dff00',
                            linkCount: 0,
                            font: this.defaultFont,
                            kv: kv
                        });
                    }

                    links.push({
                        source: aea,
                        target: supporterId,
                        weight: 1,  // Supporter normal gewichtet
                        is_initiator: false
                    });

                    nodeMap.get(aea).linkCount += 1;
                    nodeMap.get(supporterId).linkCount += 1;
                });
            });

            this.nodes = Array.from(nodeMap.values());
            this.links = links;

            this.allNodes = [...this.nodes];
            this.allLinks = [...this.links];

            document.getElementById('node-count').textContent = this.nodes.length;
            document.getElementById('link-count').textContent = this.links.length;
        }

        simulatePhysics() {
            document.getElementById('loading-text').textContent = 'Simulation läuft...';

            const simulation = d3.forceSimulation(this.nodes)
                .force("link", d3.forceLink(this.links).id(d => d.id).distance(d => {
                    // Stärkere Verbindungen haben kürzere Distanz
                    return 100 / (d.weight || 1);
                }))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(this.width / 2, this.height / 2))
                .force("collision", d3.forceCollide().radius(30))
                .alphaDecay(0.02)
                .alphaMin(0.001);

            let iterations = 0;
            const maxIterations = 1000;

            simulation.on("tick", () => {
                iterations++;
                const progress = Math.min(100, (iterations / maxIterations) * 100);
                document.getElementById('loading-text').textContent = `Simulation läuft... ${Math.round(progress)}%`;
                this.render();
            });

            simulation.on("end", () => {
                document.getElementById('loading').style.display = 'none';
                this.render();
                this.centerGraph();
                this.setupCanvasEvents();
            });
        }
        
        setupCanvasEvents() {
            this.canvas.addEventListener('mousemove', (event) => {
                const rect = this.canvas.getBoundingClientRect();
                const x = (event.clientX - rect.left - this.currentTransform.x) / this.currentTransform.k;
                const y = (event.clientY - rect.top - this.currentTransform.y) / this.currentTransform.k;
                
                const node = this.getNodeAt(x, y);
                if (node !== this.hoveredNode) {
                    this.hoveredNode = node;
                    this.render();
                }
            });
            
            this.canvas.addEventListener('click', (event) => {
                const rect = this.canvas.getBoundingClientRect();
                const x = (event.clientX - rect.left - this.currentTransform.x) / this.currentTransform.k;
                const y = (event.clientY - rect.top - this.currentTransform.y) / this.currentTransform.k;
                
                const node = this.getNodeAt(x, y);
                if (node) {
                    this.onNodeClick(event, node);
                }
            });
            
            this.canvas.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                const rect = this.canvas.getBoundingClientRect();
                const x = (event.clientX - rect.left - this.currentTransform.x) / this.currentTransform.k;
                const y = (event.clientY - rect.top - this.currentTransform.y) / this.currentTransform.k;
                
                const node = this.getNodeAt(x, y);
                if (node) {
                    this.onNodeRightClick(event, node);
                }
            });
            
            this.canvas.addEventListener('mouseleave', () => {
                this.hoveredNode = null;
                this.render();
            });
        }
        
        getNodeAt(x, y) {
            for (const node of this.nodes) {
                const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                const dx = x - node.x;
                const dy = y - node.y;
                if (dx * dx + dy * dy <= radius * radius) {
                    return node;
                }
            }
            return null;
        }

        setupEventListeners() {
            window.addEventListener('resize', () => this.onResize());

            document.getElementById('search').addEventListener('input', (e) => this.onSearch(e));
            document.getElementById('node-type').addEventListener('change', (e) => this.onFilterChange(e));
            document.getElementById('show-labels').addEventListener('change', (e) => {
                this.settings.showLabels = e.target.checked;
                this.updateLabelVisibility();
            });
            document.getElementById('show-links').addEventListener('change', (e) => {
                this.settings.showLinks = e.target.checked;
                this.linkGroup.classed('hidden', !this.settings.showLinks);
            });
            document.getElementById('node-size').addEventListener('input', (e) => {
                this.settings.nodeSize = parseFloat(e.target.value);
                this.updateNodeSizes();
            });

            document.getElementById('reset-view').addEventListener('click', () => this.resetView());


            document.getElementById('create-group').addEventListener('click', () => this.createGroup());
            document.getElementById('create-kv-group').addEventListener('click', () => this.createKreisverbandGroup());
            document.getElementById('export-groups').addEventListener('click', () => this.exportGroups());
            document.getElementById('import-groups').addEventListener('change', (e) => this.importGroups(e));

            document.getElementById('group-node-search').addEventListener('input', (e) => this.onGroupSearch(e));
        }

        updateAllFonts() {
            this.render();
        }

        render() {
            const ctx = this.ctx;
            const transform = this.currentTransform;
            
            // Clear canvas
            ctx.clearRect(0, 0, this.width, this.height);
            
            // Apply transform
            ctx.save();
            ctx.translate(transform.x, transform.y);
            ctx.scale(transform.k, transform.k);
            
            // Draw links
            if (this.settings.showLinks) {
                this.links.forEach(link => {
                    let source = typeof link.source === 'object' ? link.source : this.nodes.find(n => n.id === link.source);
                    let target = typeof link.target === 'object' ? link.target : this.nodes.find(n => n.id === link.target);
                    
                    // Fallback: finde in allNodes falls nicht in gefilterten nodes
                    if (!source) {
                        source = this.allNodes.find(n => n.id === (typeof link.source === 'object' ? link.source.id : link.source));
                    }
                    if (!target) {
                        target = this.allNodes.find(n => n.id === (typeof link.target === 'object' ? link.target.id : link.target));
                    }
                    
                    if (!source || !target) return;
                    
                    const isDimmed = this.selectedNode && 
                        source.id !== this.selectedNode.id && 
                        target.id !== this.selectedNode.id;
                    
                    ctx.strokeStyle = isDimmed ? 'rgba(153, 153, 153, 0.1)' : 'rgba(153, 153, 153, 0.3)';
                    ctx.lineWidth = (link.weight || 1) * (isDimmed ? 0.5 : 1);
                    ctx.beginPath();
                    ctx.moveTo(source.x, source.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();
                });
            }
            
            // Draw nodes
            this.nodes.forEach(node => {
                const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                const isSelected = this.selectedNode && this.selectedNode.id === node.id;
                const isDimmed = this.selectedNode && 
                    this.selectedNode.id !== node.id && 
                    !this.isConnectedToSelected(node);
                
                ctx.save();
                
                // Draw node
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = isDimmed ? this.getNodeColor(node).replace(')', ', 0.2)').replace('rgb', 'rgba') : this.getNodeColor(node);
                ctx.fill();
                
                // Draw border
                if (isSelected || this.hoveredNode && this.hoveredNode.id === node.id) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = isSelected ? 2 : 1.5;
                    ctx.stroke();
                }
                
                ctx.restore();
            });
            
            // Draw labels
            if (this.settings.showLabels) {
                this.nodes.forEach(node => {
                    const shouldShow = !this.selectedNode || 
                        this.selectedNode.id === node.id || 
                        this.isConnectedToSelected(node) ||
                        (this.hoveredNode && this.hoveredNode.id === node.id);
                    
                    if (!shouldShow) return;
                    
                    const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                    const isDimmed = this.selectedNode && 
                        this.selectedNode.id !== node.id && 
                        !this.isConnectedToSelected(node);
                    
                    ctx.save();
                    ctx.fillStyle = isDimmed ? 'rgba(250, 249, 245, 0.2)' : 'rgba(250, 249, 245, 1)';
                    ctx.font = '12px ' + this.defaultFont;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(node.label, node.x + radius + 5, node.y);
                    
                    if (node.sublabel) {
                        ctx.font = '10px ' + this.defaultFont;
                        ctx.fillText(node.sublabel, node.x + radius + 5, node.y + 12);
                    }
                    ctx.restore();
                });
            }
            
            ctx.restore();
        }

        onNodeHover(event, d) {
            this.hoveredNode = d;
            this.render();
        }

        onNodeLeave() {
            this.hoveredNode = null;
            this.render();
        }

        getNodeColor(node) {
            const groupId = this.nodeGroups.get(node.id);
            if (groupId !== undefined) {
                const group = this.groups.find(g => g.id === groupId);
                if (group) return group.color;
            }
            // node.color ist bereits ein CSS-Wert oder Hex-Code
            if (node.color.startsWith('#')) {
                return node.color;
            }
            // Wenn es eine CSS-Variable ist, lese sie aus
            if (node.color.startsWith('--')) {
                const color = getComputedStyle(document.documentElement).getPropertyValue(node.color).trim();
                return color || '#ffffff';
            }
            return node.color || '#ffffff';
        }

        onNodeClick(event, d) {
            event.stopPropagation();

            if (this.selectedNode === d) {
                this.deselectAll();
            } else {
                const connectedNodeIds = new Set();
                this.links.forEach(link => {
                    const sourceId = typeof link.source === 'object' ? link.source.id : link.source;
                    const targetId = typeof link.target === 'object' ? link.target.id : link.target;
                    if (sourceId === d.id) {
                        connectedNodeIds.add(targetId);
                    } else if (targetId === d.id) {
                        connectedNodeIds.add(sourceId);
                    }
                });

                this.selectedNode = d;
                document.getElementById('selected-node').textContent = d.label;
                
                // Zeige URL-Button wenn es ein Antrag ist
                this.showUrlButton(d);

                this.render();
            }
        }
        
        showUrlButton(node) {
            // Entferne alten Button falls vorhanden
            const oldButton = document.getElementById('url-button');
            if (oldButton) {
                oldButton.remove();
            }
            
            // Nur für Anträge
            if (node.type === 'antrag') {
                const url = this.amendmentsUrlMap.get(node.id);
                if (url) {
                    const button = document.createElement('button');
                    button.id = 'url-button';
                    button.className = 'absolute top-20 left-5 z-40 rounded-lg p-3 font-medium transition-all fancy-button';
                    button.innerHTML = `
                        <svg class="h-5 w-5 text-[hsl(var(--text-200))] inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                        Antrag öffnen
                    `;
                    button.addEventListener('click', () => {
                        window.open(url, '_blank');
                    });
                    document.body.appendChild(button);
                }
            }
        }

        onNodeRightClick(event, d) {
            event.preventDefault();
            this.showNodeContextMenu(event, d);
        }

        showNodeContextMenu(event, node) {
            d3.select('#context-menu').remove();

            const menu = d3.select('body')
                .append('div')
                .attr('id', 'context-menu')
                .style('position', 'absolute')
                .style('left', event.pageX + 'px')
                .style('top', event.pageY + 'px')
                .style('background', 'rgba(30, 30, 30, 0.95)')
                .style('border', '1px solid #3a3a3a')
                .style('border-radius', '8px')
                .style('padding', '8px')
                .style('z-index', '1000')
                .style('min-width', '200px')
                .style('backdrop-filter', 'blur(10px)');

            menu.append('div')
                .style('padding', '8px')
                .style('font-size', '12px')
                .style('color', '#a0a0a0')
                .style('border-bottom', '1px solid #3a3a3a')
                .text(node.label);

            if (this.groups.length > 0) {
                this.groups.forEach(group => {
                    menu.append('div')
                        .style('padding', '8px')
                        .style('cursor', 'pointer')
                        .style('color', '#dcddde')
                        .style('font-size', '13px')
                        .style('border-radius', '4px')
                        .html(`<span style="display:inline-block;width:12px;height:12px;background:${group.color};border-radius:2px;margin-right:8px;"></span>${group.name}`)
                        .on('mouseover', function() {
                            d3.select(this).style('background', '#3a3a3a');
                        })
                        .on('mouseout', function() {
                            d3.select(this).style('background', 'transparent');
                        })
                        .on('click', () => {
                            this.addNodeToGroup(node.id, group.id);
                            menu.remove();
                        });
                });
            } else {
                menu.append('div')
                    .style('padding', '8px')
                    .style('color', '#666')
                    .style('font-size', '12px')
                    .style('text-align', 'center')
                    .text('Keine Gruppen vorhanden');
            }

            if (this.nodeGroups.has(node.id)) {
                menu.append('div')
                    .style('padding', '8px')
                    .style('cursor', 'pointer')
                    .style('color', '#ff6b6b')
                    .style('font-size', '13px')
                    .style('border-top', '1px solid #3a3a3a')
                    .style('margin-top', '4px')
                    .style('border-radius', '4px')
                    .text('Aus Gruppe entfernen')
                    .on('mouseover', function() {
                        d3.select(this).style('background', '#3a3a3a');
                    })
                    .on('mouseout', function() {
                        d3.select(this).style('background', 'transparent');
                    })
                    .on('click', () => {
                        this.removeNodeFromGroup(node.id);
                        menu.remove();
                    });
            }

            setTimeout(() => {
                d3.select('body').on('click.context-menu', () => {
                    menu.remove();
                    d3.select('body').on('click.context-menu', null);
                });
            }, 0);
        }

        addNodeToGroup(nodeId, groupId) {
            this.nodeGroups.set(nodeId, groupId);
            this.render();
            this.updateGroupList();
        }

        removeNodeFromGroup(nodeId) {
            this.nodeGroups.delete(nodeId);
            this.render();
            this.updateGroupList();
        }

        createGroup() {
            const name = document.getElementById('group-name').value.trim();
            const color = this.selectedColor;

            if (!name) {
                alert('Bitte einen Gruppennamen eingeben');
                return;
            }

            const group = {
                id: Date.now(),
                name: name,
                color: color,
                nodes: []
            };

            this.groups.push(group);
            this.updateGroupList();

            document.getElementById('group-name').value = '';
        }
        
        createKreisverbandGroup() {
            const kvName = document.getElementById('kv-group-name').value.trim();
            const color = this.selectedColor;

            if (!kvName) {
                alert('Bitte einen Kreisverband eingeben');
                return;
            }

            // Finde alle Supporter mit diesem Kreisverband
            const kvNodes = this.allNodes.filter(node => 
                node.type === 'supporter' && 
                node.kv && 
                node.kv.toLowerCase().includes(kvName.toLowerCase())
            );

            if (kvNodes.length === 0) {
                alert(`Keine Supporter mit Kreisverband "${kvName}" gefunden.`);
                return;
            }

            const group = {
                id: Date.now(),
                name: `KV ${kvName}`,
                color: color,
                nodes: []
            };

            this.groups.push(group);

            // Füge alle gefundenen Nodes zur Gruppe hinzu
            kvNodes.forEach(node => {
                this.nodeGroups.set(node.id, group.id);
            });

            this.render();
            this.updateGroupList();

            document.getElementById('kv-group-name').value = '';
            alert(`${kvNodes.length} Supporter aus "${kvName}" zur Gruppe hinzugefügt.`);
        }

        updateGroupList() {
            const listContainer = document.getElementById('group-list');

            if (this.groups.length === 0) {
                listContainer.innerHTML = '<p class="text-[hsl(var(--text-400))] text-sm text-center py-4">Keine Gruppen vorhanden</p>';
                return;
            }

            listContainer.innerHTML = this.groups.map(group => {
                const nodeCount = Array.from(this.nodeGroups.entries()).filter(([_, gId]) => gId === group.id).length;

                return `
                      <div class="group-item p-3 rounded-lg bright-container">
                          <div class="flex items-center justify-between mb-2">
                              <div class="flex items-center gap-2 flex-1">
                                  <div style="width: 16px; height: 16px; background: ${group.color}; border-radius: 4px;"></div>
                                  <span class="text-[hsl(var(--text-000))] font-medium text-sm">${group.name}</span>
                                  <span class="text-[hsl(var(--text-400))] text-xs">(${nodeCount})</span>
                              </div>
                              <div class="flex gap-2">
                                  <button onclick="graph.showGroupSearchModal(${group.id})" class="text-[hsl(var(--accent-secondary-100-full))] hover:text-[hsl(var(--accent-secondary-000-full))] text-xs fancy-button p-1 rounded" title="Nodes hinzufügen">
                                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                      </svg>
                                  </button>
                                  <button onclick="graph.deleteGroup(${group.id})" class="text-[hsl(var(--danger-100-full))] hover:text-[hsl(var(--danger-000-full))] text-xs fancy-button p-1 rounded" title="Gruppe löschen">
                                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                      </svg>
                                  </button>
                              </div>
                          </div>
                          <div class="text-xs text-[hsl(var(--text-400))]">Rechtsklick auf Nodes zum Hinzufügen</div>
                      </div>
                  `;
            }).join('');
        }

        showGroupSearchModal(groupId) {
            this.currentGroupForSearch = groupId;
            const modalEl = document.getElementById('group-search-modal');
            const modal = new Modal(modalEl);
            modal.show();

            document.getElementById('group-node-search').value = '';
            document.getElementById('group-search-results').innerHTML = '';
        }

        onGroupSearch(e) {
            const query = e.target.value.toLowerCase();
            const resultsDiv = document.getElementById('group-search-results');

            if (!query) {
                resultsDiv.innerHTML = '';
                return;
            }

            const matches = this.allNodes.filter(node =>
                node.label.toLowerCase().includes(query) ||
                (node.sublabel && node.sublabel.toLowerCase().includes(query))
            ).slice(0, 600);

            if (matches.length === 0) {
                resultsDiv.innerHTML = '<p class="text-[hsl(var(--text-400))] text-sm p-2">Keine Ergebnisse gefunden</p>';
                return;
            }

            resultsDiv.innerHTML = matches.map(node => {
                const inGroup = this.nodeGroups.get(node.id) === this.currentGroupForSearch;
                return `
                      <div class="p-2 rounded cursor-pointer text-sm mb-1 flex justify-between items-center bright-container" onclick="graph.toggleNodeInCurrentGroup('${node.id.replace(/'/g, "\\'")}')">
                          <div>
                              <span class="text-[hsl(var(--text-000))]">${node.label}</span>
                              ${node.sublabel ? `<span class="text-[hsl(var(--text-400))] text-xs ml-2">(${node.sublabel})</span>` : ''}
                          </div>
                          <span class="text-xs ${inGroup ? 'text-[hsl(var(--success-100-full))]' : 'text-[hsl(var(--text-400))]'}">${inGroup ? '✓' : '+'}</span>
                      </div>
                  `;
            }).join('');
        }

        toggleNodeInCurrentGroup(nodeId) {
            if (this.nodeGroups.get(nodeId) === this.currentGroupForSearch) {
                this.removeNodeFromGroup(nodeId);
            } else {
                this.addNodeToGroup(nodeId, this.currentGroupForSearch);
            }

            document.getElementById('group-node-search').dispatchEvent(new Event('input'));
        }

        deleteGroup(groupId) {
            this.groups = this.groups.filter(g => g.id !== groupId);

            const nodesToRemove = [];
            this.nodeGroups.forEach((gId, nodeId) => {
                if (gId === groupId) {
                    nodesToRemove.push(nodeId);
                }
            });
            nodesToRemove.forEach(nodeId => this.nodeGroups.delete(nodeId));

            this.render();
            this.updateGroupList();
        }

        exportGroups() {
            const exportData = {
                groups: this.groups,
                nodeGroups: Array.from(this.nodeGroups.entries()).map(([nodeId, groupId]) => ({
                    nodeId,
                    groupId
                }))
            };

            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `graph-groups-${new Date().toISOString().split('T')[0]}.json`;
            link.click();

            URL.revokeObjectURL(url);
        }

        importGroups(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);

                    if (data.groups && data.nodeGroups) {
                        this.groups = data.groups;
                        this.nodeGroups = new Map(data.nodeGroups.map(item => [item.nodeId, item.groupId]));

                        if (this.nodeElements) {
                            this.nodeElements.attr('fill', d => this.getNodeColor(d));
                        }
                        this.updateGroupList();

                        alert('Gruppen erfolgreich importiert!');
                    } else {
                        alert('Ungültiges Dateiformat');
                    }
                } catch (error) {
                    alert('Fehler beim Importieren: ' + error.message);
                }
            };
            reader.readAsText(file);

            event.target.value = '';
        }

        isConnectedToSelected(node) {
            if (!this.selectedNode) return false;
            return this.links.some(link => {
                const sourceId = typeof link.source === 'object' ? link.source.id : link.source;
                const targetId = typeof link.target === 'object' ? link.target.id : link.target;
                return (sourceId === this.selectedNode.id && targetId === node.id) ||
                       (targetId === this.selectedNode.id && sourceId === node.id);
            });
        }

        updateLabelVisibility() {
            // Labels werden jetzt in render() gehandhabt
            this.render();
        }

        updateNodeSizes() {
            this.render();
        }

        onResize() {
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            this.canvas.width = this.width;
            this.canvas.height = this.height;
            this.render();
        }

        onSearch(e) {
            const query = e.target.value.toLowerCase();
            const resultsDiv = document.getElementById('search-results');

            if (!query) {
                resultsDiv.innerHTML = '';
                return;
            }

            const matches = this.allNodes.filter(node =>
                node.label.toLowerCase().includes(query) ||
                (node.sublabel && node.sublabel.toLowerCase().includes(query))
            ).slice(0, 10);

            if (matches.length === 0) {
                resultsDiv.innerHTML = '<p class="text-[hsl(var(--text-400))] text-sm p-2">Keine Ergebnisse gefunden</p>';
                return;
            }

            resultsDiv.innerHTML = matches.map(node =>
                `<div class="p-2 rounded cursor-pointer text-sm mb-1 bright-container" onclick="graph.highlightNode('${node.id.replace(/'/g, "\\'")}')">
                      <span class="text-[hsl(var(--text-000))]">${node.label}</span>
                      ${node.sublabel ? `<span class="text-[hsl(var(--text-400))] text-xs ml-2">(${node.sublabel})</span>` : ''}
                  </div>`
            ).join('');
        }

        highlightNode(nodeId) {
            const node = this.allNodes.find(n => n.id === nodeId);
            if (node) {
                this.onNodeClick({ stopPropagation: () => {} }, node);
            }
        }

        onFilterChange(e) {
            this.settings.nodeType = e.target.value;

            if (this.settings.nodeType === 'all') {
                this.nodes = [...this.allNodes];
                this.links = [...this.allLinks];
            } else {
                this.nodes = this.allNodes.filter(n => n.type === this.settings.nodeType);
                const nodeIds = new Set(this.nodes.map(n => n.id));
                this.links = this.allLinks.filter(l => {
                    const sourceId = typeof l.source === 'object' ? l.source.id : l.source;
                    const targetId = typeof l.target === 'object' ? l.target.id : l.target;
                    return nodeIds.has(sourceId) && nodeIds.has(targetId);
                });
            }

            document.getElementById('node-count').textContent = this.nodes.length;
            document.getElementById('link-count').textContent = this.links.length;
            this.render();
        }

        resetView() {
            this.deselectAll();
            d3.select(this.canvas).transition()
                .duration(750)
                .call(this.zoom.transform, d3.zoomIdentity);
        }

        centerGraph() {
            if (this.nodes.length === 0) return;

            const centerX = this.nodes.reduce((sum, n) => sum + n.x, 0) / this.nodes.length;
            const centerY = this.nodes.reduce((sum, n) => sum + n.y, 0) / this.nodes.length;

            const transform = d3.zoomIdentity
                .translate(this.width / 2, this.height / 2)
                .translate(-centerX, -centerY);

            d3.select(this.canvas).transition()
                .duration(750)
                .call(this.zoom.transform, transform);
        }
    }

    let graph;
    document.addEventListener('DOMContentLoaded', () => {
        graph = new GraphVisualization();
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.js"></script>
