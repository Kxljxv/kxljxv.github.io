<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netzwerk Graph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
            background: #202020;
            color: #dcddde;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #graph-svg {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #graph-svg:active {
            cursor: grabbing;
        }

        .link {
            stroke: rgba(153, 153, 153, 0.3);
            stroke-width: 1;
        }

        .node {
            cursor: pointer;
            transition: stroke-width 0.15s;
        }

        .node:hover {
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        .node.selected {
            stroke: #ffffff;
            stroke-width: 2;
        }

        .label {
            fill: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            pointer-events: none;
            user-select: none;
        }

        .sublabel {
            fill: #a0a0a0;
            font-family: Arial, sans-serif;
            font-size: 10px;
            pointer-events: none;
            user-select: none;
        }

        /* Controls Panel */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 20px;
            min-width: 280px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        #controls h3 {
            margin-bottom: 15px;
            color: #7f6df2;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #a0a0a0;
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #dcddde;
            font-size: 13px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #7f6df2;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #7f6df2;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background: #6c5ce7;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
        }

        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            color: #a0a0a0;
            z-index: 100;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.98);
            padding: 40px 60px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #3a3a3a;
            z-index: 200;
        }

        #loading h2 {
            color: #7f6df2;
            margin-bottom: 15px;
        }

        .spinner {
            border: 3px solid #3a3a3a;
            border-top: 3px solid #7f6df2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
        }

        .search-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #3a3a3a;
            font-size: 12px;
        }

        .search-item:hover {
            background: #3a3a3a;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .error-message {
            background: rgba(224, 82, 82, 0.2);
            border: 1px solid #e05252;
            border-radius: 8px;
            padding: 20px;
            margin: 20px;
            color: #ff6b6b;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>

    <script>
        class GraphVisualization {
            constructor() {
                this.svg = d3.select('#graph-svg');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                
                this.svg.attr('width', this.width).attr('height', this.height);

                // Create main group for zoom/pan
                this.g = this.svg.append('g');
                
                // Create groups for links and nodes
                this.linkGroup = this.g.append('g').attr('class', 'links');
                this.nodeGroup = this.g.append('g').attr('class', 'nodes');
                this.labelGroup = this.g.append('g').attr('class', 'labels');

                this.selectedNode = null;

                this.settings = {
                    showLabels: true,
                    showLinks: true,
                    nodeType: 'all',
                    nodeSize: 1
                };

                // Setup zoom behavior
                this.zoom = d3.zoom()
                    .scaleExtent([0.1, 4])
                    .on('zoom', (event) => {
                        this.g.attr('transform', event.transform);
                        this.currentTransform = event.transform;
                    });

                this.svg.call(this.zoom);

                this.loadData();
            }

            async loadData() {
                try {
                    document.getElementById('loading-text').textContent = 'Lade graph_data.json...';
                    
                    const response = await fetch('graph_data.json');
                    if (!response.ok) {
                        throw new Error(`HTTP Error: ${response.status} - Stelle sicher, dass graph_data.json im selben Verzeichnis liegt`);
                    }
                    
                    const data = await response.json();
                    
                    if (!data.support_map) {
                        throw new Error('Ungültiges Datenformat: support_map fehlt');
                    }

                    document.getElementById('loading-text').textContent = 'Verarbeite Daten...';
                    this.data = data.support_map;
                    this.metadata = data.metadata || {};
                    
                    this.processData();
                    this.setupEventListeners();
                    this.simulatePhysics();
                    
                } catch (error) {
                    console.error('Fehler beim Laden der Daten:', error);
                    document.getElementById('loading').innerHTML = `
                        <div class="error-message">
                            <h2>❌ Fehler beim Laden</h2>
                            <p><strong>${error.message}</strong></p>
                            <p style="margin-top: 15px;">Bitte stelle sicher, dass:</p>
                            <ul style="text-align: left; margin-top: 10px;">
                                <li>Das Python-Skript ausgeführt wurde</li>
                                <li>Die Datei <code>graph_data.json</code> existiert</li>
                                <li>Die HTML-Datei im selben Verzeichnis liegt</li>
                                <li>Du einen lokalen Webserver verwendest (z.B. <code>python -m http.server</code>)</li>
                            </ul>
                        </div>
                    `;
                }
            }

            processData() {
                const nodeMap = new Map();
                const links = [];

                // Create nodes and links
                Object.entries(this.data).forEach(([aea, supporters]) => {
                    // Add AEA node
                    if (!nodeMap.has(aea)) {
                        nodeMap.set(aea, {
                            id: aea,
                            label: aea,
                            type: 'antrag',
                            color: '#e05252',
                            linkCount: 0
                        });
                    }

                    supporters.forEach(supporter => {
                        const supporterId = `${supporter[0]} | ${supporter[1]}`;
                        
                        // Add supporter node
                        if (!nodeMap.has(supporterId)) {
                            nodeMap.set(supporterId, {
                                id: supporterId,
                                label: supporter[0],
                                sublabel: supporter[1],
                                type: 'supporter',
                                color: '#52e069',
                                linkCount: 0
                            });
                        }

                        // Add link
                        links.push({
                            source: aea,
                            target: supporterId
                        });

                        nodeMap.get(aea).linkCount++;
                        nodeMap.get(supporterId).linkCount++;
                    });
                });

                this.nodes = Array.from(nodeMap.values());
                this.links = links;

                this.allNodes = [...this.nodes];
                this.allLinks = [...this.links];

                // Update stats
                document.getElementById('node-count').textContent = this.nodes.length;
                document.getElementById('link-count').textContent = this.links.length;
            }

            simulatePhysics() {
                document.getElementById('loading-text').textContent = 'Simulation läuft...';
                
                const simulation = d3.forceSimulation(this.nodes)
                    .force("link", d3.forceLink(this.links).id(d => d.id).distance(100))
                    .force("charge", d3.forceManyBody().strength(-300))
                    .force("center", d3.forceCenter(this.width / 2, this.height / 2))
                    .force("collision", d3.forceCollide().radius(30))
                    .alphaDecay(0.02)
                    .alphaMin(0.001);

                let iterations = 0;
                const maxIterations = 300;

                simulation.on("tick", () => {
                    iterations++;
                    const progress = Math.min(100, (iterations / maxIterations) * 100);
                    document.getElementById('loading-text').textContent = 
                        `Simulation läuft... ${Math.round(progress)}%`;
                });

                simulation.on("end", () => {
                    document.getElementById('loading').style.display = 'none';
                    this.render();
                    this.centerGraph();
                });
            }

            setupEventListeners() {
                // Window resize
                window.addEventListener('resize', () => this.onResize());

                // Controls
                document.getElementById('search').addEventListener('input', (e) => this.onSearch(e));
                document.getElementById('node-type').addEventListener('change', (e) => this.onFilterChange(e));
                document.getElementById('show-labels').addEventListener('change', (e) => {
                    this.settings.showLabels = e.target.checked;
                    this.updateLabelVisibility();
                });
                document.getElementById('show-links').addEventListener('change', (e) => {
                    this.settings.showLinks = e.target.checked;
                    this.linkGroup.style('display', this.settings.showLinks ? 'block' : 'none');
                });
                document.getElementById('node-size').addEventListener('input', (e) => {
                    this.settings.nodeSize = parseFloat(e.target.value);
                    this.updateNodeSizes();
                });
                document.getElementById('reset-view').addEventListener('click', () => this.resetView());
                document.getElementById('center-graph').addEventListener('click', () => this.centerGraph());
            }

            render() {
                // Render links
                const link = this.linkGroup.selectAll('line')
                    .data(this.links)
                    .join('line')
                    .attr('class', 'link')
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                if (!this.settings.showLinks) {
                    this.linkGroup.style('display', 'none');
                }

                // Render nodes
                const node = this.nodeGroup.selectAll('circle')
                    .data(this.nodes)
                    .join('circle')
                    .attr('class', 'node')
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y)
                    .attr('r', d => (5 + Math.sqrt(d.linkCount) * 2) * this.settings.nodeSize)
                    .attr('fill', d => d.color)
                    .on('click', (event, d) => this.onNodeClick(event, d));

                // Render labels
                const labelContainer = this.labelGroup.selectAll('g')
                    .data(this.nodes)
                    .join('g')
                    .attr('transform', d => `translate(${d.x}, ${d.y})`);

                labelContainer.each(function(d) {
                    const g = d3.select(this);
                    g.selectAll('*').remove();

                    const radius = (5 + Math.sqrt(d.linkCount) * 2);
                    
                    g.append('text')
                        .attr('class', 'label')
                        .attr('x', radius + 5)
                        .attr('y', 0)
                        .attr('dy', '0.35em')
                        .text(d.label);

                    if (d.sublabel) {
                        g.append('text')
                            .attr('class', 'sublabel')
                            .attr('x', radius + 5)
                            .attr('y', 12)
                            .text(d.sublabel);
                    }
                });

                this.updateLabelVisibility();

                // Store references
                this.nodeElements = node;
                this.labelElements = labelContainer;
            }

            onNodeClick(event, d) {
                event.stopPropagation();
                
                // Remove previous selection
                this.nodeElements.classed('selected', false);
                
                if (this.selectedNode === d) {
                    // Deselect
                    this.selectedNode = null;
                    document.getElementById('selected-node').textContent = '-';
                    this.updateLabelVisibility();
                } else {
                    // Select new node
                    this.selectedNode = d;
                    document.getElementById('selected-node').textContent = d.label;
                    
                    // Highlight selected node
                    this.nodeElements.filter(node => node === d).classed('selected', true);
                    
                    // Update label visibility
                    this.updateLabelVisibility();
                }
            }

            updateLabelVisibility() {
                if (!this.labelElements) return;

                this.labelElements.style('display', d => {
                    if (this.settings.showLabels) {

                                <li>Du einen lokalen Webserver verwendest (z.B. <code>python -m http.server</code>)</li>
                            </ul>
                        </div>
                    `;
                }
            }

            processData() {
                const nodeMap = new Map();
                const links = [];

                // Create nodes and links
                Object.entries(this.data).forEach(([aea, supporters]) => {
                    // Add AEA node
                    if (!nodeMap.has(aea)) {
                        nodeMap.set(aea, {
                            id: aea,
                            label: aea,
                            type: 'antrag',
                            color: '#e05252',
                            linkCount: 0,
                            x: Math.random() * this.width,
                            y: Math.random() * this.height,
                            vx: 0,
                            vy: 0
                        });
                    }

                    supporters.forEach(supporter => {
                        const supporterId = `${supporter[0]} | ${supporter[1]}`;
                        
                        // Add supporter node
                        if (!nodeMap.has(supporterId)) {
                            nodeMap.set(supporterId, {
                                id: supporterId,
                                label: supporter[0],
                                sublabel: supporter[1],
                                type: 'supporter',
                                color: '#52e069',
                                linkCount: 0,
                                x: Math.random() * this.width,
                                y: Math.random() * this.height,
                                vx: 0,
                                vy: 0
                            });
                        }

                        // Add link
                        links.push({
                            source: aea,
                            target: supporterId
                        });

                        nodeMap.get(aea).linkCount++;
                        nodeMap.get(supporterId).linkCount++;
                    });
                });

                this.nodes = Array.from(nodeMap.values());
                this.links = links.map(link => ({
                    source: nodeMap.get(link.source),
                    target: nodeMap.get(link.target)
                }));

                this.allNodes = [...this.nodes];
                this.allLinks = [...this.links];

                // Update stats
                document.getElementById('node-count').textContent = this.nodes.length;
                document.getElementById('link-count').textContent = this.links.length;
            }

            simulatePhysics() {
                document.getElementById('loading-text').textContent = 'Simulation läuft...';
                
                const simulation = d3.forceSimulation(this.nodes)
                    .force("link", d3.forceLink(this.links).id(d => d.id).distance(100))
                    .force("charge", d3.forceManyBody().strength(-300))
                    .force("center", d3.forceCenter(this.width / 2, this.height / 2))
                    .force("collision", d3.forceCollide().radius(30))
                    .alphaDecay(0.02)
                    .alphaMin(0.001);

                let iterations = 0;
                const maxIterations = 300;

                simulation.on("tick", () => {
                    iterations++;
                    const progress = Math.min(100, (iterations / maxIterations) * 100);
                    document.getElementById('loading-text').textContent = 
                        `Simulation läuft... ${Math.round(progress)}%`;
                });

                simulation.on("end", () => {
                    document.getElementById('loading').style.display = 'none';
                    this.centerGraph();
                    this.render();
                });
            }

            setupEventListeners() {
                // Mouse events
                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.onMouseUp());
                this.canvas.addEventListener('wheel', (e) => this.onWheel(e));

                // Window resize
                window.addEventListener('resize', () => this.onResize());

                // Controls
                document.getElementById('search').addEventListener('input', (e) => this.onSearch(e));
                document.getElementById('node-type').addEventListener('change', (e) => this.onFilterChange(e));
                document.getElementById('show-labels').addEventListener('change', (e) => {
                    this.settings.showLabels = e.target.checked;
                    this.render();
                });
                document.getElementById('show-links').addEventListener('change', (e) => {
                    this.settings.showLinks = e.target.checked;
                    this.render();
                });
                document.getElementById('zoom-level').addEventListener('input', (e) => {
                    this.transform.k = parseFloat(e.target.value);
                    document.getElementById('zoom-value').textContent = this.transform.k.toFixed(1);
                    this.render();
                });
                document.getElementById('node-size').addEventListener('input', (e) => {
                    this.settings.nodeSize = parseFloat(e.target.value);
                    this.render();
                });
                document.getElementById('reset-view').addEventListener('click', () => this.resetView());
                document.getElementById('center-graph').addEventListener('click', () => this.centerGraph());
            }

            onMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const clicked = this.getNodeAt(x, y);
                if (clicked) {
                    this.selectedNode = clicked;
                    document.getElementById('selected-node').textContent = clicked.label;
                } else {
                    this.isDragging = true;
                    this.lastMouse = { x: e.clientX, y: e.clientY };
                }
            }

            onMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                this.hoveredNode = this.getNodeAt(x, y);

                if (this.isDragging) {
                    const dx = e.clientX - this.lastMouse.x;
                    const dy = e.clientY - this.lastMouse.y;
                    this.transform.x += dx;
                    this.transform.y += dy;
                    this.lastMouse = { x: e.clientX, y: e.clientY };
                    this.render();
                }

                this.canvas.style.cursor = this.hoveredNode ? 'pointer' : 'grab';
            }

            onMouseUp() {
                this.isDragging = false;
            }

            onWheel(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                this.transform.k = Math.max(0.1, Math.min(3, this.transform.k * delta));
                document.getElementById('zoom-level').value = this.transform.k;
                document.getElementById('zoom-value').textContent = this.transform.k.toFixed(1);
                this.render();
            }

            onResize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.render();
            }

            onSearch(e) {
                const query = e.target.value.toLowerCase();
                const resultsDiv = document.getElementById('search-results');
                
                if (!query) {
                    resultsDiv.innerHTML = '';
                    return;
                }

                const matches = this.allNodes.filter(node => 
                    node.label.toLowerCase().includes(query) ||
                    (node.sublabel && node.sublabel.toLowerCase().includes(query))
                ).slice(0, 10);

                resultsDiv.innerHTML = matches.map(node => 
                    `<div class="search-item" data-id="${node.id}">
                        ${node.label}${node.sublabel ? ` <span style="color: #a0a0a0">(${node.sublabel})</span>` : ''}
                    </div>`
                ).join('');

                resultsDiv.querySelectorAll('.search-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const node = this.allNodes.find(n => n.id === item.dataset.id);
                        this.focusOnNode(node);
                        resultsDiv.innerHTML = '';
                        document.getElementById('search').value = '';
                    });
                });
            }

            onFilterChange(e) {
                this.settings.nodeType = e.target.value;
                
                if (this.settings.nodeType === 'all') {
                    this.nodes = [...this.allNodes];
                    this.links = [...this.allLinks];
                } else {
                    this.nodes = this.allNodes.filter(n => n.type === this.settings.nodeType);
                    const nodeIds = new Set(this.nodes.map(n => n.id));
                    this.links = this.allLinks.filter(l => 
                        nodeIds.has(l.source.id) && nodeIds.has(l.target.id)
                    );
                }

                document.getElementById('node-count').textContent = this.nodes.length;
                document.getElementById('link-count').textContent = this.links.length;
                this.render();
            }

            getNodeAt(x, y) {
                const worldX = (x - this.transform.x) / this.transform.k;
                const worldY = (y - this.transform.y) / this.transform.k;

                for (let i = this.nodes.length - 1; i >= 0; i--) {
                    const node = this.nodes[i];
                    const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                    const dx = node.x - worldX;
                    const dy = node.y - worldY;
                    if (dx * dx + dy * dy <= radius * radius) {
                        return node;
                    }
                }
                return null;
            }

            focusOnNode(node) {
                this.selectedNode = node;
                document.getElementById('selected-node').textContent = node.label;
                
                // Center on node
                this.transform.x = this.width / 2 - node.x * this.transform.k;
                this.transform.y = this.height / 2 - node.y * this.transform.k;
                this.render();
            }

            resetView() {
                this.transform = { x: 0, y: 0, k: 1 };
                document.getElementById('zoom-level').value = 1;
                document.getElementById('zoom-value').textContent = '1.0';
                this.centerGraph();
            }

            centerGraph() {
                if (this.nodes.length === 0) return;

                const centerX = this.nodes.reduce((sum, n) => sum + n.x, 0) / this.nodes.length;
                const centerY = this.nodes.reduce((sum, n) => sum + n.y, 0) / this.nodes.length;

                this.transform.x = this.width / 2 - centerX * this.transform.k;
                this.transform.y = this.height / 2 - centerY * this.transform.k;
                this.render();
            }

            render() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.width, this.height);

                ctx.save();
                ctx.translate(this.transform.x, this.transform.y);
                ctx.scale(this.transform.k, this.transform.k);

                // Draw links
                if (this.settings.showLinks) {
                    ctx.strokeStyle = 'rgba(153, 153, 153, 0.3)';
                    ctx.lineWidth = 1 / this.transform.k;
                    this.links.forEach(link => {
                        ctx.beginPath();
                        ctx.moveTo(link.source.x, link.source.y);
                        ctx.lineTo(link.target.x, link.target.y);
                        ctx.stroke();
                    });
                }

                // Draw nodes
                this.nodes.forEach(node => {
                    const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                    
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);
                    
                    if (node === this.selectedNode) {
                        ctx.fillStyle = '#7f6df2';
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2 / this.transform.k;
                        ctx.stroke();
                    } else if (node === this.hoveredNode) {
                        ctx.fillStyle = node.color;
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5 / this.transform.k;
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = node.color;
                    }
                    
                    ctx.fill();
                });

                // Draw labels
                if (this.settings.showLabels) {
                    ctx.font = `${12 / this.transform.k}px Arial`;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';

                    this.nodes.forEach(node => {
                        const radius = (5 + Math.sqrt(node.linkCount) * 2) * this.settings.nodeSize;
                        
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(node.label, node.x + radius + 5 / this.transform.k, node.y);
                        
                        if (node.sublabel && this.transform.k > 0.5) {
                            ctx.fillStyle = '#a0a0a0';
                            ctx.font = `${10 / this.transform.k}px Arial`;
                            ctx.fillText(node.sublabel, node.x + radius + 5 / this.transform.k, node.y + 12 / this.transform.k);
                            ctx.font = `${12 / this.transform.k}px Arial`;
                        }
                    });
                }

                ctx.restore();
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            const graph = new GraphVisualization();
        });
    </script>
