<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>Wahlergebnisse Pankow – Interaktive Karte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-main: #0f1115;
      --bg-card: #181b22;
      --border-color: #2a2e39;
      --accent: #f97316;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    
    /* White / Light Mode Theme Variables */
    body.light-theme {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --accent: #f97316;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* MapLibre Controls Customization */
    .maplibregl-ctrl-group {
      background: var(--bg-card) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 0.75rem !important;
      backdrop-filter: blur(8px);
      overflow: hidden;
    }
    .maplibregl-ctrl-group button {
      border-bottom: 1px solid var(--border-color) !important;
    }
    .maplibregl-ctrl-group button:last-child {
      border-bottom: none !important;
    }
    body:not(.light-theme) .maplibregl-ctrl-icon {
      filter: invert(100%) hue-rotate(180deg);
    }

    /* Bottom Sheet Animation */
    #bottomSheet {
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #bottomSheet.open {
      transform: translateY(0);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="h-full overflow-hidden flex flex-col">

  <!-- Mobile Header / Top Bar (mit Standort- & Stil-Toggle integriert) -->
  <header class="absolute top-0 left-0 right-0 z-20 p-3 pointer-events-none flex flex-col gap-2">
    <div class="bg-[var(--bg-card)]/90 backdrop-blur-md border border-[var(--border-color)] rounded-2xl p-3 shadow-xl pointer-events-auto flex items-center justify-between transition-colors duration-300">
      <div>
        <h1 class="text-sm font-bold tracking-tight text-[var(--text-main)]">Wahlergebnisse Pankow</h1>
        <p id="subHeaderStatus" class="text-xs text-amber-500 font-medium">AGH Erststimme &middot; Vergleich</p>
      </div>
      <div class="flex items-center gap-1.5">
        <!-- Kartenstil / Theme Toggle Button (neu) -->
        <button id="btnThemeToggle" class="bg-[var(--bg-main)] hover:opacity-80 text-[var(--text-main)] p-2 rounded-xl border border-[var(--border-color)] transition flex items-center justify-center shadow-sm w-9 h-9" title="Kartenstil & Modus wechseln">
          <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.357l-4 4m0 0l4 4m-4-4h18"/></svg>
        </button>
        <!-- Menü Button -->
        <button id="btnOpenMenu" class="bg-[var(--bg-main)] hover:opacity-80 text-[var(--text-main)] p-2 rounded-xl border border-[var(--border-color)] transition flex items-center justify-center shadow-sm w-9 h-9" aria-label="Menü öffnen">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Map Container -->
  <main class="relative w-full h-full flex-1">
    <div id="map" class="w-full h-full"></div>

    <!-- Floating Legend (Unten Links) -->
    <div id="legend" class="absolute bottom-4 left-4 z-10 bg-[var(--bg-card)]/90 backdrop-blur-md border border-[var(--border-color)] rounded-2xl p-3 text-xs shadow-xl max-w-[200px] transition-colors duration-300">
      <!-- Dynamisch gefüllt -->
    </div>

    <!-- Map Tooltip -->
    <div id="tooltip" class="absolute hidden z-30 bg-[var(--bg-card)]/95 backdrop-blur-md border border-[var(--border-color)] rounded-xl p-2.5 text-xs shadow-2xl pointer-events-none transition-colors duration-300"></div>
  </main>

  <!-- Off-Canvas / Modal Menu (Einstellungen & Filter) -->
  <div id="menuOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>
  <div id="menuDrawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-[var(--bg-card)] border-l border-[var(--border-color)] z-50 shadow-2xl flex flex-col translate-x-full transition-transform duration-300">
    <div class="p-4 border-b border-[var(--border-color)] flex items-center justify-between">
      <h2 class="font-bold text-base text-[var(--text-main)]">Karteneinstellungen</h2>
      <button id="btnCloseMenu" class="text-[var(--text-muted)] hover:text-[var(--text-main)] p-2 rounded-lg bg-[var(--bg-main)]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-5 flex-1 overflow-y-auto space-y-6">
      <!-- Kartenstil / Hintergrundkarte Auswahl (neu) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">Hintergrundstil</label>
        <div class="grid grid-cols-3 gap-2" id="mapStyleGroup">
          <button data-style-idx="0" class="map-style-btn bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-center text-xs font-medium text-[var(--text-main)] hover:border-orange-500 transition">Dark Matter</button>
          <button data-style-idx="1" class="map-style-btn bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-center text-xs font-medium text-[var(--text-main)] hover:border-orange-500 transition">Positron (White)</button>
          <button data-style-idx="2" class="map-style-btn bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-center text-xs font-medium text-[var(--text-main)] hover:border-orange-500 transition">Voyager</button>
        </div>
      </div>

      <!-- Wahlart -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">Wahlart</label>
        <select id="electionSelect" class="w-full bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-3 text-sm text-[var(--text-main)] focus:outline-none focus:border-orange-500">
          <option value="AGH_Erststimme">AGH-Wahl (Erststimme)</option>
          <option value="AGH_Zweitstimme">AGH-Wahl (Zweitstimme)</option>
          <option value="BVV">BVV-Wahl</option>
        </select>
      </div>

      <!-- Jahresmodus -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">Jahresmodus</label>
        <div class="grid grid-cols-3 gap-2" id="yearRadioGroup">
          <label class="cursor-pointer bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-center text-xs font-medium text-[var(--text-muted)] hover:border-gray-500 transition has-[:checked]:bg-orange-500/20 has-[:checked]:border-orange-500 has-[:checked]:text-orange-500">
            <input type="radio" name="yearMode" value="2021" class="hidden"> 2021
          </label>
          <label class="cursor-pointer bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-center text-xs font-medium text-[var(--text-muted)] hover:border-gray-500 transition has-[:checked]:bg-orange-500/20 has-[:checked]:border-orange-500 has-[:checked]:text-orange-500">
            <input type="radio" name="yearMode" value="2023" class="hidden"> 2023
          </label>
          <label class="cursor-pointer bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-center text-xs font-medium text-[var(--text-muted)] hover:border-gray-500 transition has-[:checked]:bg-orange-500/20 has-[:checked]:border-orange-500 has-[:checked]:text-orange-500">
            <input type="radio" name="yearMode" value="compare" checked class="hidden"> Vergleich
          </label>
        </div>
      </div>

      <!-- Partei / Ansicht -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">Fokus / Partei</label>
        <div id="partyRadioGroup" class="grid grid-cols-2 gap-2">
          <!-- Dynamisch gefüllt -->
        </div>
      </div>

      <!-- Suche -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">Wahlbezirk suchen</label>
        <input type="text" id="searchField" placeholder="z. B. UWB-Code oder Name..." class="w-full bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-3 text-sm text-[var(--text-main)] placeholder-[var(--text-muted)] focus:outline-none focus:border-orange-500">
      </div>

      <!-- Zusätzliche GeoJSON-Ebenen -->
      <div id="customLayersSection">
        <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">Zusätzliche Ebenen</label>
        <div id="customLayerToggles" class="space-y-2">
          <p class="text-xs text-[var(--text-muted)]">Lade Ebenen...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Sheet (Ergebnisse & Details per Tap auf Bezirk) -->
  <div id="bottomSheet" class="fixed inset-x-0 bottom-0 z-30 bg-[var(--bg-card)] border-t border-[var(--border-color)] rounded-t-3xl shadow-2xl max-h-[85vh] flex flex-col transition-colors duration-300">
    <div id="bottomSheetHandle" class="p-4 pb-2 cursor-pointer flex items-center justify-between border-b border-[var(--border-color)]">
      <div class="w-10 h-1.5 bg-gray-400 rounded-full mx-auto absolute left-1/2 -translate-x-1/2 top-2"></div>
      <div class="pt-2">
        <span class="text-xs font-semibold text-orange-500 uppercase tracking-wider">Wahlbezirk-Details</span>
        <h3 id="sheetTitle" class="text-base font-bold text-[var(--text-main)]">Bitte wählen Sie einen Bezirk aus</h3>
      </div>
      <button id="btnCloseSheet" class="text-[var(--text-muted)] hover:text-[var(--text-main)] p-2 rounded-xl bg-[var(--bg-main)] text-xs">Schließen</button>
    </div>

    <div class="p-4 overflow-y-auto space-y-5 flex-1">
      <div class="bg-[var(--bg-main)] border border-[var(--border-color)] rounded-2xl p-3 relative h-56">
        <canvas id="resultChart"></canvas>
      </div>
      <div id="infoContent" class="space-y-2">
        <p class="text-xs text-[var(--text-muted)] text-center py-4">Tippen Sie auf einen Wahlbezirk in der Karte, um detaillierte Ergebnisse und den Vergleich anzuzeigen.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script>
    const ELECTIONS = {
      AGH_Erststimme: { label: 'AGH-Wahl (Erststimme)', yearPrefixes: { 2021: '2021_AGH_Erststimme', 2023: '2023_AGH_Erststimme' } },
      AGH_Zweitstimme: { label: 'AGH-Wahl (Zweitstimme)', yearPrefixes: { 2021: '2021_AGH_Zweitstimme', 2023: '2023_AGH_Zweitstimme' } },
      BVV: { label: 'BVV-Wahl', yearPrefixes: { 2021: '2021_BVV', 2023: '2023_BVV' } }
    };

    const PARTIES = [
      { key: 'SPD', name: 'SPD', color: '#ef4444' },
      { key: 'CDU', name: 'CDU', color: '#3b82f6' },
      { key: 'GRÜNE', name: 'Grüne', color: '#22c55e' },
      { key: 'DIE LINKE', name: 'Die Linke', color: '#db2777' },
      { key: 'AfD', name: 'AfD', color: '#6366f1' },
      { key: 'FDP', name: 'FDP', color: '#eab308' }
    ];

    // Verschiedene Hintergrundkartenstile (Dark Matter, Light/Positron, Voyager)[cite: 2]
    const MAP_STYLES = [
      { name: 'Dark', url: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', isLight: false },
      { name: 'White / Light', url: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json', isLight: true },
      { name: 'Voyager', url: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json', isLight: true }
    ];

    const state = {
      election: 'AGH_Erststimme',
      yearMode: 'compare',
      party: 'Gewinner',
      geojsonData: null,
      map: null,
      chart: null,
      selectedFeature: null,
      layerAdded: false,
      marker: null,
      currentStyleIndex: 0,
      customLayers: [],
      customLayersData: {}
    };

    function getPropKey(year, election, party, suffix) {
      const prefix = ELECTIONS[election].yearPrefixes[year];
      return prefix + '_' + party + '_' + suffix;
    }

    function getPartyColor(key) {
      const p = PARTIES.find(p => p.key === key);
      return p ? p.color : '#6b7280';
    }

    function getPartyName(key) {
      const p = PARTIES.find(p => p.key === key);
      return p ? p.name : key;
    }

    function getWinningParty(feature, year) {
      let maxVal = -1;
      let winner = 'SPD';
      PARTIES.forEach(p => {
        let val = parseFloat(feature.properties[getPropKey(year, state.election, p.key, 'anteil')]);
        if (!isNaN(val) && val > maxVal) {
          maxVal = val;
          winner = p.key;
        }
      });
      return winner;
    }

    function interpolateColor(c1, c2, factor) {
      const hexToRgb = hex => {
        hex = hex.replace(/^#/, '');
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        let bigint = parseInt(hex, 16);
        return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
      };
      let rgb1 = hexToRgb(c1), rgb2 = hexToRgb(c2);
      let r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * factor);
      let g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * factor);
      let b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * factor);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function getFillColor(feature) {
      let props = feature.properties;
      let party = state.party;
      let election = state.election;
      let yearMode = state.yearMode;
      let isLight = document.body.classList.contains('light-theme');
      let neutralColor = isLight ? '#cbd5e1' : '#374151';

      if (party === 'Gewinner') {
        let targetYear = yearMode === '2021' ? 2021 : 2023;
        let winner = getWinningParty(feature, targetYear);
        return getPartyColor(winner);
      }

      if (yearMode === 'compare') {
        let v21 = parseFloat(props[getPropKey(2021, election, party, 'anteil')]);
        let v23 = parseFloat(props[getPropKey(2023, election, party, 'anteil')]);
        if (isNaN(v21) || isNaN(v23)) return neutralColor;
        let diff = v23 - v21;
        let maxDiff = 0.15;
        let norm = Math.min(Math.abs(diff) / maxDiff, 1);
        if (diff > 0.001) {
          return interpolateColor(neutralColor, getPartyColor(party), norm * 0.9);
        } else if (diff < -0.001) {
          return interpolateColor(neutralColor, '#ef4444', norm * 0.9);
        } else {
          return neutralColor;
        }
      } else {
        let year = parseInt(yearMode);
        let val = parseFloat(props[getPropKey(year, election, party, 'anteil')]);
        if (isNaN(val)) return neutralColor;
        let norm = Math.min(val / 0.5, 1);
        return interpolateColor(neutralColor, getPartyColor(party), norm);
      }
    }

    function loadCustomGeoJsonLayers() {
      fetch('geojsons/manifest.json')
        .then(res => res.json())
        .then(manifest => {
          state.customLayers = manifest;
          const promises = manifest.map(entry => {
            return fetch(`geojsons/${entry.file}`)
              .then(res => res.json())
              .then(geojson => {
                state.customLayersData[entry.id] = geojson;
                addCustomGeoJsonLayer(entry.id, entry.name, geojson, entry.visible);
              })
              .catch(err => console.error(`Fehler beim Laden von ${entry.file}:`, err));
          });
          Promise.all(promises).then(() => {
            buildCustomLayerToggles();
          });
        })
        .catch(err => {
          console.error('Fehler beim Laden des GeoJSON-Manifests:', err);
          document.getElementById('customLayerToggles').innerHTML = '<p class="text-xs text-[var(--text-muted)]">Keine zusätzlichen Ebenen gefunden.</p>';
        });
    }

    function addCustomGeoJsonLayer(id, name, geojson, visible) {
      const sourceId = `custom-source-${id}`;
      const fillId = `custom-fill-${id}`;
      const lineId = `custom-line-${id}`;
      const labelId = `custom-label-${id}`;

      if (state.map.getSource(sourceId)) state.map.removeSource(sourceId);
      if (state.map.getLayer(fillId)) state.map.removeLayer(fillId);
      if (state.map.getLayer(lineId)) state.map.removeLayer(lineId);
      if (state.map.getLayer(labelId)) state.map.removeLayer(labelId);

      state.map.addSource(sourceId, { type: 'geojson', data: geojson });

      state.map.addLayer({
        id: fillId,
        type: 'fill',
        source: sourceId,
        paint: {
          'fill-color': 'transparent',
          'fill-opacity': 0
        }
      });

      state.map.addLayer({
        id: lineId,
        type: 'line',
        source: sourceId,
        paint: {
          'line-color': '#000000',
          'line-width': 3,
          'line-opacity': 1
        }
      });

      state.map.addLayer({
        id: labelId,
        type: 'symbol',
        source: sourceId,
        layout: {
          'text-field': ['coalesce', ['get', 'Name'], ''],
          'text-size': 11,
          'text-anchor': 'center',
          'text-allow-overlap': true,
          'text-ignore-placement': true
        },
        paint: {
          'text-color': '#000000',
          'text-halo-color': '#ffffff',
          'text-halo-width': 1.5
        }
      });

      if (!visible) {
        state.map.setLayoutProperty(fillId, 'visibility', 'none');
        state.map.setLayoutProperty(lineId, 'visibility', 'none');
        state.map.setLayoutProperty(labelId, 'visibility', 'none');
      }
    }

    function toggleCustomLayer(id, visible) {
      const layer = state.customLayers.find(l => l.id === id);
      if (layer) layer.visible = visible;

      const visibility = visible ? 'visible' : 'none';
      state.map.setLayoutProperty(`custom-fill-${id}`, 'visibility', visibility);
      state.map.setLayoutProperty(`custom-line-${id}`, 'visibility', visibility);
      state.map.setLayoutProperty(`custom-label-${id}`, 'visibility', visibility);
    }

    function buildCustomLayerToggles() {
      const container = document.getElementById('customLayerToggles');
      container.innerHTML = '';

      if (!state.customLayers || state.customLayers.length === 0) {
        container.innerHTML = '<p class="text-xs text-[var(--text-muted)]">Keine zusätzlichen Ebenen gefunden.</p>';
        return;
      }

      state.customLayers.forEach(layer => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-center gap-2';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = layer.visible;
        checkbox.className = 'rounded border-[var(--border-color)] accent-orange-500 w-4 h-4';
        checkbox.addEventListener('change', (e) => {
          toggleCustomLayer(layer.id, e.target.checked);
        });

        const label = document.createElement('span');
        label.className = 'text-xs text-[var(--text-main)]';
        label.textContent = layer.name;

        wrapper.appendChild(checkbox);
        wrapper.appendChild(label);
        container.appendChild(wrapper);
      });
    }

    function initMap() {
      let map = new maplibregl.Map({
        container: 'map',
        style: MAP_STYLES[0].url,
        center: [13.41, 52.56],
        zoom: 11,
        minZoom: 9,
        maxBounds: [[13.25, 52.35], [13.60, 52.70]],
        attributionControl: false
      });
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();
      state.map = map;

      map.addControl(new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true,
        showAccuracyCircle: true
      }), 'bottom-right');

      map.on('load', () => {
        loadGeoJson();
        loadCustomGeoJsonLayers();
      });

      // Wenn der Kartenstil gewechselt wird, lädt MapLibre den Stil neu -> GeoJSON-Layer danach wieder hinzufügen
      map.on('style.load', () => {
        state.layerAdded = false;
        if (state.geojsonData) {
          addGeoJsonToMap();
        }
        if (state.customLayers && state.customLayers.length > 0) {
          state.customLayers.forEach(layer => {
            const geojson = state.customLayersData[layer.id];
            if (geojson) {
              addCustomGeoJsonLayer(layer.id, layer.name, geojson, layer.visible);
            }
          });
        }
      });

      map.on('click', 'geojson-fill', (e) => {
        if (!e.features.length) return;
        let feature = e.features[0];
        state.selectedFeature = feature;
        updateChart(feature);
        updateInfoPanel(feature);
        openBottomSheet();

        if (state.marker) state.marker.remove();
        state.marker = new maplibregl.Marker({ color: '#f97316' })
          .setLngLat(e.lngLat)
          .addTo(map);
      });

      map.on('mousemove', 'geojson-fill', (e) => {
        if (!e.features.length) return;
        let feature = e.features[0];
        let props = feature.properties;
        let tooltip = document.getElementById('tooltip');

        let html = `<div class="font-bold text-[var(--text-main)] mb-1">UWB: ${props.UWB} (${props.UWB3 || ''})</div>`;
        if (state.party === 'Gewinner') {
          let w21 = getWinningParty(feature, 2021);
          let w23 = getWinningParty(feature, 2023);
          html += `<div>Gewinner 2021: <span style="color:${getPartyColor(w21)}">${w21}</span></div>`;
          html += `<div>Gewinner 2023: <span style="color:${getPartyColor(w23)}">${w23}</span></div>`;
        } else {
          let v21 = parseFloat(props[getPropKey(2021, state.election, state.party, 'anteil')]);
          let v23 = parseFloat(props[getPropKey(2023, state.election, state.party, 'anteil')]);
          if (!isNaN(v21)) html += `<div>2021: ${(v21 * 100).toFixed(1)}%</div>`;
          if (!isNaN(v23)) html += `<div>2023: ${(v23 * 100).toFixed(1)}%</div>`;
        }

        tooltip.innerHTML = html;
        tooltip.style.display = 'block';
        let container = document.getElementById('map');
        let rect = container.getBoundingClientRect();
        tooltip.style.left = (e.originalEvent.clientX - rect.left + 15) + 'px';
        tooltip.style.top = (e.originalEvent.clientY - rect.top - 10) + 'px';
      });

      map.on('mouseleave', 'geojson-fill', () => {
        document.getElementById('tooltip').style.display = 'none';
      });
    }

    function loadGeoJson() {
      fetch('Pankow_UWB_geschaetzte_Ergebnisse.geojson')
        .then(res => res.json())
        .then(data => {
          state.geojsonData = data;
          updateMapColors();
          if (!state.layerAdded && state.map) {
            addGeoJsonToMap();
          }
          updateLegend();
        })
        .catch(err => console.error('GeoJSON Ladefehler:', err));
    }

    function addGeoJsonToMap() {
      if (state.map.getSource('geojson-layer')) {
        if (state.map.getLayer('geojson-fill')) state.map.removeLayer('geojson-fill');
        state.map.removeSource('geojson-layer');
      }
      state.map.addSource('geojson-layer', { type: 'geojson', data: state.geojsonData });
      state.map.addLayer({
        id: 'geojson-fill',
        type: 'fill',
        source: 'geojson-layer',
        paint: {
          'fill-color': ['get', 'fillColor'],
          'fill-opacity': 0.82,
          'fill-outline-color': document.body.classList.contains('light-theme') ? '#94a3b8' : '#111827'
        }
      });
      state.layerAdded = true;
      updateMapColors();
    }

    function updateMapColors() {
      if (!state.geojsonData) return;
      state.geojsonData.features.forEach(f => {
        f.properties.fillColor = getFillColor(f);
      });
      if (state.map && state.map.getSource('geojson-layer')) {
        state.map.getSource('geojson-layer').setData(state.geojsonData);
      }
      updateSubHeader();
    }

    // Wechsel des Kartenstils und White Mode / Dark Mode[cite: 2]
    function setMapStyle(index) {
      state.currentStyleIndex = index;
      let styleConfig = MAP_STYLES[index];
      
      if (styleConfig.isLight) {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }

      state.map.setStyle(styleConfig.url);
    }

    function updateLegend() {
      let legend = document.getElementById('legend');
      let html = '';
      if (state.party === 'Gewinner') {
        html += `<h4 class="font-bold text-[var(--text-main)] mb-2">Stärkste Partei</h4><div class="space-y-1">`;
        PARTIES.forEach(p => {
          html += `<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${p.color}"></span><span class="text-[var(--text-main)]">${p.name}</span></div>`;
        });
        html += `</div>`;
      } else if (state.yearMode === 'compare') {
        html += `<h4 class="font-bold text-[var(--text-main)] mb-1">Veränderung '21 &rarr; '23</h4>`;
        html += `<div class="h-2 rounded my-1.5" style="background: linear-gradient(to right, #ef4444, #6b7280, ${getPartyColor(state.party)});"></div>`;
        html += `<div class="flex justify-between text-[10px] text-[var(--text-muted)]"><span>Verlust</span><span>Gewinn</span></div>`;
      } else {
        html += `<h4 class="font-bold text-[var(--text-main)] mb-1">${state.yearMode} (${getPartyName(state.party)})</h4>`;
        html += `<div class="h-2 rounded my-1.5" style="background: linear-gradient(to right, #6b7280, ${getPartyColor(state.party)});"></div>`;
        html += `<div class="flex justify-between text-[10px] text-[var(--text-muted)]"><span>0%</span><span>50%+</span></div>`;
      }
      legend.innerHTML = html;
    }

    function updateSubHeader() {
      let modeText = state.yearMode === 'compare' ? 'Vergleich 2021/2023' : `Jahr ${state.yearMode}`;
      let partyText = state.party === 'Gewinner' ? 'Stärkste Partei (Gewinner)' : getPartyName(state.party);
      document.getElementById('subHeaderStatus').innerText = `${ELECTIONS[state.election].label} &middot; ${modeText} &middot; ${partyText}`;
    }

    function populatePartyOptions() {
      let container = document.getElementById('partyRadioGroup');
      container.innerHTML = '';

      let gewinnerLabel = document.createElement('label');
      gewinnerLabel.className = `cursor-pointer bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-xs font-medium text-[var(--text-muted)] hover:border-gray-500 transition flex items-center gap-2 ${state.party === 'Gewinner' ? 'bg-orange-500/20 border-orange-500 text-orange-500 font-bold' : ''}`;
      gewinnerLabel.innerHTML = `<input type="radio" name="party" value="Gewinner" ${state.party === 'Gewinner' ? 'checked' : ''} class="hidden"> <span>🏆 Stärkste Partei</span>`;
      container.appendChild(gewinnerLabel);

      PARTIES.forEach(p => {
        let lbl = document.createElement('label');
        let isChecked = state.party === p.key;
        lbl.className = `cursor-pointer bg-[var(--bg-main)] border border-[var(--border-color)] rounded-xl p-2.5 text-xs font-medium text-[var(--text-muted)] hover:border-gray-500 transition flex items-center gap-2 ${isChecked ? 'bg-orange-500/20 border-orange-500 text-orange-500 font-bold' : ''}`;
        lbl.innerHTML = `<input type="radio" name="party" value="${p.key}" ${isChecked ? 'checked' : ''} class="hidden"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${p.color}"></span><span class="text-[var(--text-main)]">${p.name}</span>`;
        container.appendChild(lbl);
      });
    }

    function updateChart(feature) {
      let props = feature.properties;
      let labels = PARTIES.map(p => p.name);
      let d21 = PARTIES.map(p => parseFloat(props[getPropKey(2021, state.election, p.key, 'anteil')] || 0) * 100);
      let d23 = PARTIES.map(p => parseFloat(props[getPropKey(2023, state.election, p.key, 'anteil')] || 0) * 100);
      let bgColors = PARTIES.map(p => p.color);
      let isLight = document.body.classList.contains('light-theme');

      let gridColor = isLight ? '#e2e8f0' : '#2a2e39';
      let tickColor = isLight ? '#64748b' : '#9ca3af';
      let mainTextColor = isLight ? '#1e293b' : '#f3f4f6';

      if (!state.chart) {
        let ctx = document.getElementById('resultChart').getContext('2d');
        state.chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { label: '2021', data: d21, backgroundColor: isLight ? '#94a3b8' : '#4b5563', borderRadius: 4 },
              { label: '2023', data: d23, backgroundColor: bgColors, borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            scales: {
              x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } }, max: Math.max(...d21, ...d23, 30) + 5 },
              y: { grid: { display: false }, ticks: { color: mainTextColor, font: { size: 11, weight: 'bold' } } }
            },
            plugins: { legend: { labels: { color: tickColor, font: { size: 10 } } } }
          }
        });
      } else {
        state.chart.options.scales.x.grid.color = gridColor;
        state.chart.options.scales.x.ticks.color = tickColor;
        state.chart.options.scales.y.ticks.color = mainTextColor;
        state.chart.data.datasets[0].data = d21;
        state.chart.data.datasets[1].data = d23;
        state.chart.update();
      }
    }

    function updateInfoPanel(feature) {
      let props = feature.properties;
      document.getElementById('sheetTitle').innerText = `Bezirk: ${props.UWB} (${props.UWB3 || 'Pankow'})`;

      let html = `<div class="grid grid-cols-2 gap-2 text-xs font-semibold text-[var(--text-muted)] pb-2 border-b border-[var(--border-color)]"><span>Partei</span><span class="text-right">2021 / 2023 (&plusmn;)</span></div>`;

      PARTIES.forEach(p => {
        let v21 = parseFloat(props[getPropKey(2021, state.election, p.key, 'anteil')]);
        let v23 = parseFloat(props[getPropKey(2023, state.election, p.key, 'anteil')]);
        let diff = (!isNaN(v21) && !isNaN(v23)) ? (v23 - v21) * 100 : null;
        let diffStr = diff !== null ? `${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%` : '—';
        let diffColor = diff !== null ? (diff >= 0 ? 'text-green-500' : 'text-red-500') : 'text-gray-500';

        html += `
          <div class="flex items-center justify-between py-1.5 border-b border-[var(--border-color)]/40 text-xs">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full shrink-0" style="background:${p.color}"></span>
              <span class="font-medium text-[var(--text-main)]">${p.name}</span>
            </div>
            <div class="text-right">
              <span class="text-[var(--text-muted)]">${!isNaN(v21) ? (v21 * 100).toFixed(1) + '%' : '—'} &rarr; ${!isNaN(v23) ? (v23 * 100).toFixed(1) + '%' : '—'}</span>
              <span class="ml-1.5 font-bold ${diffColor}">${diffStr}</span>
            </div>
          </div>
        `;
      });
      document.getElementById('infoContent').innerHTML = html;
    }

    function openBottomSheet() {
      document.getElementById('bottomSheet').classList.add('open');
    }

    function closeBottomSheet() {
      document.getElementById('bottomSheet').classList.remove('open');
    }

    function toggleMenu(open) {
      let drawer = document.getElementById('menuDrawer');
      let overlay = document.getElementById('menuOverlay');
      if (open) {
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.classList.add('opacity-100'), 10);
        drawer.classList.remove('translate-x-full');
      } else {
        drawer.classList.add('translate-x-full');
        overlay.classList.remove('opacity-100');
        setTimeout(() => overlay.classList.add('hidden'), 300);
      }
    }

    // Event Listeners
    document.getElementById('electionSelect').addEventListener('change', e => {
      state.election = e.target.value;
      updateMapColors();
      updateLegend();
      if (state.selectedFeature) { updateChart(state.selectedFeature); updateInfoPanel(state.selectedFeature); }
    });

    document.querySelectorAll('input[name="yearMode"]').forEach(input => {
      input.addEventListener('change', e => {
        state.yearMode = e.target.value;
        updateMapColors();
        updateLegend();
        if (state.selectedFeature) { updateChart(state.selectedFeature); updateInfoPanel(state.selectedFeature); }
      });
    });

    document.getElementById('partyRadioGroup').addEventListener('change', e => {
      state.party = e.target.value;
      populatePartyOptions();
      updateMapColors();
      updateLegend();
      if (state.selectedFeature) { updateChart(state.selectedFeature); updateInfoPanel(state.selectedFeature); }
    });

    // Theme & Kartenstil Durchschalten per Topbar-Button[cite: 2]
    document.getElementById('btnThemeToggle').addEventListener('click', () => {
      let nextIdx = (state.currentStyleIndex + 1) % MAP_STYLES.length;
      setMapStyle(nextIdx);
    });

    // Menü Kartenstil Buttons
    document.querySelectorAll('.map-style-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        let idx = parseInt(e.currentTarget.getAttribute('data-style-idx'));
        setMapStyle(idx);
        toggleMenu(false);
      });
    });

    document.getElementById('searchField').addEventListener('input', e => {
      let q = e.target.value.toLowerCase().trim();
      if (!q || !state.geojsonData) return;
      let filtered = JSON.parse(JSON.stringify(state.geojsonData));
      filtered.features = filtered.features.filter(f => f.properties.UWB.toLowerCase().includes(q) || (f.properties.UWB3 && f.properties.UWB3.toLowerCase().includes(q)));
      if (state.map.getSource('geojson-layer')) {
        state.map.getSource('geojson-layer').setData(filtered);
      }
    });

    document.getElementById('btnOpenMenu').addEventListener('click', () => toggleMenu(true));
    document.getElementById('btnCloseMenu').addEventListener('click', () => toggleMenu(false));
    document.getElementById('menuOverlay').addEventListener('click', () => toggleMenu(false));
    document.getElementById('btnCloseSheet').addEventListener('click', closeBottomSheet);
    document.getElementById('bottomSheetHandle').addEventListener('click', closeBottomSheet);

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      populatePartyOptions();
    });
  </script>
</body>
</html>
