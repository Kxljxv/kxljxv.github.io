<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenbank-Explorer (LDK-26-1-Schnell)</title>
    <!-- CSS für DataTables und Bootstrap -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .nav-tab { padding: 10px 20px; cursor: pointer; border-radius: 8px 8px 0 0; background: #eee; border: none; font-weight: bold; transition: background 0.2s; }
        .nav-tab.active { background: #4a90e2; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100% !important; border-collapse: collapse; }
        th { background-color: #f2f2f2; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; color: white; }
        .pos-badge { font-family: monospace; font-weight: bold; color: #4a90e2; }
        a { color: #4a90e2; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>Datenbank-Explorer</h1>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="showTab('amendments', this)">Anträge (Amendments)</button>
        <button class="nav-tab" onclick="showTab('persons', this)">Personen</button>
    </div>

    <div id="amendments" class="tab-content active">
        <table id="amendmentsTable" class="display responsive nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titel</th>
                    <th>Status</th>
                    <th>Position (1D)</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="persons" class="tab-content">
        <table id="personsTable" class="display responsive nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Position (1D)</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Scripts: jQuery, DataTables -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

<script>
    const statusMap = {
        3: { text: "Geprüft", color: "#e67e22" },
        15: { text: "Unterstützer sammeln", color: "#27ae60" },
        3: { text: "Abgelehnt", color: "#c0392b" },
        4: { text: "Zurückgezogen", color: "#f1c40f" },
        5: { text: "Überwiesen", color: "#8e44ad" },
        6: { text: "Sonstiges", color: "#34495e" }
    };

    function showTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (element) element.classList.add('active');
    }

    $(document).ready(function() {
        $.getJSON('db_export.json', function(data) {
            
            // Anträge Tabelle
            $('#amendmentsTable').DataTable({
                data: data.amendments,
                columns: [
                    { data: 'id' },
                    { data: 'title' },
                    { 
                        data: 'status_id',
                        render: function(data) {
                            const s = statusMap[data] || { text: "Unbekannt", color: "#95a5a6" };
                            return `<span class="status-badge" style="background:${s.color}">${s.text}</span>`;
                        }
                    },
                    { 
                        data: 'pos_1d',
                        render: function(data) {
                            return (typeof data === 'number') ? `<span class="pos-badge">${data.toFixed(4)}</span>` : "N/A";
                        }
                    },
                    {
                        data: 'id',
                        render: function(data) {
                            // Beispiel-Link-Struktur, falls bekannt. Sonst Platzhalter.
                            return `<a href="https://ldk-berlin.antragsgruen.de/ldk261/amendment/${data}" target="_blank">🔗 Öffnen</a>`;
                        }
                    }
                ],
                order: [[3, 'asc']], // Nach Position sortieren
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.7/i18n/de-DE.json'
                }
            });

            // Personen Tabelle
            $('#personsTable').DataTable({
                data: data.persons,
                columns: [
                    { data: 'id' },
                    { data: 'name' },
                    { 
                        data: 'pos_1d',
                        render: function(data) {
                            return (typeof data === 'number') ? `<span class="pos-badge">${data.toFixed(4)}</span>` : "N/A";
                        }
                    },
                    {
                        data: 'id',
                        render: function(data) {
                            return `<a href="https://ldk-berlin.antragsgruen.de/ldk261/person/${data}" target="_blank">👤 Profil</a>`;
                        }
                    }
                ],
                order: [[2, 'asc']], // Nach Position sortieren
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.7/i18n/de-DE.json'
                }
            });
        });
    });
</script>

</body>
</html>
