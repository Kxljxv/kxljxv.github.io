<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1D Barycentric Layout - Zoomable</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
        #toolbar { padding: 15px; border-bottom: 1px solid #ccc; width: 100%; text-align: center; background: #f4f4f4; z-index: 10; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; background: #2ecc71; color: white; border: none; border-radius: 4px; margin: 0 5px; }
        button.reset { background: #95a5a6; }
        button:hover { opacity: 0.8; }
        svg { width: 100vw; height: 100vh; cursor: move; }
        .link { fill: none; stroke: #999; stroke-opacity: 0.2; }
        .node { fill: #4a90e2; stroke: #fff; stroke-width: 1px; transition: opacity 0.3s, fill 0.3s; }
        .node.match { fill: #e74c3c; stroke: #000; stroke-width: 2px; }
        .node.dimmed { opacity: 0.2; }
        .label { font-size: 11px; fill: #555; pointer-events: none; transition: opacity 0.3s, font-size 0.3s; }
        .label.match { font-weight: bold; fill: #000; font-size: 14px; }
        .label.dimmed { opacity: 0.1; }
        .density-path { fill: #4a90e2; fill-opacity: 0.15; stroke: #4a90e2; stroke-width: 2px; }
        .axis-line { stroke: #ddd; stroke-width: 1px; }
        #search-container { margin-top: 10px; }
        #searchInput { padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        #searchInput:focus { border-color: #2ecc71; }
        .iteration-control { display: inline-flex; align-items: center; gap: 5px; margin: 0 10px; }
        #iterCount { width: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div id="toolbar">
    <div class="iteration-control">
        <input type="number" id="iterCount" value="1" min="1" max="500">
        <button onclick="runIterations()">Iterate & Normalize</button>
    </div>
    <button class="reset" onclick="resetZoom()">Reset Zoom</button>
    <button onclick="exportPositions()" style="background: #3498db;">Export JSON</button>
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Search for nodes by name or ID..." oninput="handleSearch()">
    </div>
    <p><small>Scroll to Zoom, Click & Drag to Pan. Nodes move to weighted middle of neighbors.</small></p>
</div>

<svg id="canvas"></svg>

<script>
    let nodes = [];
    let links = [];
    let nodeMap = new Map(); // For fast lookup
    let adj = new Map();     // Adjacency list for fast iterations
    const width = window.innerWidth;
    const height = window.innerHeight;
    const margin = 120;
    const centerY = height * 0.6; 

    const svg = d3.select("#canvas");
    
    // Create a zoom-able container
    const zoomContainer = svg.append("g");

    // Initialize Zoom behavior
    const zoom = d3.zoom()
        .scaleExtent([0.1, 10]) // Min zoom 0.1x, Max zoom 10x
        .on("zoom", (event) => {
            zoomContainer.attr("transform", event.transform);
        });

    svg.call(zoom);

    // Add baseline inside zoom container
    zoomContainer.append("line")
        .attr("class", "axis-line")
        .attr("x1", -width * 5) // Extend line far for panning
        .attr("x2", width * 5)
        .attr("y1", centerY)
        .attr("y2", centerY);

    const densityArea = zoomContainer.append("path").attr("class", "density-path");
    const linkGroup = zoomContainer.append("g");
    const nodeGroup = zoomContainer.append("g");
    const labelGroup = zoomContainer.append("g");

    // Load GEXF
    d3.xml("./graph.gexf").then(xml => {
        nodes = Array.from(xml.querySelectorAll("node")).map(d => ({
            id: d.getAttribute("id"),
            label: d.getAttribute("label") || d.getAttribute("id"),
            x: Math.random() * 2 - 1 
        }));

        links = Array.from(xml.querySelectorAll("edge")).map(d => ({
            source: d.getAttribute("source"),
            target: d.getAttribute("target"),
            weight: parseFloat(d.getAttribute("weight")) || 1
        }));

        // Pre-calculate for performance
        nodeMap.clear();
        nodes.forEach((n, i) => {
            n.index = i;
            nodeMap.set(n.id, n);
        });

        adj.clear();
        nodes.forEach(n => adj.set(n.index, []));
        links.forEach(l => {
            const s = nodeMap.get(l.source);
            const t = nodeMap.get(l.target);
            if (s && t) {
                adj.get(s.index).push({ targetIndex: t.index, weight: l.weight });
                adj.get(t.index).push({ targetIndex: s.index, weight: l.weight });
            }
        });

        updateVisualization();
    }).catch(e => console.error("Please run via a local server to load GEXF", e));

    function kernelDensityEstimator(kernel, x) {
        return function(sample) {
            return x.map(v => [v, d3.mean(sample, d => kernel(v - d))]);
        };
    }

    function kernelEpanechnikov(k) {
        return v => Math.abs(v /= k) <= 1 ? 0.75 * (1 - v * v) / k : 0;
    }

    function runIterations() {
        const count = parseInt(document.getElementById("iterCount").value) || 1;
        for (let i = 0; i < count; i++) {
            iterateLayout(false); // iterate without updating UI
        }
        updateVisualization(); // Update UI once at the end
    }

    function iterateLayout(updateUI = true) {
        const maxDepth = 5;
        const memoSize = nodes.length * (maxDepth + 1);
        const memo = new Float64Array(memoSize);

        const newPositions = nodes.map(node => {
            memo.fill(-999); // Use -999 as sentinel for uncalculated values
            const excludeIndex = node.index;

            function getBarycentricRecursive(nodeIndex, depth) {
                const key = nodeIndex * (maxDepth + 1) + depth;
                if (memo[key] !== -999) return memo[key];

                if (depth === 0) {
                    return nodes[nodeIndex].x;
                }

                const neighbors = adj.get(nodeIndex) || [];
                let weightedSum = 0, totalWeight = 0;
                let count = 0;

                for (let i = 0; i < neighbors.length; i++) {
                    const link = neighbors[i];
                    if (link.targetIndex === excludeIndex) continue;

                    const neighborPos = getBarycentricRecursive(link.targetIndex, depth - 1);
                    weightedSum += neighborPos * link.weight;
                    totalWeight += link.weight;
                    count++;
                }

                const result = count === 0 ? nodes[nodeIndex].x : weightedSum / totalWeight;
                memo[key] = result;
                return result;
            }

            // Stage 5 recursive calculation
            const barycentricX = getBarycentricRecursive(node.index, maxDepth);
            
            // Apply piecewise gravity force towards center (0)
            const u = Math.abs(0.12 * barycentricX);
            let gravityStrength;
            
            if (u > 1) {
                gravityStrength = 1;
            } else if (u < 0.5) {
                gravityStrength = 4 * Math.pow(u, 3);
            } else {
                // 0.5 <= u <= 1
                gravityStrength = 1 - Math.pow(-2 * u + 2, 3) / 2;
            }

            return barycentricX * (1 - gravityStrength);
        });

        nodes.forEach((n, i) => n.x = newPositions[i]);

        // Quantile-based normalization:
        // 10th percentile (90% are greater) -> maps to -1
        // 90th percentile (90% are lower) -> maps to 1
        const xValues = nodes.map(d => d.x).sort((a, b) => a - b);
        const p10 = d3.quantile(xValues, 0.1);
        const p90 = d3.quantile(xValues, 0.9);

        if (p90 !== p10) {
            nodes.forEach(n => {
                // Linear transformation: (x - p10) / (p90 - p10) * 2 - 1
                n.x = ((n.x - p10) / (p90 - p10)) * 2 - 1;
            });
        }

        if (updateUI) updateVisualization();
    }

    function resetZoom() {
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
    }

    function exportPositions() {
        const data = nodes.map(n => ({
            name: n.label,
            id: n.id,
            value: n.x
        }));
        
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "positions.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function handleSearch() {
        const term = document.getElementById("searchInput").value.toLowerCase();
        
        const nodes_selection = nodeGroup.selectAll(".node");
        const labels_selection = labelGroup.selectAll(".label");

        if (!term) {
            nodes_selection.classed("match", false).classed("dimmed", false).attr("r", 5);
            labels_selection.classed("match", false).classed("dimmed", false);
            return;
        }

        nodes_selection.each(function(d) {
            const isMatch = (d.label && d.label.toLowerCase().includes(term)) || 
                            (d.id && d.id.toLowerCase().includes(term));
            d3.select(this)
                .classed("match", isMatch)
                .classed("dimmed", !isMatch)
                .attr("r", isMatch ? 8 : 5);
        });

        labels_selection.each(function(d) {
            const isMatch = (d.label && d.label.toLowerCase().includes(term)) || 
                            (d.id && d.id.toLowerCase().includes(term));
            d3.select(this)
                .classed("match", isMatch)
                .classed("dimmed", !isMatch);
        });
    }

    function updateVisualization() {
        const xScale = d3.scaleLinear().domain([-2, 2]).range([margin, width - margin]);

        // 1. Density
        // Evaluate KDE on 200 points across the [-2, 2] range
        const densityPoints = d3.range(-2, 2.02, 0.02); 
        const kde = kernelDensityEstimator(kernelEpanechnikov(0.15), densityPoints);
        const density = kde(nodes.map(d => d.x));
        const maxDensity = d3.max(density, d => d[1]);
        const yScale = d3.scaleLinear().domain([0, maxDensity || 1]).range([0, 200]);

        const area = d3.area()
            .curve(d3.curveBasis)
            .x(d => xScale(d[0]))
            .y0(centerY)
            .y1(d => centerY - yScale(d[1]));

        densityArea.transition().duration(500).attr("d", area(density));

        // 2. Nodes
        const n = nodeGroup.selectAll(".node").data(nodes);
        n.enter().append("circle").attr("class", "node").attr("r", 5)
            .merge(n)
            .transition().duration(500)
            .attr("cx", d => xScale(d.x))
            .attr("cy", centerY);

        // 3. Labels
        const txt = labelGroup.selectAll(".label").data(nodes);
        txt.enter().append("text").attr("class", "label")
            .merge(txt)
            .transition().duration(500)
            .attr("transform", d => `translate(${xScale(d.x)}, ${centerY + 15}) rotate(45)`)
            .text(d => d.label);
            
        n.exit().remove();
        txt.exit().remove();

        handleSearch();
    }
</script>
</body>
</html>
