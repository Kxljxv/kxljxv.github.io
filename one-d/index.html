<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>1D Personen-Layout</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
        #toolbar { padding: 15px; border-bottom: 1px solid #ccc; width: 100%; text-align: center; background: #f4f4f4; z-index: 10; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; background: #2ecc71; color: white; border: none; border-radius: 4px; margin: 0 5px; }
        button.reset { background: #95a5a6; }
        button:hover { opacity: 0.8; }
        #container { position: relative; width: 100vw; height: 100vh; }
        svg, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        svg { pointer-events: none; z-index: 1; }
        canvas { cursor: move; z-index: 2; }
        .density-path { fill: #4a90e2; fill-opacity: 0.15; stroke: #4a90e2; stroke-width: 2px; }
        .axis-line { stroke: #ddd; stroke-width: 1px; }
        #search-container { margin-top: 10px; }
        #searchInput { padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        #searchInput:focus { border-color: #2ecc71; }
        .iteration-control { display: inline-flex; align-items: center; gap: 5px; margin: 0 10px; }
        #iterCount { width: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div id="toolbar">
    <div class="iteration-control">
        <input type="number" id="iterCount" value="10" min="1" max="500">
        <button onclick="runIterations()">Iterate & Normalize</button>
    </div>
    <button class="reset" onclick="resetZoom()">Reset Zoom</button>
    <button onclick="exportPositions()" style="background: #3498db;">Export JSON</button>
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Suche Personen..." oninput="handleSearch()">
    </div>
    <div style="margin-top: 10px;">
        <a href="openord_web.html" style="color: #3498db; text-decoration: none; font-weight: bold;">→ Zum OpenOrd Netzwerk-Explorer</a>
    </div>
    <p><small>Scroll zum Zoomen, Klicken & Ziehen zum Pannen. Performance-optimiert mit Canvas.</small></p>
</div>

<div id="container">
    <svg id="canvas-svg"></svg>
    <canvas id="main-canvas"></canvas>
</div>

<script>
    let personNodes = [];
    let amendmentNodes = [];
    let personMap = new Map();
    
    // Performance Arrays
    let personX; // Float64Array
    let amendmentX; // Float64Array
    
    const width = window.innerWidth;
    const height = window.innerHeight;
    const margin = 120;
    const centerY = height * 0.6;

    const canvas = document.getElementById("main-canvas");
    const ctx = canvas.getContext("2d");
    const svg = d3.select("#canvas-svg");
    
    // Scale canvas for high DPI
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    const zoomContainer = svg.append("g");
    let currentTransform = d3.zoomIdentity;

    const zoom = d3.zoom()
        .scaleExtent([0.05, 50])
        .on("zoom", event => {
            currentTransform = event.transform;
            zoomContainer.attr("transform", currentTransform);
            draw();
        });

    d3.select(canvas).call(zoom);

    zoomContainer.append("line")
        .attr("class", "axis-line")
        .attr("x1", -width * 100)
        .attr("x2", width * 100)
        .attr("y1", centerY)
        .attr("y2", centerY);

    const densityArea = zoomContainer.append("path").attr("class", "density-path");

    // Datenstrukturen für effiziente Berechnung
    let amendmentData = []; 

    d3.json("./graph_data.json").then(data => {
        const persons = data.persons || [];
        const amendments = data.amendments || [];

        personNodes = persons.map((p, i) => ({
            id: p.id,
            label: p.name || p.id,
            index: i,
            involvedAmendments: [] 
        }));

        personX = new Float64Array(personNodes.length);
        for(let i=0; i<personX.length; i++) personX[i] = Math.random() * 2 - 1;

        personMap.clear();
        personNodes.forEach(n => personMap.set(n.id, n));

        amendmentData = amendments.map((a, aIdx) => {
            const supportersRaw = a.supporters || [];
            const initiatorsRaw = a.initiators || [];

            const participants = [];
            let totalWeight = 0;

            supportersRaw.forEach((pid, idx) => {
                const node = personMap.get(pid);
                if (!node) return;
                const weight = supportersRaw.length > 1 ? (1.5 - 0.5 * (idx / (supportersRaw.length - 1))) : 1.5;
                participants.push({ personIndex: node.index, weight });
                totalWeight += weight;
                node.involvedAmendments.push({ aIdx, weight });
            });

            initiatorsRaw.forEach(pid => {
                const node = personMap.get(pid);
                if (!node) return;
                const weight = 3.0;
                participants.push({ personIndex: node.index, weight });
                totalWeight += weight;
                node.involvedAmendments.push({ aIdx, weight });
            });

            return {
                id: a.id,
                label: a.title || a.id,
                participants,
                totalWeight,
                x: 0
            };
        });

        amendmentX = new Float64Array(amendmentData.length);
        amendmentNodes = amendmentData; 
        updateVisualization();
    });

    window.addEventListener("resize", () => {
        const newWidth = window.innerWidth;
        const newHeight = window.innerHeight;
        canvas.width = newWidth * dpr;
        canvas.height = newHeight * dpr;
        ctx.scale(dpr, dpr);
        // Da die Variablen width/height global genutzt werden, müssen sie aktualisiert werden
        // Aber margin und centerY hängen auch davon ab.
        location.reload(); // Einfachste Lösung für konsistentes Layout bei Resize
    });

    function kernelDensityEstimator(kernel, x) {
        return function(sample) {
            return x.map(v => [v, d3.mean(sample, d => kernel(v - d))]);
        };
    }

    function kernelEpanechnikov(k) {
        return v => Math.abs(v /= k) <= 1 ? 0.75 * (1 - v * v) / k : 0;
    }

    function runIterations() {
        const count = parseInt(document.getElementById("iterCount").value) || 10;
        for (let i = 0; i < count; i++) {
            iterateLayout(false);
        }
        updateVisualization();
    }

    function iterateLayout(updateUI = true) {
        const pLen = personNodes.length;
        const aLen = amendmentData.length;

        // 1. Amendment-Positionen aktualisieren
        for (let i = 0; i < aLen; i++) {
            const a = amendmentData[i];
            let sum = 0;
            const participants = a.participants;
            for (let j = 0; j < participants.length; j++) {
                const p = participants[j];
                sum += personX[p.personIndex] * p.weight;
            }
            amendmentX[i] = a.totalWeight > 0 ? sum / a.totalWeight : 0;
        }

        // 2. Personen-Positionen aktualisieren
        const newX = new Float64Array(pLen);
        for (let i = 0; i < pLen; i++) {
            const node = personNodes[i];
            let weightedSum = 0;
            let totalInfluenceWeight = 0;

            const invAmends = node.involvedAmendments;
            for (let j = 0; j < invAmends.length; j++) {
                const inv = invAmends[j];
                const aIdx = inv.aIdx;
                const a = amendmentData[aIdx];
                const pWeight = inv.weight;

                const restWeight = a.totalWeight - pWeight;
                if (restWeight <= 0) continue;

                const restX = (amendmentX[aIdx] * a.totalWeight - personX[i] * pWeight) / restWeight;
                weightedSum += restX * pWeight;
                totalInfluenceWeight += pWeight;
            }

            let baryX = totalInfluenceWeight > 0 ? weightedSum / totalInfluenceWeight : personX[i];

            // Piecewise Gravity
            const u = Math.abs(0.12 * baryX);
            let gravityStrength;
            if (u > 1) gravityStrength = 1;
            else if (u < 0.5) gravityStrength = 4 * u * u * u;
            else gravityStrength = 1 - Math.pow(-2 * u + 2, 3) / 2;

            newX[i] = baryX * (1 - gravityStrength);
        }

        personX.set(newX);

        // Normalisierung (10/90 Quantil)
        const sortedX = new Float64Array(personX).sort();
        const p10 = d3.quantile(sortedX, 0.1);
        const p90 = d3.quantile(sortedX, 0.9);

        if (p90 !== p10) {
            const range = p90 - p10;
            for (let i = 0; i < pLen; i++) {
                personX[i] = ((personX[i] - p10) / range) * 2 - 1;
            }
        }

        if (updateUI) updateVisualization();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        
        // D3 Zoom Transformation anwenden
        ctx.translate(currentTransform.x, currentTransform.y);
        ctx.scale(currentTransform.k, currentTransform.k);

        const xScale = d3.scaleLinear().domain([-2, 2]).range([margin, width - margin]);
        const term = document.getElementById("searchInput").value.toLowerCase();

        // 1. Personen zeichnen
        for (let i = 0; i < personNodes.length; i++) {
            const p = personNodes[i];
            const x = xScale(personX[i]);
            const y = centerY;
            
            const isMatch = term && (p.label.toLowerCase().includes(term) || p.id.toLowerCase().includes(term));
            
            ctx.beginPath();
            ctx.arc(x, y, isMatch ? 8 : 5, 0, 2 * Math.PI);
            ctx.fillStyle = isMatch ? "#ff0000" : "#4a90e2";
            ctx.globalAlpha = term && !isMatch ? 0.2 : 1.0;
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.stroke();

            if (isMatch || (currentTransform.k > 1.5)) {
                ctx.fillStyle = "#333";
                ctx.globalAlpha = term && !isMatch ? 0.1 : 1.0;
                ctx.font = (isMatch ? "bold 14px" : "11px") + " sans-serif";
                ctx.save();
                ctx.translate(x, y + 15);
                ctx.rotate(Math.PI / 4);
                ctx.fillText(p.label, 0, 0);
                ctx.restore();
            }
        }

        ctx.restore();
    }

    function resetZoom() {
        d3.select(canvas).transition().duration(750).call(zoom.transform, d3.zoomIdentity);
    }

    function exportPositions() {
        const persons = personNodes.map((p, i) => ({
            name: p.label,
            id: p.id,
            value: personX[i]
        }));

        const blob = new Blob([JSON.stringify(persons, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "person_positions.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function handleSearch() {
        draw();
    }

    function updateVisualization() {
        // KDE Bereich im SVG aktualisieren
        const xScale = d3.scaleLinear().domain([-2, 2]).range([margin, width - margin]);
        
        // Performance: KDE nur auf einer Stichprobe berechnen, falls es zu viele Personen sind
        let sample = personX;
        if (personX.length > 2000) {
            sample = new Float64Array(2000);
            for(let i=0; i<2000; i++) {
                sample[i] = personX[Math.floor(Math.random() * personX.length)];
            }
        }

        const densityPoints = d3.range(-2, 2.05, 0.05);
        const kde = kernelDensityEstimator(kernelEpanechnikov(0.15), densityPoints);
        const density = kde(sample);
        const maxDensity = d3.max(density, d => d[1]);
        const yScale = d3.scaleLinear().domain([0, maxDensity || 1]).range([0, 200]);

        const area = d3.area()
            .curve(d3.curveBasis)
            .x(d => xScale(d[0]))
            .y0(centerY)
            .y1(d => centerY - yScale(d[1]));

        densityArea.attr("d", area(density));
        
        draw();
    }
</script>
</body>
</html>
